<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sir Mad Boomer: Rabbit Knight - v0.74 Mobile UI</title>
  <style>
    :root {
      --bg-outer: #0b0c10;
      --bg-app: #13141c;
      --bg-panel: #1a1b26;
      --bg-card: #24283b;
      --border: #414868;
      --text-main: #c0caf5;
      --text-sub: #787c99;
      --accent: #7aa2f7;

      /* 5대 연출 색상 */
      --fx-red: #f7768e;    /* HP 감소 */
      --fx-green: #9ece6a;  /* HP 증가 */
      --fx-purple: #bb9af7; /* 디버프 획득 */
      --fx-blue: #7dcfff;   /* 버프/방어 획득 */
      --fx-yellow: #e0af68; /* 기타 카드 사용 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-outer); color: var(--text-main);
      font-family: 'Pretendard', monospace, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh; overflow: hidden;
    }

    #app {
      width: 100%; max-width: 440px; height: 100%;
      background: var(--bg-app); border: 1px solid var(--border);
      position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .screen {
      display: none; flex-direction: column;
      width: 100%; height: 100%; padding: 12px; gap: 10px;
    }
    .screen.active { display: flex; }
    .hidden { display: none !important; }

    button {
      background: var(--bg-card); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #111; border-color: var(--accent); }

    /* 1. 시작 / 서브 화면 */
    .menu-stack { display: flex; flex-direction: column; gap: 10px; width: 88%; margin: auto; }
    .menu-stack button { padding: 15px; font-size: 14.5px; }
    .screen-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .scroll-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .list-btn { text-align: left; padding: 14px; display: flex; justify-content: space-between; align-items: center; }

    textarea.notepad {
      flex: 1; width: 100%; background: #0d0e14; color: var(--fx-green);
      border: 1px solid var(--border); border-radius: 6px; padding: 10px;
      font-family: monospace; font-size: 12px; resize: none; user-select: text;
    }

    /* 비주얼 노벨 화면 */
    .vn-illust-area {
      flex: 1; background: var(--bg-panel); border: 1px dashed var(--border);
      border-radius: 6px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 12px;
    }
    .vn-textbox {
      min-height: 34%; background: #0e1017; border: 2px solid var(--accent);
      border-radius: 6px; padding: 14px; display: flex; flex-direction: column;
      justify-content: space-between; cursor: pointer;
    }
    .vn-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .vn-choice-btn { text-align: left; background: #1f2335; border: 1px solid var(--accent); padding: 9px 12px; font-size: 12.5px; }

    /* 2. 전투 화면 (15% : 35% : 35% : 15%) */
    #screen-combat { padding: 8px; gap: 6px; position: relative; }

    .actor-box {
      height: 15%; min-height: 82px;
      background: var(--bg-panel); border: 2px solid var(--border); border-radius: 6px;
      padding: 8px 10px; display: flex; gap: 10px; align-items: center;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .avatar-slot {
      width: 56px; height: 56px; background: #111218; border: 1px solid var(--border);
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; color: var(--text-sub); flex-shrink: 0; text-align: center;
      image-rendering: pixelated;
    }
    .actor-detail { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .actor-top-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }

    .hp-bar-outer {
      width: 100%; height: 14px; background: #0d0e14; border: 1px solid #2f3549;
      border-radius: 3px; position: relative; overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%; width: 100%; background: linear-gradient(90deg, #db4b4b, #f7768e);
      transition: width 0.25s ease-out;
    }
    .hp-bar-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000;
    }

    .meta-row { display: flex; justify-content: space-between; align-items: center; min-height: 18px; gap: 6px; }
    .ap-gems { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .ap-gem {
      width: 11px; height: 11px; border-radius: 50%;
      background: #232634; border: 1px solid #414868; transition: 0.15s;
    }
    .ap-gem.on {
      background: #41f075; border-color: #d5ffdf;
      box-shadow: 0 0 6px #41f075;
    }
    .status-mini { display: flex; gap: 4px; font-size: 10.5px; overflow-x: auto; }
    .s-tag {
      padding: 2px 6px; border-radius: 3px; background: #292e42;
      border: 1px solid #414868; cursor: pointer; white-space: nowrap; font-size: 10.5px;
    }
    .s-tag.buff { border-color: var(--fx-blue); color: var(--fx-blue); }
    .s-tag.debuff { border-color: var(--fx-purple); color: var(--fx-purple); }
    .s-tag.context { border-color: var(--fx-yellow); color: var(--fx-yellow); }

    /* 상단 35%: 적 예고 + 로그 + 메뉴 버튼 */
    .log-section {
      height: 35%; background: #0f1016; border: 1px solid var(--border);
      border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative;
    }
    .intent-header { display: flex; gap: 6px; align-items: stretch; }
    .intent-banner {
      flex: 1; background: #261f33; border: 1px solid var(--fx-purple);
      border-radius: 4px; padding: 5px 8px; display: flex; flex-direction: column; justify-content: center;
    }
    .intent-label { font-size: 10px; color: var(--fx-purple); font-weight: bold; }
    .intent-main { font-size: 12.5px; font-weight: 900; color: var(--fx-yellow); margin-top: 2px; line-height: 1.25; }
    .menu-trigger-btn {
      padding: 0 10px; font-size: 11.5px; background: #1f2335; border-color: #565f89; white-space: nowrap;
    }
    .log-scroll {
      flex: 1; overflow-y: auto; font-family: monospace;
      font-size: 11px; color: var(--text-sub); line-height: 1.45;
      display: flex; flex-direction: column; gap: 2px; padding: 2px 4px;
    }
    .log-scroll div.recent { color: var(--text-main); font-weight: bold; }

    /* 전투 중 비주얼노벨 대사 오버레이 (스토리 모드 전용) */
    .combat-vn-overlay {
      position: absolute; inset: 6px; background: rgba(14, 16, 23, 0.95);
      border: 2px solid var(--accent); border-radius: 6px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; z-index: 20;
    }

    /* 하단 35%: 손패 그리드 + 실행 바 */
    .hand-section {
      height: 35%; background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .hand-grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; overflow-y: auto; align-content: start;
    }
    .hand-card {
      background: var(--bg-card); border: 1.5px solid #414868; border-radius: 5px;
      padding: 6px; display: flex; flex-direction: column; gap: 3px;
      cursor: pointer; min-height: 78px; position: relative;
    }
    .hand-card.selected {
      border-color: var(--fx-yellow); background: #2f334d;
      box-shadow: 0 0 8px rgba(224, 175, 104, 0.35);
    }
    .c-cost {
      position: absolute; top: 4px; right: 4px; width: 17px; height: 17px;
      border-radius: 50%; background: var(--accent); color: #111;
      font-size: 10.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .c-name { font-size: 11px; font-weight: bold; color: var(--fx-yellow); padding-right: 18px; word-break: keep-all; }
    .c-type { font-size: 9.5px; color: var(--fx-blue); }
    .c-desc { font-size: 9.5px; color: #a9b1d6; line-height: 1.25; margin-top: 2px; }

    .action-bar { display: flex; gap: 6px; height: 36px; flex-shrink: 0; }
    .action-bar button { flex: 1; padding: 0; font-size: 12px; }
    #btn-exec-card { flex: 1.7; }

    /* 3. 5색 시각 연출 */
    @keyframes box-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .fx-red {
      animation: box-shake 0.32s ease-in-out;
      border-color: var(--fx-red) !important;
      box-shadow: inset 0 0 22px rgba(247, 118, 142, 0.55) !important;
    }
    .fx-green {
      border-color: var(--fx-green) !important;
      box-shadow: inset 0 0 22px rgba(158, 206, 106, 0.5) !important;
    }
    .fx-purple {
      border-color: var(--fx-purple) !important;
      box-shadow: inset 0 0 22px rgba(187, 154, 247, 0.5) !important;
    }
    .fx-blue {
      border-color: var(--fx-blue) !important;
      box-shadow: inset 0 0 22px rgba(125, 207, 255, 0.5) !important;
    }
    .fx-yellow {
      border-color: var(--fx-yellow) !important;
      box-shadow: inset 0 0 22px rgba(224, 175, 104, 0.5) !important;
    }

    /* 모달 */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.82);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      padding: 16px; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: 100%; max-height: 82%; background: var(--bg-panel);
      border: 1px solid var(--border); border-radius: 8px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }
  </style>
</head>
<body>

<div id="app">

  <!-- [1] 게임 시작 화면 -->
  <div id="screen-start" class="screen active">
    <div style="margin: auto 0 10px 0; text-align: center;">
      <div style="width:96px; height:96px; margin:0 auto 12px; border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-sub);">[메인 도트]<br>토끼기사</div>
      <h1 style="font-size: 20px; color: var(--accent);">Sir Mad Boomer</h1>
      <p id="start-subtitle" style="font-size: 11.5px; color: var(--text-sub); margin-top: 6px; line-height: 1.4;">Rabbit Knight</p>
    </div>
    <div class="menu-stack">
      <button onclick="AppUI.go('screen-save')">💾 세이브 관리 (기록장)</button>
      <button onclick="AppUI.go('screen-story-list')">📖 스토리 모드</button>
      <button id="btn-rogue-continue" class="primary hidden" onclick="RogueManager.continueFromSave()">⚔️ 기사도 이어하기</button>
      <button class="primary" onclick="RogueManager.startNewRun()">⚔️ 새 기사도 시작 (1층)</button>
    </div>
  </div>

  <!-- [2] 세이브 관리 -->
  <div id="screen-save" class="screen">
    <div class="screen-header">
      <strong style="color:var(--fx-yellow);">💾 세이브 기록장</strong>
      <button onclick="AppUI.go('screen-start')">뒤로</button>
    </div>
    <div style="font-size:11.5px; color:var(--text-sub);">직접 텍스트를 수정하거나 복사/붙여넣기하여 상태를 덮어씁니다. (# 주석 무시)</div>
    <textarea id="save-textarea" class="notepad" spellcheck="false"></textarea>
    <div style="display:flex; gap:8px;">
      <button class="primary" style="flex:1;" onclick="AppUI.handleSaveImport()">기록 적용하기</button>
      <button style="flex:1;" onclick="AppUI.copySaveText()">전체 복사</button>
    </div>
  </div>

  <!-- [3] 스토리 챕터 선택 -->
  <div id="screen-story-list" class="screen">
    <div class="screen-header">
      <strong style="color:var(--fx-yellow);">📖 스토리 선택</strong>
      <button onclick="AppUI.go('screen-start')">뒤로</button>
    </div>
    <div id="story-chapter-list" class="scroll-list"></div>
  </div>

  <!-- [4] 스토리 비주얼 노벨 화면 -->
  <div id="screen-vn" class="screen">
    <div class="screen-header">
      <span id="vn-chapter-title" style="font-size:12px; color:var(--text-sub);">스토리</span>
      <button onclick="AppUI.returnToLobby()" style="padding:4px 8px; font-size:11px;">포기 / 로비</button>
    </div>
    <div class="vn-illust-area">
      <div id="vn-sprite-slot" class="avatar-slot" style="width:96px; height:96px;">[스탠딩 도트]<br>토끼기사</div>
      <div style="font-size:11px; color:var(--text-sub);">(비주얼 노벨 연출 영역)</div>
    </div>
    <div class="vn-textbox" onclick="StorySequencer.onUserClickDialogue()">
      <div>
        <div id="vn-speaker" style="font-weight:bold; color:var(--fx-yellow); font-size:13px; margin-bottom:6px;"></div>
        <div id="vn-text" style="font-size:13px; line-height:1.5;"></div>
        <div id="vn-choices" class="vn-choices hidden" onclick="event.stopPropagation()"></div>
      </div>
      <div id="vn-next-hint" style="align-self:flex-end; font-size:11px; color:var(--accent); margin-top:6px;">다음 ▶</div>
    </div>
  </div>

  <!-- [5] 전투 화면 (15% : 35% : 35% : 15%) -->
  <div id="screen-combat" class="screen">

    <!-- (최상단 15%) 적 박스 -->
    <div id="box-enemy" class="actor-box">
      <div id="sprite-enemy" class="avatar-slot">[적 도트]<br>64×64</div>
      <div class="actor-detail">
        <div class="actor-top-row">
          <span id="enemy-name-label" style="color:var(--fx-red);">적</span>
          <span id="enemy-armor-label" style="color:var(--fx-blue); font-size:12px;">🛡️ 방어 0</span>
        </div>
        <div class="hp-bar-outer">
          <div id="enemy-hp-fill" class="hp-bar-fill" style="width: 100%;"></div>
          <div id="enemy-hp-text" class="hp-bar-text">0 / 0</div>
        </div>
        <div class="meta-row">
          <div id="enemy-status-list" class="status-mini"></div>
        </div>
      </div>
    </div>

    <!-- (상단 35%) 적 예고 + 상세 로그 + 통합 메뉴 버튼 -->
    <div class="log-section">
      <div class="intent-header">
        <div class="intent-banner">
          <span id="intent-title" class="intent-label">적 다음 행동 예고</span>
          <span id="intent-main" class="intent-main">-</span>
        </div>
        <button class="menu-trigger-btn" onclick="AppUI.openTacticalMenu()">
          📋 메뉴<br><span id="deck-grave-Summary" style="font-size:10px; color:var(--text-sub);">덱0/묘0</span>
        </button>
      </div>

      <div id="log-box" class="log-scroll"></div>

      <!-- 스토리 모드 전투 중 대사 오버레이 -->
      <div id="combat-vn-overlay" class="combat-vn-overlay hidden" onclick="StorySequencer.onUserClickDialogue()">
        <div>
          <div id="combat-vn-speaker" style="font-weight:bold; color:var(--fx-yellow); font-size:13px; margin-bottom:4px;"></div>
          <div id="combat-vn-text" style="font-size:12.5px; line-height:1.45; color:var(--text-main);"></div>
        </div>
        <div id="combat-vn-hint" style="align-self:flex-end; font-size:11px; color:var(--accent);">터치하여 계속 ▶</div>
      </div>
    </div>

    <!-- (하단 35%) 플레이어 손패 + 선택 후 실행 바 -->
    <div class="hand-section">
      <div id="hand-grid" class="hand-grid"></div>
      <div class="action-bar">
        <button id="btn-exec-card" class="primary" disabled onclick="AppUI.executeSelectedCard()">카드를 선택하세요</button>
        <button id="btn-end-turn" onclick="AppUI.onClickEndTurn()">턴 종료</button>
      </div>
    </div>

    <!-- (최하단 15%) 플레이어 박스 -->
    <div id="box-player" class="actor-box">
      <div id="sprite-player" class="avatar-slot">[내 도트]<br>토끼기사</div>
      <div class="actor-detail">
        <div class="actor-top-row">
          <span id="player-name-label" style="color:var(--fx-yellow);">토끼기사</span>
          <span id="player-armor-label" style="color:var(--fx-blue); font-size:12px;">🛡️ 방어 0</span>
        </div>
        <div class="hp-bar-outer">
          <div id="player-hp-fill" class="hp-bar-fill" style="width: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa);"></div>
          <div id="player-hp-text" class="hp-bar-text">150 / 150</div>
        </div>
        <div class="meta-row">
          <div id="player-ap-gems" class="ap-gems"></div>
          <div id="player-status-list" class="status-mini"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- [6] 길 선택 / 캠프 / 보상 선택 화면 -->
  <div id="screen-choice" class="screen">
    <div class="screen-header">
      <strong id="choice-header-title" style="color:var(--fx-yellow);">🧭 진행 선택</strong>
      <div style="display:flex; gap:6px;">
        <button onclick="AppUI.openTacticalMenu()" style="padding:6px 10px; font-size:11.5px;">📋 상태/덱</button>
        <button onclick="AppUI.returnToLobby()" style="padding:6px 10px; font-size:11.5px;">로비로</button>
      </div>
    </div>
    <div id="choice-subtitle" style="font-size:12px; color:var(--text-sub); line-height:1.4;"></div>
    <div id="choice-list" class="scroll-list"></div>
  </div>

  <!-- [모달 1] 통합 전술 메뉴 (특성/유물 터치 설명 + 덱/무덤 카드 조회) -->
  <div id="modal-menu" class="modal-overlay" onclick="AppUI.toggleModal('modal-menu', false)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="screen-header">
        <strong>📋 전술 메뉴 & 상태</strong>
        <button onclick="AppUI.toggleModal('modal-menu', false)" style="padding:4px 10px;">닫기</button>
      </div>
      <div id="menu-status-summary" style="font-size:12px; display:flex; flex-direction:column; gap:8px;"></div>
      <hr style="border-color:var(--border);">
      <div id="menu-pile-buttons" style="display:flex; gap:6px;"></div>
      <button class="primary" onclick="AppUI.toggleModal('modal-menu', false); AppUI.returnToLobby();">💾 세이브 후 타이틀로 돌아가기</button>
    </div>
  </div>

  <!-- [모달 2] 상태이상 / 유물 / 특성 / 카드 목록 팝업 -->
  <div id="modal-info" class="modal-overlay" onclick="AppUI.toggleModal('modal-info', false)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="screen-header">
        <strong id="info-title" style="color:var(--fx-yellow); font-size:14px;">제목</strong>
        <button onclick="AppUI.toggleModal('modal-info', false)" style="padding:4px 10px;">확인</button>
      </div>
      <div id="info-desc" style="font-size:12.5px; color:var(--text-main); line-height:1.5; max-height: 60vh; overflow-y: auto;">설명</div>
    </div>
  </div>

</div>

<script>
/**
 * ============================================================================
 * 1. RNG 모듈
 * ============================================================================
 */
const RNG = {
  riggedQueue: [],
  rigNext(val) { this.riggedQueue.push(val); },
  randInt(min, max) {
    if (this.riggedQueue.length > 0) {
      const rigged = this.riggedQueue.shift();
      return Math.max(min, Math.min(max, rigged));
    }
    return Math.floor(Math.random() * (max - min + 1)) + min;
  },
  pickRandom(arr) {
    if (!arr || !arr.length) return null;
    return arr[this.randInt(0, arr.length - 1)];
  },
  sampleUnique(arr, count) {
    const copy = [...arr];
    const out = [];
    while (copy.length > 0 && out.length < count) {
      const idx = this.randInt(0, copy.length - 1);
      out.push(copy.splice(idx, 1)[0]);
    }
    return out;
  },
  reset() { this.riggedQueue = []; }
};

/**
 * ============================================================================

const SaveLedger = {
  data: {
    'stage_1_1.clear': false,
    'flag.chose_revenge': false,
    'unlocked.cards': '020,013,011',
    'roguelike.active': false,
    'roguelike.floor': 1,
    'roguelike.hp': 150,
    'roguelike.maxHp': 150,
    'roguelike.hitTakenCount': 0,
    'roguelike.deck': '001,001,001,010,010,010,005,005,002,002,011,011',
    'roguelike.relics': '',
    'roguelike.traits': '',
    'roguelike.clearedBosses': ''
  },
  get(key) { return this.data[key]; },
  set(key, value) { this.data[key] = value; },
  exportText() {
    const lines = ['# Sir Mad Boomer Save Data (v0.71)'];
    for (const [k, v] of Object.entries(this.data)) {
      lines.push(`${k} = ${v}`);
    }
    return lines.join('\n');
  },
  importText(rawText) {
    const nextData = {};
    const lines = rawText.split(/\r?\n/);
    for (const rawLine of lines) {
      const cleanLine = rawLine.split('#')[0].trim();
      if (!cleanLine) continue;
      const eqIdx = cleanLine.indexOf('=');
      if (eqIdx === -1) continue;
      const key = cleanLine.slice(0, eqIdx).trim();
      const valStr = cleanLine.slice(eqIdx + 1).trim();
      if (!key) continue;
      if (valStr === 'true') nextData[key] = true;
      else if (valStr === 'false') nextData[key] = false;
      else if (!isNaN(valStr) && valStr !== '' && !valStr.includes(',') && !key.endsWith('deck') && !key.endsWith('relics') && !key.endsWith('traits') && !key.endsWith('cards')) {
        nextData[key] = Number(valStr);
      } else {
        nextData[key] = valStr;
      }
    }
    this.data = { ...this.data, ...nextData };
    return this.data;
  }
};

/**
 * ============================================================================
 * 5. 코어 전투 엔진 (CombatEngine, StatusManager, Entity, DamagePacket)
 * ============================================================================
 */
class DamagePacket {
  constructor({ source, target, amount, type = DAMAGE_TYPE.PHYSICAL, isStrike = false, isBonus = false, reason = '' }) {
    this.source = source;
    this.target = target;
    this.baseAmount = amount;
    this.amount = amount;
    this.type = type;
    this.isStrike = isStrike;
    this.isBonus = isBonus;
    this.reason = reason;
    this.logs = [];
  }
}

class Entity {
  constructor(name, maxHp, isPlayer = false) {
    this.name = name;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.armor = 0;
    this.energy = 0;
    this.maxEnergy = 4;
    this.maxCarryOver = 1;
    this.isPlayer = isPlayer;
    this.enemyId = null;
    this.traits = [];
    this.relics = [];
    this.statuses = [];
    this.deck = [];
    this.hand = [];
    this.graveyard = [];
    this.runTrackers = { hitTakenCount: 0 };
    this.combatTrackers = { lastGraveyardCard: null };
  }

  getPassives() {
    const list = [
      ...this.traits.map(t => ({ def: TraitDB[t.id], inst: t })),
      ...this.relics.map(r => ({ def: RelicDB[r.id], inst: r })),
      ...this.statuses.map(s => ({ def: StatusDB[s.id], inst: s }))
    ].filter(x => x.def);
    return list.sort((a, b) => (a.def.priority || 50) - (b.def.priority || 50));
  }
}

class StatusManager {
  constructor(engine) { this.engine = engine; }
  normalizeId(statusId) { return statusId === 'BABAYAGA' ? 'BABA_YAGA' : statusId; }
  get(target, statusId) { return target.statuses.find(s => s.id === this.normalizeId(statusId)); }

  apply(caster, target, rawStatusId, stacks) {
    const statusId = this.normalizeId(rawStatusId);
    const def = StatusDB[statusId];
    if (!def || stacks <= 0) return;

    let finalStacks = stacks;
    if (caster) {
      caster.getPassives().forEach(({ def: pDef, inst }) => {
        if (pDef.modifyStatusAppliedStacks) {
          finalStacks = pDef.modifyStatusAppliedStacks(finalStacks, caster, target, statusId, inst);
        }
      });
    }

    let inst = this.get(target, statusId);
    if (inst) inst.stacks += finalStacks;
    else {
      inst = { id: statusId, stacks: finalStacks, caster, accumulated: 0 };
      if (def.onInit) def.onInit(inst);
      target.statuses.push(inst);
    }
    this.engine.emitLog(`📌 [상태 부여] ${target.name} <- [${def.name} ${finalStacks}] (현재:${inst.stacks})`, 'log-status');
    // 버프면 파란색(fx-blue), 디버프면 보라색(fx-purple), 턴맥락이면 노란색(fx-yellow) 연출
    const fx = def.category === STATUS_CATEGORY.DEBUFF ? 'fx-purple' : (def.category === STATUS_CATEGORY.BUFF ? 'fx-blue' : 'fx-yellow');
    this.engine.emitFx(target, fx);
    this.engine.notifyRender();
  }

  setOrMaxContext(target, statusId, durationTurns) {
    let inst = this.get(target, statusId);
    if (inst) inst.stacks = Math.max(inst.stacks, durationTurns);
    else target.statuses.push({ id: statusId, stacks: durationTurns, caster: target });
    this.engine.notifyRender();
  }

  tryDecayDebuff(owner, instance, amount) {
    const hasContract = owner.statuses.some(s => StatusDB[s.id].preventsOtherDebuffDecay && s.id !== instance.id && s.stacks > 0);
    if (hasContract) return;
    this.changeStacks(owner, instance, -amount, 'DISPEL');
  }

  changeStacks(owner, instance, delta, mode = 'DISPEL') {
    instance.stacks += delta;
    if (instance.stacks <= 0) {
      const idx = owner.statuses.indexOf(instance);
      if (idx !== -1) owner.statuses.splice(idx, 1);
      const def = StatusDB[instance.id];
      this.engine.emitLog(`💨 [${mode === 'DISPEL' ? '해제' : '제거'}] ${owner.name}의 [${def.name}] 소멸`, 'log-status');
      if (mode === 'DISPEL' && def.onDispel) def.onDispel(this.engine, owner, instance);
    }
    this.engine.notifyRender();
  }

  dispelRandom(target, category) {
    const cands = target.statuses.filter(s => StatusDB[s.id].category === category);
    if (!cands.length) return;
    const pick = cands[RNG.randInt(0, cands.length - 1)];
    this.changeStacks(target, pick, -pick.stacks, 'DISPEL');
  }

  removeRandom(target, category) {
    const cands = target.statuses.filter(s => StatusDB[s.id].category === category);
    if (!cands.length) return;
    const pick = cands[RNG.randInt(0, cands.length - 1)];
    this.changeStacks(target, pick, -pick.stacks, 'REMOVE');
  }

  removeSpecific(target, statusId) {
    const inst = this.get(target, statusId);
    if (!inst) return 0;
    const s = inst.stacks;
    this.changeStacks(target, inst, -s, 'REMOVE');
    return s;
  }

  removeAll(target, categories) {
    const list = target.statuses.filter(s => categories.includes(StatusDB[s.id].category));
    let removedCount = 0, removedStacks = 0;
    list.forEach(inst => {
      removedCount += 1; removedStacks += inst.stacks;
      this.changeStacks(target, inst, -inst.stacks, 'REMOVE');
    });
    return { removedCount, removedStacks };
  }
}

class CombatEngine {
  constructor() {
    this.uidCounter = 1;
    this.replayDepth = 0;
    this.turn = 1;
    this.combatEnded = false;
    this.statuses = new StatusManager(this);
    this.player = new Entity('토끼기사', 150, true);
    this.enemy = new Entity('적', 100, false);

    this.onLogCallback = null;
    this.onRenderCallback = null;
    this.onCardPlayedCallback = null;
    this.onCombatEndCallback = null;
  }

  log(msg, cls = '') { this.emitLog(msg, cls); }
  emitLog(msg, cls = '') { if (this.onLogCallback) this.onLogCallback(msg, cls); }
  notifyRender() { if (this.onRenderCallback) this.onRenderCallback(); }
  getOpponent(entity) { return entity === this.player ? this.enemy : this.player; }

  createCardInstance(cardId, freeCost = false) {
    const def = CardDB[cardId];
    return { uid: `card_${this.uidCounter++}`, ...def, turnCostOverride: freeCost ? 0 : null };
  }

  getEffectiveCost(user, card) {
    let cost = card.turnCostOverride !== null ? card.turnCostOverride : card.cost;
    if (card.modifySelfCost) cost = card.modifySelfCost(cost, this, user);
    return Math.max(0, cost);
  }

  getEffectiveHits(user, card) {
    let hits = card.hits || 0;
    const cost = this.getEffectiveCost(user, card);
    user.getPassives().forEach(({ def, inst }) => {
      if (def.modifyHitCount) hits = def.modifyHitCount(hits, card, cost, this, user, inst);
    });
    return hits;
  }

  // CombatEngine 클래스 내부에 메서드 추가
  emitFx(targetEntity, fxClass) {
    if (this.onFxCallback && targetEntity) {
      this.onFxCallback(targetEntity === this.player ? 'box-player' : 'box-enemy', fxClass);
    }
  }

  executeAttack(user, target, damageOrFn, currentCard = this.activeCard) {
    const isCardAttack = user === this.player && currentCard;
    const hits = isCardAttack ? this.getEffectiveHits(user, currentCard) : 1;
    for (let i = 0; i < hits; i++) {
      let dmg = typeof damageOrFn === 'function' ? damageOrFn() : damageOrFn;
      // --- 적중 시 티어 보정 공격력 가산 ---
      if (!user.isPlayer && user.tierDamageBonus) {
        dmg += user.tierDamageBonus;
      }
      user.getPassives().forEach(({ def, inst }) => {
        if (def.modifyAttackHitDamage) {
          dmg = def.modifyAttackHitDamage(dmg, i, hits, currentCard, this, user, inst);
        }
      });
      this.dealDamage(new DamagePacket({
        source: user, target, amount: dmg,
        type: DAMAGE_TYPE.PHYSICAL, isStrike: true,
        reason: `${isCardAttack ? currentCard.name : user.name} (${i + 1}/${hits}타)`
      }));
    }
  }

  dealDamage(packet) {
    if (this.combatEnded) return;
    const { source, target } = packet;
    if (packet.isStrike && source) {
      source.getPassives().forEach(({ def, inst }) => {
        if (def.onBeforeStrike) def.onBeforeStrike(this, source, target, packet, inst);
      });
    }
    if (packet.type !== DAMAGE_TYPE.HP_LOSS) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.modifyIncomingDamage) def.modifyIncomingDamage(packet, this, target, inst);
      });
    }
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && packet.amount > 0) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onDamageTaken) def.onDamageTaken(this, target, packet, inst);
      });
    }

    let unblocked = packet.amount;
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && target.armor > 0 && unblocked > 0) {
      const absorbed = Math.min(target.armor, unblocked);
      target.armor -= absorbed;
      unblocked -= absorbed;
      packet.logs.push(`방어도(-${absorbed})`);
    }

    const prevHp = target.hp;
    target.hp = Math.max(0, target.hp - unblocked);
    const actualLost = prevHp - target.hp;

    const note = packet.logs.length ? ` [${packet.logs.join(', ')}]` : '';
    this.emitLog(`💥 [${packet.reason}] ${target.name}에게 ${packet.baseAmount} -> 실제 HP -${actualLost} (남은 HP: ${target.hp})${note}`, 'log-hit');

    if (actualLost > 0) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onHpDecreased) def.onHpDecreased(this, target, actualLost, inst);
      });
    }
    if (actualLost > 0 || packet.amount > 0) {
      this.emitFx(target, 'fx-red');
    }
    if (packet.isStrike && source !== target) {
      target.runTrackers.hitTakenCount += 1;
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onAfterBeStruck) def.onAfterBeStruck(this, target, source, packet, inst);
      });
    }

    this.notifyRender();
    this.checkCombatEnd();
  }

  checkCombatEnd() {
    if (this.combatEnded || !this.onCombatEndCallback) return;
    if (this.enemy.maxHp > 0 && this.enemy.hp <= 0) {
      this.combatEnded = true;
      this.emitLog(`🏆 [전투 승리] ${this.enemy.name} 처치!`, 'log-sys');
      this.onCombatEndCallback(true);
    } else if (this.player.hp <= 0) {
      this.combatEnded = true;
      this.emitLog(`💀 [전투 패배] 토끼기사가 쓰러졌습니다...`, 'log-hit');
      this.onCombatEndCallback(false);
    }
  }

  gainArmor(target, amount, reason) {
    target.armor += amount;
    this.emitLog(`🛡️ [${reason}] ${target.name} 방어도 +${amount} (현재:${target.armor})`, 'log-sys');
    this.emitFx(target, 'fx-blue');
    this.notifyRender();
  }

  heal(target, amount, reason) {
    const prev = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + amount);
    this.emitLog(`💚 [${reason}] ${target.name} HP +${target.hp - prev} 회복`, 'log-sys');
    this.emitFx(target, 'fx-green');
    this.notifyRender();
  }

  recoverEnergy(user, amount) {
    user.energy = Math.min(user.maxEnergy, user.energy + amount);
    this.emitLog(`⚡ ${user.name} 활력 +${amount} (현재:${user.energy}/${user.maxEnergy})`, 'log-sys');
    this.emitFx(user, 'fx-yellow');
    this.notifyRender();
  }

  drawCards(user, count) {
    for (let i = 0; i < count; i++) {
      if (!user.deck.length) {
        if (!user.graveyard.length) break;
        user.deck = RNG.sampleUnique(user.graveyard, user.graveyard.length);
        user.graveyard = [];
        this.emitLog(`🔄 [묘지 셔플] 묘지를 섞어 덱을 보충했습니다.`, 'log-sys');
      }
      user.hand.push(user.deck.pop());
    }
    this.notifyRender();
  }

  drawSpecificFromDeck(user, predicate, label) {
    const idx = user.deck.findIndex(predicate);
    if (idx !== -1) {
      const [c] = user.deck.splice(idx, 1);
      user.hand.push(c);
      this.emitLog(`🔍 덱에서 [${c.name}] 카드를 뽑았습니다.`, 'log-sys');
    } else {
      this.emitLog(`🔍 덱에 [${label}] 카드가 없습니다.`, 'log-sys');
    }
    this.notifyRender();
  }

  moveCardToGraveyard(user, card, fromPlay = false) {
    user.graveyard.push(card);
    if (card.id !== '024') user.combatTrackers.lastGraveyardCard = card;
    if (fromPlay && card.onEnterGraveyardFromPlay) {
      card.onEnterGraveyardFromPlay(this, user, this.getOpponent(user));
    }
  }

  playCardFromHand(handIndex) {
    if (this.combatEnded) return false;
    const card = this.player.hand[handIndex];
    if (!card) return false;

    const blocked = this.player.getPassives().some(({ def, inst }) => def.canPlayCard && !def.canPlayCard(card, this, this.player, inst));
    if (blocked) {
      this.emitLog(`❌ 상태이상(난투 등)으로 인해 [${card.name}] 카드를 사용할 수 없습니다!`, 'log-hit');
      return false;
    }

    const cost = this.getEffectiveCost(this.player, card);
    if (this.player.energy < cost) {
      this.emitLog(`❌ 활력이 부족합니다. (필요: ${cost}, 현재: ${this.player.energy})`, 'log-hit');
      return false;
    }

    this.player.energy -= cost;
    this.player.hand.splice(handIndex, 1);
    this.emitLog(`🃏 [카드 발동] ${this.player.name} -> [${card.name}]`, 'log-sys');

    this.resolveCardEffect(card, this.player, this.enemy, false);
    this.moveCardToGraveyard(this.player, card, true);
    this.notifyRender();

    if (this.onCardPlayedCallback) this.onCardPlayedCallback(card);
    return true;
  }

  resolveCardEffect(card, user, target, isReplay = false) {
    if (this.replayDepth > 3) return;
    if (isReplay) this.replayDepth++;
    const prev = this.activeCard;
    this.activeCard = card;
    card.play(this, user, target, isReplay);

    user.getPassives().forEach(({ def, inst }) => {
      if (def.onCardPlayed) def.onCardPlayed(this, user, card, target, isReplay, inst);
    });

    this.activeCard = prev;
    if (isReplay) this.replayDepth--;
  }

  startPlayerTurn() {
    if (this.combatEnded) return;
    this.emitLog(`========== [${this.turn}턴: 플레이어 차례] ==========`, 'log-sys');

    const carryOver = Math.min(this.player.maxCarryOver, this.player.energy);
    let recovery = 3;
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.modifyEnergyRecovery) recovery = def.modifyEnergyRecovery(recovery, this, this.player, inst);
    });
    this.player.energy = Math.min(this.player.maxEnergy, carryOver + recovery);

    [this.player, this.enemy].forEach(ent => {
      [...ent.statuses].forEach(s => {
        const def = StatusDB[s.id];
        if (def.decayTiming === DECAY_TIMING.CASTER_TURN_START && s.caster === this.player) {
          this.statuses.changeStacks(ent, s, -1, 'DISPEL');
        }
        if (ent === this.player && def.onOwnerTurnStart) {
          def.onOwnerTurnStart(this, ent, s);
        }
      });
    });

    // 특성 등 턴 시작 훅 (전술 도약 등)
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.onPlayerTurnStart) def.onPlayerTurnStart(this, this.player, this.turn, inst);
    });

    this.drawCards(this.player, 3);

    // 드로우 직후 훅 (천무지체 등)
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.onPlayerTurnPostDraw) def.onPlayerTurnPostDraw(this, this.player, this.turn, inst);
    });

    this.notifyRender();
  }

  endPlayerTurn() {
    if (this.combatEnded) return;
    while (this.player.hand.length > 0) {
      const card = this.player.hand.pop();
      card.turnCostOverride = null;
      this.moveCardToGraveyard(this.player, card, false);
    }

    this.processTurnEndStatuses(this.player);
    if (this.combatEnded) return;

    [...this.player.statuses].forEach(s => {
      if (StatusDB[s.id].decayTiming === DECAY_TIMING.PLAYER_TURN_END_CONTEXT) {
        this.statuses.changeStacks(this.player, s, -1, 'REMOVE');
      }
    });

    // 적 턴 시작
    this.emitLog(`========== [${this.turn}턴: ${this.enemy.name} 차례] ==========`, 'log-sys');
    [this.player, this.enemy].forEach(ent => {
      [...ent.statuses].forEach(s => {
        const def = StatusDB[s.id];
        if (def.decayTiming === DECAY_TIMING.CASTER_TURN_START && s.caster === this.enemy) {
          this.statuses.changeStacks(ent, s, -1, 'DISPEL');
        }
        if (ent === this.enemy && def.onOwnerTurnStart) {
          def.onOwnerTurnStart(this, ent, s);
        }
      });
    });
    if (this.combatEnded) return;

    // 적 패턴 실행 (EnemyDB)
    const enemyDef = EnemyDB[this.enemy.enemyId];
    if (enemyDef) {
      const action = enemyDef.getAction(this.turn, this, this.enemy, this.player);

      // ✅ [추가된 난투 검사 로직] 적이 낼 행동이 MAGIC인데 적 몸에 난투가 있으면 스킵
      const hasBrawl = this.statuses.get(this.enemy, 'BRAWL');
      if (action.type === 'MAGIC' && hasBrawl) {
        this.emitLog(`🚫 [난투] 효과로 인해 ${this.enemy.name}의 [${action.name}] 발동이 취소되었습니다!`, 'log-hit');
      } else {
        this.emitLog(`👾 [${this.enemy.name}] '${action.name}' 발동!`, 'log-hit');
        action.execute();
      }
    }
    if (this.combatEnded) return;

    this.processTurnEndStatuses(this.enemy);
    if (this.combatEnded) return;

    this.turn += 1;
    this.startPlayerTurn();
  }

  processTurnEndStatuses(entity) {
    const sorted = [...entity.statuses].sort((a, b) => (a.id === 'CONTRACT' ? 1 : b.id === 'CONTRACT' ? -1 : 0));
    sorted.forEach(s => {
      if (this.combatEnded) return;
      const def = StatusDB[s.id];
      if (def.onOwnerTurnEnd) def.onOwnerTurnEnd(this, entity, s);
    });
  }
}

/**
 * ============================================================================
 * 6. RogueManager (모바일 세로형 #screen-choice 연동 버전)
 * ============================================================================
 */
const RogueManager = {
  STARTER_DECK: ['001', '001', '001', '010', '010', '010', '005', '005', '002', '002', '011', '011'],
  MIN_DECK_SIZE: 9,
  BASE_MAX_DECK_SIZE: 21,

  state: {
    active: false, floor: 1, hp: 150, maxHp: 150, hitTakenCount: 0,
    deck: [], relics: [], traits: [], clearedBosses: []
  },
  currentPaths: [],
  rewardQueue: [],

  getMaxFloor() {
    return Object.values(EnemyDB).filter(e => e.isBoss).length * 10;
  },
  getMaxDeckSize() {
    let max = this.BASE_MAX_DECK_SIZE;
    this.state.traits.forEach(tid => {
      if (TraitDB[tid]?.modifyMaxDeckSize) max = TraitDB[tid].modifyMaxDeckSize(max);
    });
    return max;
  },
  getRewardCardChoiceCount() {
    let cnt = 3;
    this.state.traits.forEach(tid => {
      if (TraitDB[tid]?.modifyRewardCardChoices) cnt = TraitDB[tid].modifyRewardCardChoices(cnt);
    });
    return cnt;
  },
  hasRelic(id) { return this.state.relics.includes(id); },
  hasTrait(id) { return this.state.traits.includes(id); },

  syncToSaveLedger() {
    SaveLedger.set('roguelike.active', this.state.active);
    SaveLedger.set('roguelike.floor', this.state.floor);
    SaveLedger.set('roguelike.hp', this.state.hp);
    SaveLedger.set('roguelike.maxHp', this.state.maxHp);
    SaveLedger.set('roguelike.hitTakenCount', this.state.hitTakenCount);
    SaveLedger.set('roguelike.deck', this.state.deck.join(','));
    SaveLedger.set('roguelike.relics', this.state.relics.join(','));
    SaveLedger.set('roguelike.traits', this.state.traits.join(','));
    SaveLedger.set('roguelike.clearedBosses', this.state.clearedBosses.join(','));
  },

  loadFromSaveLedger() {
    const parseList = (str) => String(str || '').split(',').map(s => s.trim()).filter(Boolean);
    this.state.active = Boolean(SaveLedger.get('roguelike.active'));
    this.state.floor = Number(SaveLedger.get('roguelike.floor')) || 1;
    this.state.hp = Number(SaveLedger.get('roguelike.hp')) || 150;
    this.state.maxHp = Number(SaveLedger.get('roguelike.maxHp')) || 150;
    this.state.hitTakenCount = Number(SaveLedger.get('roguelike.hitTakenCount')) || 0;
    const savedDeck = parseList(SaveLedger.get('roguelike.deck'));
    this.state.deck = savedDeck.length >= this.MIN_DECK_SIZE ? savedDeck : [...this.STARTER_DECK];
    this.state.relics = parseList(SaveLedger.get('roguelike.relics'));
    this.state.traits = parseList(SaveLedger.get('roguelike.traits'));
    this.state.clearedBosses = parseList(SaveLedger.get('roguelike.clearedBosses'));
  },

  startNewRun() {
    this.state = {
      active: true, floor: 1, hp: 150, maxHp: 150, hitTakenCount: 0,
      deck: [...this.STARTER_DECK], relics: [], traits: [], clearedBosses: []
    };
    this.syncToSaveLedger();
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    this.renderStartingTraitSelection();
  },

  continueFromSave() {
    this.loadFromSaveLedger();
    this.state.active = true;
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    if (this.state.traits.length === 0 && this.state.floor === 1) {
      this.renderStartingTraitSelection();
    } else {
      this.enterHubForCurrentFloor();
    }
  },

  renderStartingTraitSelection() {
    const offeredIds = RNG.sampleUnique(Object.keys(TraitDB), 3);
    AppUI.setChoiceScreen(
      '🌟 초기 특성 선택 (3택 1)',
      '이번 기사도 여정을 함께할 고유 특성을 1개 선택하십시오.',
      offeredIds.map(tid => {
        const t = TraitDB[tid];
        return {
          title: `🧬 [${t.id}] ${t.name}`,
          desc: t.desc,
          borderColor: 'var(--fx-blue)',
          onClick: () => this.pickStartingTrait(tid)
        };
      })
    );
  },

  pickStartingTrait(traitId) {
    if (!this.hasTrait(traitId)) {
      this.state.traits.push(traitId);
      if (TraitDB[traitId]?.onAcquire) TraitDB[traitId].onAcquire(this.state);
    }
    this.syncToSaveLedger();
    this.enterHubForCurrentFloor();
  },

  enterHubForCurrentFloor() {
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    const maxFloor = this.getMaxFloor();
    if (this.state.floor > maxFloor) {
      this.renderMaxFloorReached(maxFloor);
      return;
    }
    this.generatePathsForCurrentFloor();
    this.renderPathSelection();
  },

    generatePathsForCurrentFloor() {
    const floor = this.state.floor;
    
    // 1. 보스층 처리 (10, 20, 30층...)
    if (floor % 10 === 0) {
      this.currentPaths = ['BOSS'];
      return;
    }

    // 2. 방 개수는 무조건 2~3개로 고정 (외길 선택권 박탈 방지)
    const optionCount = RNG.randInt(2, 3);

    // 3. 중복 없는 방 후보군 풀 설정 (1, 11, 21층 등 각 구역 첫 층은 엘리트 제외 끔살 방지)
    const pool = (floor % 10 === 1) ? ['NORMAL', 'CAMP'] : ['NORMAL', 'ELITE', 'CAMP'];

    // 4. 후보군에서 중복 없이 뽑기 (동일한 방이 2~3개 뜨는 현상 해결)
    let options = RNG.sampleUnique(pool, Math.min(optionCount, pool.length));

    // 5. 요람사진(006) 유물 또는 보스 직전 층(9, 19, 29...) 확정 캠프 룰 적용
    const isCampMilestone = (floor % 10 === 9);
    const forceCamp = isCampMilestone || this.hasRelic('006');

    if (forceCamp && !options.includes('CAMP')) {
      // 이미 서로 다른 방이 보장되어 있으므로, 
      // 랜덤한 방 1개를 덮어써도 일반 전투나 엘리트 전투가 최소 1개는 반드시 살아남음
      options[RNG.randInt(0, options.length - 1)] = 'CAMP';
    }

    // 6. 배열을 한 번 더 섞어서 UI상 캠프의 위치가 랜덤하게 나오도록 처리
    this.currentPaths = RNG.sampleUnique(options, options.length);
  },

  renderPathSelection() {
    const meta = {
      NORMAL: { title: '⚔️ 일반 전투', desc: '일반 적과 교전합니다. (승리 시 카드 보상)', color: 'var(--accent)' },
      ELITE: { title: '🔥 엘리트 전투', desc: '강력한 적과 교전합니다. (승리 시 카드 + 유물 보상)', color: 'var(--fx-purple)' },
      CAMP: { title: '⛺ 캠프 (정비소)', desc: '체력 35% 회복 또는 덱에서 카드 1장을 제거합니다.', color: 'var(--fx-green)' },
      BOSS: { title: '👑 보스 결전', desc: '층의 지배자와 결전을 치릅니다. (HP 50% 회복 + 카드 + 유물 + 특성)', color: 'var(--fx-red)' }
    };
    AppUI.setChoiceScreen(
      `🧭 ${this.state.floor}층 갈림길 선택`,
      `현재 HP: ${this.state.hp}/${this.state.maxHp} | 덱: ${this.state.deck.length}/${this.getMaxDeckSize()}장`,
      this.currentPaths.map(type => ({
        title: meta[type].title,
        desc: meta[type].desc,
        borderColor: meta[type].color,
        onClick: () => type === 'CAMP' ? this.renderCampView() : this.startCombatNode(type)
      }))
    );
  },

  renderCampView() {
    const healAmt = Math.floor(this.state.maxHp * 0.35);
    const canRemove = this.state.deck.length > this.MIN_DECK_SIZE;
    const items = [
      {
        title: `💚 휴식: 체력 35% 회복 (+${healAmt} HP)`,
        desc: `체력을 ${Math.min(this.state.maxHp, this.state.hp + healAmt)} / ${this.state.maxHp}(으)로 회복하고 다음 층으로 이동합니다.`,
        borderColor: 'var(--fx-green)',
        onClick: () => {
          this.state.hp = Math.min(this.state.maxHp, this.state.hp + healAmt);
          this.advanceFloor();
        }
      }
    ];

    if (canRemove) {
      this.state.deck.forEach((cid, idx) => {
        const c = CardDB[cid];
        items.push({
          title: `🗑️ 카드 제거: [${c.id}] ${c.name} (코스트 ${c.cost})`,
          desc: c.desc,
          borderColor: 'var(--fx-red)',
          onClick: () => {
            this.state.deck.splice(idx, 1);
            this.advanceFloor();
          }
        });
      });
    } else {
      items.push({
        title: `🚫 카드 제거 불가 (최소 덱 ${this.MIN_DECK_SIZE}장 제한)`,
        desc: '현재 덱이 최소 매수이므로 카드를 더 제거할 수 없습니다.',
        disabled: true
      });
    }

    AppUI.setChoiceScreen(`⛺ ${this.state.floor}층 캠프`, '체력을 회복하거나 덱의 카드 1장을 제거하십시오.', items);
  },

  startCombatNode(type) {
    let enemyId = 'COAL_MOLE';
    if (type === 'NORMAL') {
      enemyId = RNG.pickRandom(Object.values(EnemyDB).filter(e => !e.isBoss && !e.isElite)).id;
    } else if (type === 'ELITE') {
      enemyId = RNG.pickRandom(Object.values(EnemyDB).filter(e => e.isElite)).id;
    } else if (type === 'BOSS') {
      const allBosses = Object.values(EnemyDB).filter(e => e.isBoss);
      const uncleared = allBosses.filter(b => !this.state.clearedBosses.includes(b.id));
      enemyId = RNG.pickRandom(uncleared.length > 0 ? uncleared : allBosses).id;
    }

    const eng = AppUI.engine;
    eng.combatEnded = false;
    eng.turn = 1;
    eng.replayDepth = 0;

    eng.player = new Entity('토끼기사', this.state.maxHp, true);
    eng.player.hp = this.state.hp;
    eng.player.energy = 0; // 첫 턴 3 활력 시작 보장
    eng.player.runTrackers.hitTakenCount = this.state.hitTakenCount;

    this.state.traits.forEach(tid => {
      const def = TraitDB[tid];
      if (!def) return;
      eng.player.traits.push({ id: tid, state: {} });
      if (def.modifyMaxEnergy) eng.player.maxEnergy = def.modifyMaxEnergy(eng.player.maxEnergy);
      if (def.modifyMaxCarryOver) eng.player.maxCarryOver = def.modifyMaxCarryOver(eng.player.maxCarryOver);
    });
    this.state.relics.forEach(rid => {
      const def = RelicDB[rid];
      if (!def) return;
      const inst = { id: rid, state: {} };
      if (def.onInit) def.onInit(inst);
      eng.player.relics.push(inst);
    });

    const shuffledIds = RNG.sampleUnique(this.state.deck, this.state.deck.length);
    eng.player.deck = shuffledIds.map(cid => eng.createCardInstance(cid));

    // 티어 스케일링 적용 (10층마다 체력 1.45배, 물리 공격력 +3)
    const eDef = EnemyDB[enemyId];
    const tier = Math.floor((this.state.floor - 1) / 10);
    const scaledHp = Math.floor(eDef.maxHp * Math.pow(1.45, tier));
    eng.enemy = new Entity(eDef.name, scaledHp, false);
    eng.enemy.enemyId = enemyId;
    eng.enemy.tierDamageBonus = tier * 3;

    eng.onCardPlayedCallback = null;
    eng.onCombatEndCallback = (victory) => this.onCombatFinished(victory, type, enemyId);

    AppUI.enterRogueCombatView();
    eng.emitLog(`⚔️ [${this.state.floor}층] ${eDef.name} (HP ${scaledHp}) 전투 개시!`, 'log-sys');
    eng.startPlayerTurn();
  },

  onCombatFinished(victory, nodeType, enemyId) {
    const eng = AppUI.engine;
    this.state.hp = eng.player.hp;
    this.state.hitTakenCount = eng.player.runTrackers.hitTakenCount;

    if (!victory) {
      this.state.active = false;
      this.syncToSaveLedger();
      AppUI.mode = 'ROGUE_HUB';
      AppUI.go('screen-choice');
      AppUI.setChoiceScreen('💀 기사도 등반 실패', `${this.state.floor}층에서 쓰러졌습니다.`, [
        { title: '🏠 타이틀로 돌아가기', desc: '세이브를 정리하고 메인 화면으로 이동합니다.', borderColor: 'var(--fx-red)', onClick: () => AppUI.returnToLobby() }
      ]);
      return;
    }

    this.rewardQueue = [];
    if (nodeType === 'NORMAL') {
      this.rewardQueue.push({ type: 'CARD' });
      if (this.hasRelic('005') && RNG.randInt(1, 100) <= 10) {
        this.rewardQueue.push({ type: 'RELIC', note: '🏺 유물 [마도서] 10% 확률 발동!' });
      }
    } else if (nodeType === 'ELITE') {
      this.rewardQueue.push({ type: 'CARD' });
      this.rewardQueue.push({ type: 'RELIC' });
    } else if (nodeType === 'BOSS') {
      if (!this.state.clearedBosses.includes(enemyId)) this.state.clearedBosses.push(enemyId);
      const healAmt = Math.floor(this.state.maxHp * 0.5);
      this.state.hp = Math.min(this.state.maxHp, this.state.hp + healAmt);
      this.rewardQueue.push({ type: 'CARD', note: `👑 보스 격파! 체력 50%(+${healAmt}) 회복 완료` });
      this.rewardQueue.push({ type: 'RELIC' });
      this.rewardQueue.push({ type: 'TRAIT' });
    }

    this.syncToSaveLedger();
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    this.processNextReward();
  },

  processNextReward() {
    if (this.rewardQueue.length === 0) {
      this.advanceFloor();
      return;
    }
    const next = this.rewardQueue.shift();
    if (next.type === 'CARD') this.renderCardReward(next.note);
    else if (next.type === 'RELIC') this.renderRelicReward(next.note);
    else if (next.type === 'TRAIT') this.renderTraitReward();
  },

  renderCardReward(note = '') {
    const choiceCount = this.getRewardCardChoiceCount();
    const offeredIds = RNG.sampleUnique(Object.keys(CardDB), choiceCount);
    const maxDeck = this.getMaxDeckSize();
    const isFull = this.state.deck.length >= maxDeck;

    const items = offeredIds.map(cid => {
      const c = CardDB[cid];
      const copies = this.state.deck.filter(x => x === cid).length;
      const canAdd = !isFull && copies < 3;
      return {
        title: `🃏 [${c.id}] ${c.name} (코스트 ${c.cost} | 보유 ${copies}/3)`,
        desc: `${c.desc}${!canAdd ? (isFull ? ' [덱 상한 도달]' : ' [동명 3장 제한]') : ''}`,
        borderColor: 'var(--fx-yellow)',
        disabled: !canAdd,
        onClick: () => {
          if (!canAdd) return;
          this.state.deck.push(cid);
          this.syncToSaveLedger();
          this.processNextReward();
        }
      };
    });

    items.push({
      title: '⏭️ 카드 보상 건너뛰기',
      desc: '카드를 추가하지 않고 다음 보상으로 넘어갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.processNextReward()
    });

    AppUI.setChoiceScreen('🎁 전투 승리 — 카드 보상', note || `원하는 카드를 1장 선택하십시오. (현재 덱 ${this.state.deck.length}/${maxDeck}장)`, items);
  },

  renderRelicReward(note = '') {
    const unowned = Object.keys(RelicDB).filter(id => !this.hasRelic(id));
    if (unowned.length === 0) { this.processNextReward(); return; }
    const offered = RNG.sampleUnique(unowned, 2);

    const items = offered.map(rid => {
      const r = RelicDB[rid];
      return {
        title: `🏺 [${r.id}] ${r.name}`,
        desc: r.desc,
        borderColor: 'var(--fx-yellow)',
        onClick: () => {
          if (!this.hasRelic(rid)) this.state.relics.push(rid);
          this.syncToSaveLedger();
          this.processNextReward();
        }
      };
    });
    items.push({
      title: '⏭️ 유물 건너뛰기',
      desc: '유물을 획득하지 않고 넘어갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.processNextReward()
    });

    AppUI.setChoiceScreen('🏺 유물 보상 (2택 1)', note || '보유하지 않은 유물 중 1개를 선택하십시오.', items);
  },

  renderTraitReward() {
    const unowned = Object.keys(TraitDB).filter(id => !this.hasTrait(id));
    if (unowned.length === 0) { this.processNextReward(); return; }
    const offered = RNG.sampleUnique(unowned, 2);

    const items = offered.map(tid => {
      const t = TraitDB[tid];
      return {
        title: `🧬 [${t.id}] ${t.name}`,
        desc: t.desc,
        borderColor: 'var(--fx-blue)',
        onClick: () => {
          if (!this.hasTrait(tid)) {
            this.state.traits.push(tid);
            if (t.onAcquire) t.onAcquire(this.state);
          }
          this.syncToSaveLedger();
          this.processNextReward();
        }
      };
    });
    items.push({
      title: '⏭️ 특성 건너뛰기',
      desc: '특성을 획득하지 않고 넘어갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.processNextReward()
    });

    AppUI.setChoiceScreen('🧬 보스 격파 — 특성 보상 (2택 1)', '보유하지 않은 특성 중 1개를 선택하십시오.', items);
  },

  advanceFloor() {
    this.state.floor += 1;
    this.state.traits.forEach(tid => {
      if (TraitDB[tid]?.onAdvanceFloor) TraitDB[tid].onAdvanceFloor(this.state);
    });
    this.syncToSaveLedger();
    this.enterHubForCurrentFloor();
  },

  renderMaxFloorReached(maxFloor) {
    AppUI.setChoiceScreen(
      `🚩 구현 최고층(${maxFloor}층) 돌파 완료!`,
      `현재 ${this.state.floor}층 대기 중 | 카드(${this.state.deck.length}장), HP(${this.state.hp}/${this.state.maxHp}), 유물(${this.state.relics.length}), 특성(${this.state.traits.length})이 모두 세이브에 보존되었습니다.`,
      [
        {
          title: '💾 세이브 보존 후 로비로 이동',
          desc: '추후 보스가 추가되면 현재 스펙 그대로 다음 층부터 이어서 등반할 수 있습니다.',
          borderColor: 'var(--accent)',
          onClick: () => AppUI.returnToLobby()
        }
      ]
    );
  }
};

function buildZenaComboLogs() {
  const logs = [];
  for (let i = 1; i <= 10; i++) {
    logs.push(`[적 ${i}합] 제나가 [스텝 밟기] 사용! -> 활력 +1`);
    logs.push(`[적 ${i}합] 제나가 [토끼풀] 사용! -> 재생 3 & 1드로우 (덱 압축!)`);
  }
  logs.push(`⚡ [피니시] 덱을 압축한 제나가 [화살 4연사] 발동!`);
  logs.push(`💥 6×4타 적중 -> 총 24 데미지! (피격 횟수 +4)`);
  return logs;
}

const StorySequencer = {
  engine: null, activeChapter: null, queue: [], stageVars: {}, state: 'IDLE',
  inCombatStage: false, logTimer: null, pendingLogs: [], pendingLogAfterHook: null,

  init(combatEngine) { this.engine = combatEngine; },

  startChapter(chapterId) {
    const chapter = StoryDB.find(c => c.id === chapterId);
    if (!chapter) return;
    this.clearTimers();
    RNG.reset();
    this.activeChapter = chapter;
    this.queue = [...chapter.script];
    this.stageVars = {};
    this.state = 'IDLE';
    this.inCombatStage = false;

    this.engine.combatEnded = false;
    this.engine.onCombatEndCallback = null;
    this.engine.onCardPlayedCallback = () => {
      if (this.state === 'WAIT_CARD') {
        this.state = 'IDLE';
        this.next();
      }
    };

    document.getElementById('vn-chapter-title').textContent = chapter.title;
    AppUI.mode = 'STORY';
    AppUI.go('screen-vn');
    AppUI.clearLogs();
    this.next();
  },

  clearTimers() { if (this.logTimer) { clearInterval(this.logTimer); this.logTimer = null; } },

  next() {
    if (this.queue.length === 0) {
      this.state = 'WAIT_FINISH';
      AppUI.showStoryText('시스템', `[${this.activeChapter.title}] 클리어! (터치 시 로비로 돌아갑니다)`, this.inCombatStage);
      return;
    }
    this.executeCommand(this.queue.shift());
  },

  executeCommand(cmd) {
    switch (cmd.type) {
      case 'TEXT':
        this.state = 'WAIT_TEXT';
        AppUI.showStoryText(cmd.speaker || '나레이션', cmd.text, this.inCombatStage);
        break;
      case 'CHOICE':
        this.state = 'WAIT_CHOICE';
        AppUI.showStoryChoices(cmd.speaker || '선택', cmd.text, cmd.options, (opt) => {
          this.stageVars[cmd.varKey] = opt.value;
          if (opt.saveFlag) SaveLedger.set(opt.saveFlag.key, opt.saveFlag.val);
          this.state = 'IDLE';
          this.next();
        });
        break;
      case 'SETUP_STAGE':
        this.inCombatStage = true;
        this.engine.player = new Entity(cmd.player.name, cmd.player.maxHp || cmd.player.hp, true);
        this.engine.player.hp = cmd.player.hp;
        this.engine.player.energy = 3;
        this.engine.enemy = new Entity(cmd.enemy.name, cmd.enemy.maxHp || cmd.enemy.hp, false);
        this.engine.enemy.hp = cmd.enemy.hp;
        AppUI.go('screen-combat');
        AppUI.renderStageActors();
        this.next();
        break;
      case 'SCRIPTED_LOGS':
        this.state = 'WAIT_LOGS';
        AppUI.hideCombatVnOverlay();
        document.getElementById('intent-title').textContent = '스토리 연출 진행 중';
        document.getElementById('intent-main').textContent = '적 연속 행동 중... (상단 대사창/영역 터치 시 스킵)';
        this.pendingLogs = [...(cmd.logs || [])];
        this.pendingLogAfterHook = () => {
          if (typeof cmd.playerHpDelta === 'number') {
            this.engine.player.hp = Math.max(0, Math.min(this.engine.player.maxHp, this.engine.player.hp + cmd.playerHpDelta));
            this.engine.emitFx(this.engine.player, 'fx-red');
          }
          if (typeof cmd.setHitTakenCount === 'number') {
            this.engine.player.runTrackers.hitTakenCount = cmd.setHitTakenCount;
          }
          AppUI.renderStageActors();
        };
        this.logTimer = setInterval(() => {
          if (this.pendingLogs.length > 0) this.engine.emitLog(this.pendingLogs.shift(), 'log-story');
          else this.finishPendingLogs();
        }, 70);
        break;
      case 'BRANCH':
        if (typeof cmd.condition === 'function' && cmd.condition(this.stageVars, SaveLedger) && Array.isArray(cmd.steps)) {
          this.queue.unshift(...cmd.steps);
        }
        this.next();
        break;
      case 'RIG_NEXT_RANDOM':
        RNG.rigNext(cmd.value);
        this.next();
        break;
      case 'GIVE_CARD': {
        this.state = 'WAIT_CARD';
        AppUI.hideCombatVnOverlay();
        this.engine.player.hand = [];
        const cardInst = this.engine.createCardInstance(cmd.cardId, !!cmd.freeCost);
        this.engine.player.hand.push(cardInst);
        document.getElementById('intent-title').textContent = '스토리 행동 지시';
        document.getElementById('intent-main').textContent = cmd.prompt || `[${cardInst.name}] 카드를 선택 후 실행하세요.`;
        AppUI.selectedCardIdx = 0; // 지급된 카드를 즉시 선택 상태로 하이라이트
        AppUI.renderStageActors();
        break;
      }
      case 'SET_SAVE':
        SaveLedger.set(cmd.key, cmd.value);
        this.next();
        break;
      default:
        this.next();
        break;
    }
  },

  finishPendingLogs() {
    this.clearTimers();
    while (this.pendingLogs.length > 0) this.engine.emitLog(this.pendingLogs.shift(), 'log-story');
    if (this.pendingLogAfterHook) { this.pendingLogAfterHook(); this.pendingLogAfterHook = null; }
    this.state = 'IDLE';
    this.next();
  },

  onUserClickDialogue() {
    if (this.state === 'WAIT_TEXT') {
      this.state = 'IDLE';
      AppUI.hideCombatVnOverlay();
      this.next();
    } else if (this.state === 'WAIT_LOGS') {
      this.finishPendingLogs();
    } else if (this.state === 'WAIT_FINISH') {
      this.state = 'IDLE';
      AppUI.hideCombatVnOverlay();
      AppUI.returnToLobby();
    }
  }
};

/**
 * ============================================================================
 * 8. AppUI (모바일 세로형 화면 전환, 5색 연출, 2단계 카드 실행, 상세 팝업 컨트롤러)
 * ============================================================================
 */
const AppUI = {
  engine: null,
  mode: 'LOBBY',
  selectedCardIdx: null,

  init() {
    this.engine = new CombatEngine();
    this.engine.onLogCallback = (msg, cls) => this.appendLog(msg, cls);
    this.engine.onRenderCallback = () => this.renderStageActors();
    this.engine.onFxCallback = (boxId, fxClass) => this.triggerFX(boxId, fxClass);

    StorySequencer.init(this.engine);
    this.refreshSaveTextarea();
  },

  go(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
    if (screenId === 'screen-start' || screenId === 'screen-save' || screenId === 'screen-story-list') {
      this.refreshSaveTextarea();
    }
  },

  toggleModal(id, show) {
    document.getElementById(id).classList.toggle('open', show);
  },

  openInfo(title, descHtml) {
    document.getElementById('info-title').textContent = title;
    document.getElementById('info-desc').innerHTML = descHtml;
    this.toggleModal('modal-info', true);
  },

  openStatusInfo(statusId, stacks, accumulated) {
    const def = StatusDB[statusId];
    const meta = StatusMeta[statusId] || { icon: '📌', desc: '상태 효과' };
    const accText = accumulated > 0 ? `<br><br><span style="color:var(--fx-yellow);">현재 누적 수치: ${accumulated}</span>` : '';
    this.openInfo(`${meta.icon} ${def.name} (스택: ${stacks})`, `${meta.desc}${accText}`);
  },

  // 전술 메뉴 모달 열기 (특성/유물 터치 시 설명 팝업 + 덱/무덤 카드 목록 확인)
  openTacticalMenu() {
    const isRogue = (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB');
    const floorText = isRogue ? `${RogueManager.state.floor}층 (상한 ${RogueManager.getMaxFloor()}층)` : '스토리 스테이지';
    const hitCount = this.mode === 'ROGUE_HUB' ? RogueManager.state.hitTakenCount : this.engine.player.runTrackers.hitTakenCount;

    const traitIds = isRogue ? RogueManager.state.traits : this.engine.player.traits.map(t => t.id);
    const relicIds = isRogue ? RogueManager.state.relics : this.engine.player.relics.map(r => r.id);

    const traitTags = traitIds.map(tid => {
      const t = TraitDB[tid];
      return `<span class="s-tag buff" onclick="AppUI.openInfo('🧬 특성: ${t.name}', '${t.desc}')">🧬 ${t.name}</span>`;
    }).join(' ') || '<span style="color:var(--text-sub);">없음</span>';

    const relicTags = relicIds.map(rid => {
      const r = RelicDB[rid];
      return `<span class="s-tag context" onclick="AppUI.openInfo('🏺 유물: ${r.name}', '${r.desc}')">🏺 ${r.name}</span>`;
    }).join(' ') || '<span style="color:var(--text-sub);">없음</span>';

    document.getElementById('menu-status-summary').innerHTML = `
      <div>🏰 진행 위치: <b>${floorText}</b> | 💥 누적 피격: <b>${hitCount}회</b></div>
      <div style="font-size:11px; color:var(--text-sub);">※ 아래 특성이나 유물 배지를 터치하면 상세 효과가 표시됩니다.</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"><b>보유 특성:</b> ${traitTags}</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"><b>보유 유물:</b> ${relicTags}</div>
    `;

    const pileBtns = document.getElementById('menu-pile-buttons');
    if (this.mode === 'ROGUE_HUB') {
      pileBtns.innerHTML = `
        <button style="flex:1;" onclick="AppUI.openPileViewer('MASTER')">🃏 현재 마스터 덱 (${RogueManager.state.deck.length}장)</button>
      `;
    } else {
      const p = this.engine.player;
      pileBtns.innerHTML = `
        <button style="flex:1;" onclick="AppUI.openPileViewer('DECK')">덱 잔량 (${p.deck.length}장)</button>
        <button style="flex:1;" onclick="AppUI.openPileViewer('GRAVE')">무덤 (${p.graveyard.length}장)</button>
      `;
    }

    this.toggleModal('modal-menu', true);
  },

  openPileViewer(pileType) {
    let cards = [];
    let title = '';
    if (pileType === 'MASTER') {
      title = `🃏 마스터 덱 목록 (${RogueManager.state.deck.length}장)`;
      cards = RogueManager.state.deck.map(cid => CardDB[cid]);
    } else if (pileType === 'DECK') {
      title = `🃏 남은 덱 목록 (${this.engine.player.deck.length}장 - 순서 섞임)`;
      cards = [...this.engine.player.deck].sort((a, b) => a.id.localeCompare(b.id));
    } else if (pileType === 'GRAVE') {
      title = `🪦 무덤 카드 목록 (${this.engine.player.graveyard.length}장)`;
      cards = [...this.engine.player.graveyard];
    }

    if (cards.length === 0) {
      this.openInfo(title, '<div style="color:var(--text-sub);">카드가 없습니다.</div>');
      return;
    }

    const lastGraveUid = this.engine.player.combatTrackers?.lastGraveyardCard?.uid;
    const html = cards.map(c => {
      const isLast = (pileType === 'GRAVE' && c.uid && c.uid === lastGraveUid);
      return `
        <div style="background:var(--bg-card); border:1px solid ${isLast ? 'var(--fx-yellow)' : 'var(--border)'}; border-radius:4px; padding:8px; margin-bottom:6px;">
          <div style="font-weight:bold; color:var(--fx-yellow); font-size:12px;">
            [${c.id}] ${c.name} (코스트 ${c.cost}) ${isLast ? '<span style="color:var(--fx-green);">[최근 묘지행 - 끼토산 대상]</span>' : ''}
          </div>
          <div style="font-size:11px; color:#a9b1d6; margin-top:2px;">${c.desc}</div>
        </div>
      `;
    }).join('');

    this.openInfo(title, html);
  },

  refreshSaveTextarea() {
    document.getElementById('save-textarea').value = SaveLedger.exportText();
    this.renderLobbyLists();
  },

  handleSaveImport() {
    SaveLedger.importText(document.getElementById('save-textarea').value);
    RogueManager.loadFromSaveLedger();
    this.refreshSaveTextarea();
    this.openInfo('💾 기록 적용 완료', '입력된 세이브 기록이 성공적으로 반영되었습니다.');
  },

  copySaveText() {
    const val = document.getElementById('save-textarea').value;
    navigator.clipboard?.writeText(val);
    this.openInfo('📋 복사 완료', '세이브 텍스트가 클립보드에 복사되었습니다.');
  },

  renderLobbyLists() {
    const listEl = document.getElementById('story-chapter-list');
    listEl.innerHTML = StoryDB.map(ch => {
      const isCleared = SaveLedger.get(ch.saveClearKey) === true;
      return `
        <button class="list-btn" onclick="StorySequencer.startChapter('${ch.id}')">
          <span>${ch.title}</span>
          <span style="color:${isCleared ? 'var(--fx-green)' : 'var(--accent)'}; font-size:11px;">${isCleared ? 'CLEAR' : '진입 가능'}</span>
        </button>
      `;
    }).join('');

    RogueManager.loadFromSaveLedger();
    const continueBtn = document.getElementById('btn-rogue-continue');
    const subEl = document.getElementById('start-subtitle');
    const maxFloor = RogueManager.getMaxFloor();

    if (RogueManager.state.active) {
      continueBtn.classList.remove('hidden');
      continueBtn.textContent = `⚔️ 기사도 이어하기 (${RogueManager.state.floor}층)`;
      subEl.innerHTML = `진행 중 세이브: <b>${RogueManager.state.floor}층</b> (HP ${RogueManager.state.hp}/${RogueManager.state.maxHp} | 덱 ${RogueManager.state.deck.length}장)`;
    } else {
      continueBtn.classList.add('hidden');
      subEl.innerHTML = `현재 구현 보스 기준 최고층: ${maxFloor}층 (세이브 계승 지원)`;
    }
  },

  returnToLobby() {
    StorySequencer.clearTimers();
    if (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB') {
      RogueManager.syncToSaveLedger();
    }
    this.mode = 'LOBBY';
    this.selectedCardIdx = null;
    this.go('screen-start');
  },

  enterRogueCombatView() {
    this.mode = 'ROGUE_COMBAT';
    this.selectedCardIdx = null;
    this.hideCombatVnOverlay();
    this.clearLogs();
    this.go('screen-combat');
    this.renderStageActors();
  },

  setChoiceScreen(headerTitle, subtitle, items) {
    document.getElementById('choice-header-title').textContent = headerTitle;
    document.getElementById('choice-subtitle').textContent = subtitle;
    const listEl = document.getElementById('choice-list');
    listEl.innerHTML = '';

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'list-btn';
      div.style.cssText = `
        background: var(--bg-card);
        border: 1.5px solid ${item.borderColor || 'var(--border)'};
        border-radius: 6px;
        cursor: ${item.disabled ? 'not-allowed' : 'pointer'};
        opacity: ${item.disabled ? '0.4' : '1'};
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      `;
      div.innerHTML = `
        <strong style="color:${item.borderColor || 'var(--text-main)'}; font-size:13.5px;">${item.title}</strong>
        <span style="font-size:11.5px; color:var(--text-sub); line-height:1.35;">${item.desc}</span>
      `;
      if (!item.disabled && item.onClick) div.onclick = item.onClick;
      listEl.appendChild(div);
    });
  },

  // 스토리 비주얼 노벨 출력 (전투 전이면 #screen-vn, 전투 진입 후면 #combat-vn-overlay)
  showStoryText(speaker, text, inCombat) {
    if (inCombat) {
      const ov = document.getElementById('combat-vn-overlay');
      ov.classList.remove('hidden');
      document.getElementById('combat-vn-speaker').textContent = speaker;
      document.getElementById('combat-vn-text').textContent = text;
    } else {
      document.getElementById('vn-speaker').textContent = speaker;
      document.getElementById('vn-text').textContent = text;
      document.getElementById('vn-choices').classList.add('hidden');
      document.getElementById('vn-next-hint').classList.remove('hidden');
    }
  },

  hideCombatVnOverlay() {
    document.getElementById('combat-vn-overlay').classList.add('hidden');
  },

  showStoryChoices(speaker, text, options, onSelect) {
    document.getElementById('vn-speaker').textContent = speaker;
    document.getElementById('vn-text').textContent = text;
    document.getElementById('vn-next-hint').classList.add('hidden');
    const choicesEl = document.getElementById('vn-choices');
    choicesEl.classList.remove('hidden');
    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'vn-choice-btn';
      btn.textContent = opt.label;
      btn.onclick = () => onSelect(opt);
      choicesEl.appendChild(btn);
    });
  },

  triggerFX(targetId, fxClass) {
    const el = document.getElementById(targetId);
    if (!el) return;
    el.classList.remove('fx-red', 'fx-green', 'fx-purple', 'fx-blue', 'fx-yellow');
    void el.offsetWidth;
    el.classList.add(fxClass);
    setTimeout(() => el.classList.remove(fxClass), 380);
  },

  clearLogs() { document.getElementById('log-box').innerHTML = ''; },

  appendLog(msg, cls = '') {
    const box = document.getElementById('log-box');
    if (!box) return;
    box.querySelectorAll('.recent').forEach(el => el.classList.remove('recent'));
    const div = document.createElement('div');
    div.className = `recent ${cls}`;
    div.textContent = `▶ ${msg}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  },

  selectCard(idx) {
    this.selectedCardIdx = (this.selectedCardIdx === idx) ? null : idx;
    this.renderStageActors();
  },

  executeSelectedCard() {
    if (this.selectedCardIdx === null) return;
    const idx = this.selectedCardIdx;
    this.selectedCardIdx = null;
    this.engine.playCardFromHand(idx);
  },

  onClickEndTurn() {
    if (this.mode !== 'ROGUE_COMBAT' || this.engine.combatEnded) return;
    this.selectedCardIdx = null;
    this.engine.endPlayerTurn();
  },

  renderStageActors() {
    const p = this.engine.player;
    const e = this.engine.enemy;

    const renderStatusTags = (ent) => ent.statuses.map(s => {
      const def = StatusDB[s.id];
      const meta = StatusMeta[s.id] || { icon: '📌' };
      const cls = def.category === 'BUFF' ? 'buff' : (def.category === 'DEBUFF' ? 'debuff' : 'context');
      const acc = s.accumulated ? `(${s.accumulated})` : '';
      return `<span class="s-tag ${cls}" onclick="AppUI.openStatusInfo('${s.id}', ${s.stacks}, ${s.accumulated || 0})">${meta.icon}${def.name} ${s.stacks}${acc}</span>`;
    }).join('');

    // 1. 적 상태 박스 업데이트
    const floorTag = this.mode === 'ROGUE_COMBAT' ? ` (${RogueManager.state.floor}F)` : '';
    document.getElementById('sprite-enemy').innerHTML = `[적 도트]<br>${e.name}`;
    document.getElementById('enemy-name-label').textContent = `${e.name}${floorTag}`;
    document.getElementById('enemy-armor-label').textContent = `🛡️ 방어 ${e.armor}`;
    const ePct = e.maxHp > 0 ? Math.max(0, Math.min(100, (e.hp / e.maxHp) * 100)) : 0;
    document.getElementById('enemy-hp-fill').style.width = `${ePct}%`;
    document.getElementById('enemy-hp-text').textContent = `${e.hp} / ${e.maxHp}`;
    document.getElementById('enemy-status-list').innerHTML = renderStatusTags(e);

    // 2. 적 예고(Intent) 및 덱/무덤 요약 업데이트
    document.getElementById('deck-grave-Summary').textContent = `덱${p.deck.length}/묘${p.graveyard.length}`;
    if (this.mode === 'ROGUE_COMBAT' && e.enemyId && EnemyDB[e.enemyId] && e.hp > 0) {
      const act = EnemyDB[e.enemyId].getAction(this.engine.turn, this.engine, e, p);
      let intentText = act.intent;
      if (e.tierDamageBonus > 0 && intentText.includes('물리')) {
        intentText += ` (+스케일링 ${e.tierDamageBonus})`;
      }
      document.getElementById('intent-title').textContent = `적 다음 행동 예고 [${act.name}]`;
      document.getElementById('intent-main').textContent = intentText;
    }

    // 3. 플레이어 상태 박스 & 초록 활력 보석 동적 생성 (빠른 발굽 5활력 등 자동 대응)
    document.getElementById('player-name-label').textContent = `${p.name} (피격:${p.runTrackers.hitTakenCount})`;
    document.getElementById('player-armor-label').textContent = `🛡️ 방어 ${p.armor}`;
    const pPct = p.maxHp > 0 ? Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100)) : 0;
    document.getElementById('player-hp-fill').style.width = `${pPct}%`;
    document.getElementById('player-hp-text').textContent = `${p.hp} / ${p.maxHp}`;
    document.getElementById('player-status-list').innerHTML = renderStatusTags(p);

    const gemsEl = document.getElementById('player-ap-gems');
    gemsEl.innerHTML = Array.from({ length: p.maxEnergy }, (_, i) =>
      `<div class="ap-gem ${i < p.energy ? 'on' : ''}"></div>`
    ).join('');

    // 4. 손패 3열 그리드 & 2단계 실행 버튼 업데이트
    const canInteract = (this.mode === 'ROGUE_COMBAT' && !this.engine.combatEnded) || (this.mode === 'STORY' && StorySequencer.state === 'WAIT_CARD');
    if (this.selectedCardIdx !== null && !p.hand[this.selectedCardIdx]) {
      this.selectedCardIdx = null;
    }

    const gridEl = document.getElementById('hand-grid');
    gridEl.innerHTML = p.hand.map((card, idx) => {
      const cost = this.engine.getEffectiveCost(p, card);
      const hits = this.engine.getEffectiveHits(p, card);
      const isSelected = this.selectedCardIdx === idx;
      return `
        <div class="hand-card ${isSelected ? 'selected' : ''}" onclick="${canInteract ? `AppUI.selectCard(${idx})` : ''}">
          <div class="c-cost">${cost}</div>
          <div class="c-name">${card.name}</div>
          <div class="c-type">${card.type}${hits > 0 ? `(${hits}타)` : ''}</div>
          <div class="c-desc">${card.desc}</div>
        </div>
      `;
    }).join('');

    const execBtn = document.getElementById('btn-exec-card');
    const endTurnBtn = document.getElementById('btn-end-turn');
    endTurnBtn.disabled = (this.mode !== 'ROGUE_COMBAT' || this.engine.combatEnded);

    if (canInteract && this.selectedCardIdx !== null && p.hand[this.selectedCardIdx]) {
      const selCard = p.hand[this.selectedCardIdx];
      const cost = this.engine.getEffectiveCost(p, selCard);
      const blocked = p.getPassives().some(({ def, inst }) => def.canPlayCard && !def.canPlayCard(selCard, this.engine, p, inst));
      if (blocked) {
        execBtn.disabled = true;
        execBtn.textContent = `사용 불가 (${selCard.name} - 난투)`;
      } else if (p.energy < cost) {
        execBtn.disabled = true;
        execBtn.textContent = `활력 부족 (${selCard.name} - 필요 ${cost})`;
      } else {
        execBtn.disabled = false;
        execBtn.textContent = `[${selCard.name}] 실행 (활력 ${cost})`;
      }
    } else {
      execBtn.disabled = true;
      execBtn.textContent = '카드를 선택하세요';
    }
  }
};

AppUI.init();
</script>
