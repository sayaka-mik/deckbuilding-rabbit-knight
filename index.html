    this.renderStartingCardDraft(1, 3);
  },

  // 전체 카드 도감에서 기본 9장에 추가할 자유 카드 3장을 1장씩 순차 선택하는 화면 렌더링
  renderStartingCardDraft(step, total) {
    this.isDraftPicking = false;
    const offeredIds = Object.keys(CardDB).filter(id => !CardDB[id].isToken).sort((a, b) => a.localeCompare(b));

    const items = offeredIds.map(cid => {
      const c = CardDB[cid];
      const copies = this.state.deck.filter(x => x === cid).length;
      const canAdd = copies < 3; // 동명 카드 최대 3장 제한
      return {
        title: `🃏 [${c.id}] ${c.name} (코스트 ${c.cost} | 보유 ${copies}/3)`,
        desc: `${c.desc}${!canAdd ? ' [동명 3장 제한]' : ''}`,
        borderColor: 'var(--fx-yellow)',
        disabled: !canAdd,
        onClick: (e, el) => {
          if (!canAdd || this.isDraftPicking) return;
          this.isDraftPicking = true;

          // 카드 선택 시 0.3초 동안 초록색 테두리 및 '추가!' 팝업 피드백 표시
          if (el) {
            el.style.position = 'relative';
            el.classList.add('draft-picked');
            const badge = document.createElement('div');
            badge.className = 'draft-pop-text';
            badge.textContent = '추가!';
            el.appendChild(badge);
          }

          setTimeout(() => {
            this.state.deck.push(cid);
            this.syncToSaveLedger();
            this.isDraftPicking = false;
            if (step < total) this.renderStartingCardDraft(step + 1, total);
            else this.enterHubForCurrentFloor();
          }, 300);
        }
      };
    });

    AppUI.setChoiceScreen(
      `🎒 출발 보급 — 자유 카드 선택 (${step}/${total})`,
      `기본 9장에 합류시킬 카드를 자유롭게 선택하십시오. (현재 덱 ${this.state.deck.length}/12장)`,
      items
    );
  },

  // 현재 층의 갈림길 허브로 진입
  enterHubForCurrentFloor() {
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');

    // 51층 이상 최초 진입(기존 v1.09 51층 주차 세이브 이어하기 포함) 시 콜드슬립 체크포인트 자동 생성
    if (this.isDreamMode() && !this.state.dreamUnlocked) {
      this.saveDreamAnchor();
      this.syncToSaveLedger();
    }

    this.generatePathsForCurrentFloor();
    this.renderPathSelection();
  },

  /**
   * 현재 층의 선택지(갈림길) 생성 규칙:
   * - 10층 단위: 보스 단독 등장
   * - 각 구간 첫 층(1, 11, 21층...): 엘리트 제외 (일반/캠프 중 등장)
   * - 보스 직전 층(9, 19, 29층...) 또는 [006 요람사진] 보유 시: 캠프 1개 확정 포함
   */
  generatePathsForCurrentFloor() {
    if (this.isDreamMode()) {
      this.currentPaths = ['NORMAL', 'ELITE', 'CAMP', 'LAKE', 'BOSS', 'DREAM_BOSS'];
      return;
    }

    const floor = this.state.floor;
    if (floor % 10 === 0) {
      this.currentPaths = ['BOSS'];
      return;
    }

    const optionCount = RNG.randInt(2, 3);
    const pool = (floor % 10 === 1) ? ['NORMAL', 'CAMP'] : ['NORMAL', 'ELITE', 'CAMP'];
    let options = RNG.sampleUnique(pool, Math.min(optionCount, pool.length));

    const isCampMilestone = (floor % 10 === 9);
    const forceCamp = isCampMilestone || this.hasRelic('006');

    if (forceCamp && !options.includes('CAMP')) {
      options[RNG.randInt(0, options.length - 1)] = 'CAMP';
    }

    this.currentPaths = RNG.sampleUnique(options, options.length);
  },

  // 생성된 갈림길(일반 / 엘리트 / 캠프 / 호수 / 보스 / 흩어진 별빛) 선택지 UI 렌더링
  renderPathSelection() {
    const meta = {
      NORMAL: { title: '⚔️ 일반', desc: '일반 적과 교전합니다. (카드 보상)', color: 'var(--accent)' },
      ELITE: { title: '🔥 엘리트', desc: '강력한 적과 교전합니다. (카드 + 유물 보상)', color: 'var(--fx-purple)' },
      CAMP: { title: '⛺ 캠프', desc: '체력 35% 회복 또는 덱에서 카드 1장을 제거합니다.', color: 'var(--fx-green)' },
      LAKE: { title: '🌊 호수', desc: '체력을 100% 회복하거나 보유한 특성·유물 중 1개를 제거합니다.', color: 'var(--fx-blue)' },
      BOSS: { title: '👑 보스', desc: '층의 지배자와 결전을 치릅니다. (HP 50% 회복 + 카드 + 유물 + 특성 보상)', color: 'var(--fx-red)' }
    };

    const items = this.currentPaths.map(type => {
      if (type === 'DREAM_BOSS') {
        const nextBossId = DREAM_BOSS_ORDER[this.state.dreamStars];
        const bossDef = nextBossId ? EnemyDB[nextBossId] : null;
        if (bossDef) {
          return {
            title: `⭐ 흩어진 별빛: ${bossDef.name} (HP ${bossDef.maxHp})`,
            desc: `다른 가능성의 강적 [${bossDef.name}]와(과) 결전을 치릅니다. (격파 시 ⭐+1 · 체크포인트 갱신 · HP 50% 회복 · 카드/유물/특성 보상)`,
            borderColor: 'var(--fx-yellow)',
            disabled: false,
            onClick: () => this.startCombatNode('DREAM_BOSS')
          };
        }
        return {
          title: `⭐ 흩어진 별빛 (현재 보스 모두 격파 완료)`,
          desc: `흩어진 별빛을 모두 쓰러뜨렸습니다. 일반·엘리트·캠프·호수로 자유롭게 등반을 이어갈 수 있습니다.`,
          borderColor: 'var(--border)',
          disabled: true
        };
      }

      return {
        title: meta[type].title,
        desc: meta[type].desc,
        borderColor: meta[type].color,
        onClick: () => {
          if (type === 'CAMP') this.renderCampView();
          else if (type === 'LAKE') this.renderLakeView();
          else this.startCombatNode(type);
        }
      };
    });

    if (this.isDreamMode()) {
      const anchorFloor = Number(SaveLedger.get('dream.anchor.floor')) || (this.NORMAL_MAX_FLOOR + 1);
      AppUI.setChoiceScreen(
        `🌙 ${this.state.floor}층 — 기사도: 몽중몽 (⭐${this.state.dreamStars})`,
        `HP: ${this.state.hp}/${this.state.maxHp} | 덱: ${this.state.deck.length}/${this.getMaxDeckSize()}장 | 체크포인트: ${anchorFloor}층`,
        items
      );
    } else {
      AppUI.setChoiceScreen(
        `🧭 ${this.state.floor}층 갈림길 선택`,
        `현재 HP: ${this.state.hp}/${this.state.maxHp} | 덱: ${this.state.deck.length}/${this.getMaxDeckSize()}장`,
        items
      );
    }
  },

  // 캠프 화면 렌더링: 최대 HP의 35% 휴식 회복 또는 마스터 덱에서 카드 1장 영구 제거
  renderCampView() {
    const healAmt = Math.floor(this.state.maxHp * 0.35);
    const canRemove = this.state.deck.length > this.MIN_DECK_SIZE;
    const items = [
      {
        title: `💚 휴식: 체력 35% 회복 (+${healAmt} HP)`,
        desc: `체력을 ${Math.min(this.state.maxHp, this.state.hp + healAmt)} / ${this.state.maxHp}(으)로 회복하고 다음 층으로 이동합니다.`,
        borderColor: 'var(--fx-green)',
        onClick: () => {
          this.state.hp = Math.min(this.state.maxHp, this.state.hp + healAmt);
          this.state.runLog.push(`${this.state.floor}F:캠프(휴식/HP:${this.state.hp})`);
          this.advanceFloor();
        }
      }
    ];

    if (canRemove) {
      this.state.deck.forEach((cid, idx) => {
        const c = CardDB[cid];
        items.push({
          title: `🗑️ 카드 제거: [${c.id}] ${c.name} (코스트 ${c.cost})`,
          desc: c.desc,
          borderColor: 'var(--fx-red)',
          onClick: () => {
            this.state.deck.splice(idx, 1);
            this.state.runLog.push(`${this.state.floor}F:캠프(제거:${c.name})`);
            this.advanceFloor();
          }
        });
      });
    } else {
      items.push({
        title: `🚫 카드 제거 불가 (최소 덱 ${this.MIN_DECK_SIZE}장 제한)`,
        desc: '현재 덱이 최소 매수이므로 카드를 더 제거할 수 없습니다.',
        disabled: true
      });
    }

    AppUI.setChoiceScreen(`⛺ ${this.state.floor}층 캠프`, '체력을 회복하거나 덱의 카드 1장을 제거하십시오.', items);
  },

  // 호수 렌더링
  renderLakeView() {
    const items = [
      {
        title: `💧 휴식: 체력 100% 완전 회복 (HP ${this.state.hp} → ${this.state.maxHp})`,
        desc: `호수에 몸을 담가 체력을 최대치(${this.state.maxHp})까지 완전히 회복하고 다음 층으로 이동합니다.`,
        borderColor: 'var(--fx-green)',
        onClick: () => {
          this.state.hp = this.state.maxHp;
          this.state.runLog.push(`${this.state.floor}F:호수(완전회복/HP:${this.state.hp})`);
          this.advanceFloor();
        }
      }
    ];

    // 보유 특성 제거 목록
    this.state.traits.forEach((tid, idx) => {
      const t = TraitDB[tid];
      if (!t) return;
      items.push({
        title: `🧬 특성 제거: [${t.id}] ${t.name}`,
        desc: `${t.desc} (제거 시 최대 HP 변동 효과도 원복됩니다.)`,
        borderColor: 'var(--fx-blue)',
        onClick: () => {
          this.state.traits.splice(idx, 1);
          if (t.onRemove) t.onRemove(this.state);
          this.state.runLog.push(`${this.state.floor}F:호수(특성제거:${t.name})`);
          this.advanceFloor();
        }
      });
    });

    // 보유 유물 제거 목록
    this.state.relics.forEach((rid, idx) => {
      const r = RelicDB[rid];
      if (!r) return;
      items.push({
        title: `🏺 유물 제거: [${r.id}] ${r.name}`,
        desc: r.desc,
        borderColor: 'var(--fx-yellow)',
        onClick: () => {
          this.state.relics.splice(idx, 1);
          if (rid === '015') this.state.relic015Wins = 0;
          this.state.runLog.push(`${this.state.floor}F:호수(유물제거:${r.name})`);
          this.advanceFloor();
        }
      });
    });

    items.push({
      title: '↩️ 갈림길로 돌아가기',
      desc: '아무 행동도 하지 않고 현재 층 선택 화면으로 돌아갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.renderPathSelection()
    });

    AppUI.setChoiceScreen(
      `🌊 ${this.state.floor}층 호수`,
      `체력을 100% 회복하거나, 빌드에 방해되는 특성(${this.state.traits.length}) · 유물(${this.state.relics.length})을 1개 버릴 수 있습니다.`,
      items
    );
  },

  /**
   * 전투 노드(NORMAL / ELITE / BOSS) 진입 및 CombatEngine 세팅
   * - 층수에 따라 10층 단위 티어 스케일링 적용: 적 최대 HP × 1.45^tier, 물리 공격력 +3×tier
   */
  startCombatNode(type) {
    let enemyId = 'COAL_MOLE';
    if (type === 'NORMAL') {
      enemyId = RNG.pickRandom(Object.values(EnemyDB).filter(e => !e.isBoss && !e.isElite && !e.isDreamBoss)).id;
    } else if (type === 'ELITE') {
      enemyId = RNG.pickRandom(Object.values(EnemyDB).filter(e => e.isElite && !e.isDreamBoss)).id;
    } else if (type === 'BOSS') {
      const allBosses = Object.values(EnemyDB).filter(e => e.isBoss && !e.isDreamBoss);
      if (this.isDreamMode()) {
        enemyId = RNG.pickRandom(allBosses).id;
      } else {
        const uncleared = allBosses.filter(b => !this.state.clearedBosses.includes(b.id));
        enemyId = RNG.pickRandom(uncleared.length > 0 ? uncleared : allBosses).id;
      }
    } else if (type === 'DREAM_BOSS') {
      enemyId = DREAM_BOSS_ORDER[this.state.dreamStars];
      if (!enemyId || !EnemyDB[enemyId]) return;
    }

    const eng = AppUI.engine;
    eng.combatEnded = false;
    eng.turn = 1;
    eng.replayDepth = 0;
    eng.isEnemyTurn = false;
    eng.phaseJustChanged = false;

    eng.player = new Entity('토끼기사', this.state.maxHp, true);
    eng.player.hp = this.state.hp;
    eng.player.energy = 0;
    eng.player.runTrackers.hitTakenCount = this.state.hitTakenCount;

    this.state.traits.forEach(tid => {
      const def = TraitDB[tid];
      if (!def) return;
      eng.player.traits.push({ id: tid, state: {} });
      if (def.modifyMaxEnergy) eng.player.maxEnergy = def.modifyMaxEnergy(eng.player.maxEnergy);
      if (def.modifyMaxCarryOver) eng.player.maxCarryOver = def.modifyMaxCarryOver(eng.player.maxCarryOver);
    });
    this.state.relics.forEach(rid => {
      const def = RelicDB[rid];
      if (!def) return;
      const inst = { id: rid, state: {} };
      if (def.onInit) def.onInit(inst);
      eng.player.relics.push(inst);
    });

    const shuffledIds = RNG.sampleUnique(this.state.deck, this.state.deck.length);
    eng.player.deck = shuffledIds.map(cid => eng.createCardInstance(cid));

    // 적 엔티티 초기화: 몽중몽 보스는 고정 스펙, 일반·엘리트는 4티어(50층) 상한 고정
    const eDef = EnemyDB[enemyId];
    let scaledHp = eDef.maxHp;
    let tierDamageBonus = 0;
    if (!eDef.isDreamBoss) {
      const tier = Math.min(4, Math.floor((this.state.floor - 1) / 10));
      scaledHp = Math.floor(eDef.maxHp * Math.pow(1.45, tier));
      tierDamageBonus = tier * 3;
    }

    eng.enemy = new Entity(eDef.name, scaledHp, false);
    eng.enemy.enemyId = enemyId;
    eng.enemy.tierDamageBonus = tierDamageBonus;
    if (enemyId === 'BOSS_ARCHANGEL_NAEL') {
      eng.statuses.setOrMaxContext(eng.enemy, 'CTX_ASCENDANT', 1);
    }
    if (eDef.onBattleStart) {
      eDef.onBattleStart(eng, eng.enemy, eng.player);
    }

    eng.onCardPlayedCallback = null;
    eng.onCombatEndCallback = (victory) => {
      AppUI.runAfterLogs(() => this.onCombatFinished(victory, type, enemyId));
    };

    AppUI.enterRogueCombatView();
    eng.emitLog(`⚔️ [${this.state.floor}층] ${eDef.name} (HP ${scaledHp}) 전투 개시!`, 'log-sys');
    eng.startPlayerTurn();
  },

  /**
   * 전투 종료 후 승패 정산 및 보상 대기열(rewardQueue) 구성
   * - 패배 시: 사망 원인 및 여정 로그 기록 후 런 종료(active = false)
   * - 승리 시: 노드 유형(일반/엘리트/보스) 및 유물(마도서, 별빛 망토)에 따라 보상 큐 적재
   * - 몽중몽 추가
   */
  onCombatFinished(victory, nodeType, enemyId) {
    const eng = AppUI.engine;
    const eName = EnemyDB[enemyId]?.name || enemyId;
    this.state.hp = eng.player.hp;
    this.state.hitTakenCount = eng.player.runTrackers.hitTakenCount;

    if (!victory) {
      const cause = eng.player.lastHitReason || '알 수 없음';
      this.state.deathCause = `${this.state.floor}F ${eName} (${eng.turn}턴) - [${cause}]`;
      this.state.runLog.push(`${this.state.floor}F:${eName}(패/${eng.turn}T)`);

      // 몽중몽 구간 패배 시: 세이브 삭제 대신 콜드슬립 체크포인트로 즉시 복구
      if (this.isDreamMode() && this.state.dreamUnlocked) {
        const anchorFloor = this.restoreFromDreamAnchor();
        AppUI.mode = 'ROGUE_HUB';
        AppUI.go('screen-choice');
        AppUI.setChoiceScreen(
          '💫 몽중몽 도전 실패 — 체크포인트 회귀',
          `${this.state.deathCause}에 의해 쓰러졌습니다. 마지막 체크포인트(${anchorFloor}층) 스펙으로 복구되었습니다.`,
          [
            {
              title: `🔄 ${anchorFloor}층 체크포인트에서 다시 도전`,
              desc: `HP ${this.state.hp}/${this.state.maxHp} · 덱 ${this.state.deck.length}장 상태로 몽중몽 허브로 복귀합니다.`,
              borderColor: 'var(--fx-yellow)',
              onClick: () => this.enterHubForCurrentFloor()
            },
            {
              title: '🏠 타이틀로 돌아가기',
              desc: '복구된 체크포인트 세이브를 유지한 채 로비로 이동합니다.',
              borderColor: 'var(--border)',
              onClick: () => AppUI.returnToLobby()
            }
          ]
        );
        return;
      }

      // 1~50층 일반 구간 패배 시: 기존과 동일하게 런 종료
      this.state.active = false;
      this.syncToSaveLedger();
      AppUI.mode = 'ROGUE_HUB';
      AppUI.go('screen-choice');
      AppUI.setChoiceScreen('💀 기사도 등반 실패', `${this.state.deathCause}에 의해 쓰러졌습니다.`, [
        { title: '🏠 타이틀로 돌아가기', desc: '세이브를 정리하고 메인 화면으로 이동합니다.', borderColor: 'var(--fx-red)', onClick: () => AppUI.returnToLobby() }
      ]);
      return;
    }

    const resultTag = eng.enemy.peaceAchieved ? '평화' : '승';
    this.state.runLog.push(`${this.state.floor}F:${eName}(${resultTag}/${eng.turn}T/HP:${eng.player.hp})`);
    this.rewardQueue = [];

    if (nodeType === 'NORMAL') {
      if (enemyId === 'NUN_NAEL' && eng.enemy.peaceAchieved) {
        this.rewardQueue.push({
          type: 'CARD',
          allCards: true,
          note: '✨ [나엘의 축복] 평화를 지킨 보답으로 전체 카드 중 1장을 선택하십시오!'
        });
      } else {
        this.rewardQueue.push({ type: 'CARD' });
      }
      if (this.hasRelic('005') && RNG.randInt(1, 100) <= 20) {
        this.rewardQueue.push({ type: 'RELIC', note: '🏺 유물 [마도서] 20% 확률 발동!' });
      }
    } else if (nodeType === 'ELITE') {
      this.rewardQueue.push({ type: 'CARD' });
      this.rewardQueue.push({ type: 'RELIC' });
    } else if (nodeType === 'BOSS') {
      if (!this.state.clearedBosses.includes(enemyId)) this.state.clearedBosses.push(enemyId);
      const healAmt = Math.floor(this.state.maxHp * 0.5);
      this.state.hp = Math.min(this.state.maxHp, this.state.hp + healAmt);
      this.rewardQueue.push({ type: 'CARD', note: `👑 보스 격파! 체력 50%(+${healAmt}) 회복 완료` });
      this.rewardQueue.push({ type: 'RELIC' });
      this.rewardQueue.push({ type: 'TRAIT' });
    } else if (nodeType === 'DREAM_BOSS') {
      this.state.dreamStars += 1;
      this.pendingDreamAnchorUpdate = true;
      const healAmt = Math.floor(this.state.maxHp * 0.5);
      this.state.hp = Math.min(this.state.maxHp, this.state.hp + healAmt);
      this.rewardQueue.push({ type: 'CARD', note: `⭐ 흩어진 별빛 [${eName}] 격파! (⭐${this.state.dreamStars}) 체력 50%(+${healAmt}) 회복` });
      this.rewardQueue.push({ type: 'RELIC' });
      this.rewardQueue.push({ type: 'TRAIT' });
    }

    this.state.relics.forEach(rid => {
      if (RelicDB[rid]?.onCombatVictory) {
        RelicDB[rid].onCombatVictory(this, this.rewardQueue);
      }
    });

    this.syncToSaveLedger();
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    this.processNextReward();
  },

  // 보상 대기열에서 다음 보상을 하나씩 꺼내 화면에 표시 (모두 처리했으면 다음 층으로 이동)
  processNextReward() {
    if (this.rewardQueue.length === 0) {
      this.advanceFloor();
      return;
    }
    const next = this.rewardQueue.shift();
    if (next.type === 'CARD') this.renderCardReward(next.note, !!next.allCards);
    else if (next.type === 'RELIC') this.renderRelicReward(next.note, !!next.isBonus);
    else if (next.type === 'TRAIT') this.renderTraitReward();
  },

  // 카드 보상 선택 화면 렌더링 (일반 3~4택 1 또는 별빛 망토/나엘 축복 전체 카드 선택)
  renderCardReward(note = '', allCards = false) {
    const choiceCount = this.getRewardCardChoiceCount(); // 👈 이 1줄 복구
    const selectableCardIds = Object.keys(CardDB).filter(id => !CardDB[id].isToken);
    const offeredIds = allCards
      ? selectableCardIds.sort((a, b) => a.localeCompare(b))
      : RNG.sampleUnique(selectableCardIds, choiceCount);

    const maxDeck = this.getMaxDeckSize();
    const isFull = this.state.deck.length >= maxDeck;

    const skipItem = {
      title: '⏭️ 카드 보상 건너뛰기',
      desc: '카드를 추가하지 않고 다음 보상으로 넘어갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.processNextReward()
    };

    const items = offeredIds.map(cid => {
      const c = CardDB[cid];
      const copies = this.state.deck.filter(x => x === cid).length;
      const canAdd = !isFull && copies < 3;
      return {
        title: `🃏 [${c.id}] ${c.name} (코스트 ${c.cost} | 보유 ${copies}/3)`,
        desc: `${c.desc}${!canAdd ? (isFull ? ' [덱 상한 도달]' : ' [동명 3장 제한]') : ''}`,
        borderColor: 'var(--fx-yellow)',
        disabled: !canAdd,
        onClick: () => {
          if (!canAdd) return;
          this.state.deck.push(cid);
          this.syncToSaveLedger();
          this.processNextReward();
        }
      };
    });

    if (allCards) items.unshift(skipItem);
    else items.push(skipItem);

    const titleText = allCards ? '✨ 별빛 망토 — 전체 카드 선택' : '🎁 전투 승리 — 카드 보상';
    AppUI.setChoiceScreen(titleText, note || `원하는 카드를 1장 선택하십시오. (현재 덱 ${this.state.deck.length}/${maxDeck}장)`, items);
  },

  // 미보유 유물 중 무작위 2종을 제시해 1개를 고르는 유물 보상 화면 렌더링
  renderRelicReward(note = '', isBonus = false) {
    const unowned = Object.keys(RelicDB).filter(id => !this.hasRelic(id));
    if (unowned.length === 0) { this.processNextReward(); return; }
    const offered = RNG.sampleUnique(unowned, 2);

    const items = offered.map(rid => {
      const r = RelicDB[rid];
      return {
        title: `🏺 [${r.id}] ${r.name}`,
        desc: r.desc,
        borderColor: 'var(--fx-yellow)',
        onClick: () => {
          if (!this.hasRelic(rid)) {
            this.state.relics.push(rid);
            this.state.traits.forEach(tid => {
              if (TraitDB[tid]?.onRelicAcquired) {
                TraitDB[tid].onRelicAcquired(this, this.rewardQueue, isBonus);
              }
            });
          }
          this.syncToSaveLedger();
          this.processNextReward();
        }
      };
    });
    items.push({
      title: '⏭️ 유물 건너뛰기',
      desc: '유물을 획득하지 않고 넘어갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.processNextReward()
    });

    AppUI.setChoiceScreen('🏺 유물 보상 (2택 1)', note || '보유하지 않은 유물 중 1개를 선택하십시오.', items);
  },

  // 보스 격파 후 미보유 특성 중 무작위 2종을 제시해 1개를 고르는 특성 보상 화면 렌더링
  renderTraitReward() {
    const unowned = Object.keys(TraitDB).filter(id => !this.hasTrait(id));
    if (unowned.length === 0) { this.processNextReward(); return; }
    const offered = RNG.sampleUnique(unowned, 2);

    const items = offered.map(tid => {
      const t = TraitDB[tid];
      return {
        title: `🧬 [${t.id}] ${t.name}`,
        desc: t.desc,
        borderColor: 'var(--fx-blue)',
        onClick: () => {
          if (!this.hasTrait(tid)) {
            this.state.traits.push(tid);
            if (t.onAcquire) t.onAcquire(this.state);
          }
          this.syncToSaveLedger();
          this.processNextReward();
        }
      };
    });
    items.push({
      title: '⏭️ 특성 건너뛰기',
      desc: '특성을 획득하지 않고 넘어갑니다.',
      borderColor: 'var(--border)',
      onClick: () => this.processNextReward()
    });

    AppUI.setChoiceScreen('🧬 보스 격파 — 특성 보상 (2택 1)', '보유하지 않은 특성 중 1개를 선택하십시오.', items);
  },

  // 다음 층으로 전진하며 층 이동 시 발동하는 특성 효과(빳빳한 털, 약초 채집가) 적용
  advanceFloor() {
    this.state.floor += 1;
    this.state.traits.forEach(tid => {
      if (TraitDB[tid]?.onAdvanceFloor) TraitDB[tid].onAdvanceFloor(this.state);
    });

    // 50층 돌파 직후(51층 도달) 또는 몽중몽 보스 격파 후 보상 수령 완료 시 체크포인트 갱신
    if ((this.state.floor === this.NORMAL_MAX_FLOOR + 1 && !this.state.dreamUnlocked) || this.pendingDreamAnchorUpdate) {
      this.pendingDreamAnchorUpdate = false;
      this.saveDreamAnchor();
    }

    this.syncToSaveLedger();
    this.enterHubForCurrentFloor();
  },

  // 구현된 최고층(현재 50층) 돌파 시 세이브를 보존한 채 대기 상태로 전환하는 완료 화면
  renderMaxFloorReached(maxFloor) {
    AppUI.setChoiceScreen(
      `🚩 구현 최고층(${maxFloor}층) 돌파 완료!`,
      `현재 ${this.state.floor}층 대기 중 | 카드(${this.state.deck.length}장), HP(${this.state.hp}/${this.state.maxHp}), 유물(${this.state.relics.length}), 특성(${this.state.traits.length})이 모두 세이브에 보존되었습니다.`,
      [
        {
          title: '💾 세이브 보존 후 로비로 이동',
          desc: '추후 보스가 추가되면 현재 스펙 그대로 다음 층부터 이어서 등반할 수 있습니다.',
          borderColor: 'var(--accent)',
          onClick: () => AppUI.returnToLobby()
        }
      ]
    );
  }
};

/**
 * ============================================================================
 * 7. StoryDB & StorySequencer (스토리 모드 대본 데이터 및 진행 엔진)
 * - 흐름: StoryDB의 script 배열을 StorySequencer.queue에 복사한 뒤,
 *         next() -> executeCommand()로 명령어를 하나씩 꺼내 실행하고
 *         유저 입력(화면 터치 / 선택지 클릭 / 카드 사용)이 들어올 때마다 다음 명령어로 진행
 * ============================================================================
 */

// [스토리 1-1 전용] 석궁병 제나의 연출용 콤보 패턴
// - 스텝 밟기 4회, 토끼풀 4회, 화살(6딜) 4회를 무작위 순서로 섞은 뒤 실제 CombatEngine 메서드로 실행
// - 실제 엔진을 태우므로 붉은 피격 연출, HP 감소, 누적 피격 횟수(4회 -> 1-1 복수 32딜)가 자동 연동됨
function executeZenaCombo(engine) {
  const actions = [
    ...Array(4).fill('STEP'),
    ...Array(4).fill('CLOVER'),
    ...Array(4).fill('ARROW')
  ].sort(() => Math.random() - 0.5);

  actions.forEach((act) => {
    if (act === 'STEP') {
      engine.recoverEnergy(engine.enemy, 1);
      engine.emitLog(`석궁병 제나의 [스텝 밟기]! 제나가 활력을 회복했습니다. 추가로 카드를 사용합니다.`, 'log-story');
    } else if (act === 'CLOVER') {
      engine.statuses.apply(engine.enemy, engine.enemy, 'REGEN', 3);
      engine.emitLog(`석궁병 제나의 [토끼풀]! 제나가 카드를 1장 뽑고 재생을 획득했습니다.`, 'log-story');
    } else if (act === 'ARROW') {
      engine.dealDamage(new DamagePacket({
        source: engine.enemy, target: engine.player, amount: 6,
        type: DAMAGE_TYPE.PHYSICAL, isStrike: true, reason: `화살 속사`
      }));
    }
  });
  engine.emitLog(`⚡ 석궁병 제나의 턴이 종료되었습니다.`, 'log-sys');
}

// [스토리 1-2 전용] 겁먹은 굴토끼의 연출용 패턴 (저주 3, 출혈 3, 착란 3 부여)
function executeGrabbitCombo(engine) {
  engine.emitLog(`겁에 질린 굴토끼가 눈을 질끈 감고 무작정 흙먼지와 돌멩이를 집어던집니다!`, 'log-story');
  engine.statuses.apply(engine.enemy, engine.player, 'CURSE', 3);
  engine.statuses.apply(engine.enemy, engine.player, 'BLEED', 3);
  engine.statuses.apply(engine.enemy, engine.player, 'DELIRIUM', 3);
  engine.emitLog(`⚡ 굴토끼의 턴이 종료되었습니다.`, 'log-sys');
}

/**
 * [StorySequencer] 스토리 대본을 순차 실행하고 유저 입력 대기를 관리하는 상태 머신
 */
const StorySequencer = {
  engine: null,
  activeChapter: null,   // 현재 플레이 중인 StoryDB 챕터 객체
  queue: [],             // 앞으로 실행할 남은 명령어 큐
  stageVars: {},         // 현재 챕터 내 임시 변수 저장소 (예: { route: 1 })
  state: 'IDLE',         // 현재 대기 상태 ('IDLE' | 'WAIT_TEXT' | 'WAIT_CHOICE' | 'WAIT_CARD' | 'WAIT_LOGS' | 'WAIT_FINISH')
  inCombatStage: false,  // SETUP_STAGE를 지나 전투 화면(#screen-combat)에 진입했는지 여부
  logTimer: null,        // (구버전 타이머 호환용)

  init(combatEngine) { this.engine = combatEngine; },

  // 선택한 챕터 초기화 및 실행 시작
  startChapter(chapterId) {
    const chapter = StoryDB.find(c => c.id === chapterId);
    if (!chapter) return;
    this.clearTimers();
    RNG.reset();
    this.activeChapter = chapter;
    this.queue = [...chapter.script]; // 원본 script 훼손 방지를 위해 얕은 복사
    this.stageVars = {};
    this.state = 'IDLE';
    this.inCombatStage = false;

    this.engine.combatEnded = false;
    this.engine.onCombatEndCallback = null;

    // 유저가 GIVE_CARD로 받은 카드를 실행했을 때, 로그 출력이 끝난 뒤 다음 스크립트로 자동 진행
    this.engine.onCardPlayedCallback = () => {
      if (this.state === 'WAIT_CARD') {
        this.state = 'IDLE';
        AppUI.runAfterLogs(() => {
          this.next();
        });
      }
    };

    document.getElementById('vn-chapter-title').textContent = chapter.title;
    AppUI.mode = 'STORY';
    AppUI.go('screen-vn');

    // 비주얼 노벨 스탠딩 일러스트 적용 (#screen-vn이 활성화된 뒤 적용해야 정상 표시됨)
    const vnUrl = SpriteMap['토끼기사 스탠딩'];
    const vnSlot = document.getElementById('vn-sprite-slot');
    if (vnSlot && vnUrl) {
      vnSlot.style.backgroundImage = `url('${vnUrl}')`;
      vnSlot.innerHTML = '';
    } else if (vnSlot) {
      vnSlot.innerHTML = '[스탠딩 도트]<br>토끼기사';
    }

    AppUI.clearLogs();
    this.next();
  },

  clearTimers() { if (this.logTimer) { clearInterval(this.logTimer); this.logTimer = null; } },

  // 큐에서 다음 명령어 1개를 꺼내 실행 (큐가 비었으면 챕터 클리어 안내 출력)
  next() {
    if (this.queue.length === 0) {
      this.state = 'WAIT_FINISH';
      AppUI.showStoryText('시스템', `[${this.activeChapter.title}] 클리어! (터치 시 로비로 돌아갑니다)`, this.inCombatStage);
      return;
    }
    this.executeCommand(this.queue.shift());
  },

  // 명령어 type별 실제 동작 처리기
  executeCommand(cmd) {
    switch (cmd.type) {
      case 'TEXT':
        // 대사 출력 후 유저 화면 터치 대기 (inCombatStage에 따라 출력 위치 자동 분기)
        this.state = 'WAIT_TEXT';
        AppUI.showStoryText(cmd.speaker || '나레이션', cmd.text, this.inCombatStage);
        break;

      case 'CHOICE':
        // 선택지 버튼 생성 후 유저 클릭 대기 -> 선택 결과를 stageVars 및 SaveLedger에 저장
        this.state = 'WAIT_CHOICE';
        AppUI.showStoryChoices(cmd.speaker || '선택', cmd.text, cmd.options, (opt) => {
          this.stageVars[cmd.varKey] = opt.value;
          if (opt.saveFlag) SaveLedger.set(opt.saveFlag.key, opt.saveFlag.val);
          this.state = 'IDLE';
          this.next();
        });
        break;

      case 'SETUP_STAGE':
        // 비주얼 노벨 화면에서 전투 화면(#screen-combat)으로 전환하고 양측 캐릭터 초기화
        this.inCombatStage = true;
        this.engine.player = new Entity(cmd.player.name, cmd.player.maxHp || cmd.player.hp, true);
        this.engine.player.hp = cmd.player.hp;
        this.engine.player.energy = 3;
        this.engine.enemy = new Entity(cmd.enemy.name, cmd.enemy.maxHp || cmd.enemy.hp, false);
        this.engine.enemy.hp = cmd.enemy.hp;
        AppUI.go('screen-combat');
        AppUI.renderStageActors();
        this.next();
        break;

      case 'SCRIPTED_ACTION':
        // 스크립트 전투 함수(executeZenaCombo 등) 실행 -> 쌓인 전투 로그를 유저가 모두 클릭할 때까지 대기
        this.state = 'WAIT_LOGS';
        AppUI.hideCombatVnOverlay();
        if (cmd.execute) cmd.execute(this.engine);
        AppUI.runAfterLogs(() => {
          this.state = 'IDLE';
          this.next();
        });
        break;

      case 'SCRIPTED_LOGS':
        // 지정된 로그 줄들을 전투 로그 큐에 넣고 유저가 모두 읽을 때까지 대기
        this.state = 'WAIT_LOGS';
        AppUI.hideCombatVnOverlay();
        (cmd.logs || []).forEach(line => this.engine.emitLog(line, 'log-story'));
        AppUI.runAfterLogs(() => {
          this.state = 'IDLE';
          this.next();
        });
        break;

      case 'BRANCH':
        // 분기 조건 충족 시 해당 steps를 남은 대본(queue)의 맨 앞(unshift)에 끼워 넣어 즉시 실행
        if (typeof cmd.condition === 'function' && cmd.condition(this.stageVars, SaveLedger) && Array.isArray(cmd.steps)) {
          this.queue.unshift(...cmd.steps);
        }
        this.next();
        break;

      case 'RIG_NEXT_RANDOM':
        // 다음 난수 추첨 결과를 지정값으로 고정
        RNG.rigNext(cmd.value);
        this.next();
        break;

      case 'GIVE_CARD': {
        // 손패를 비우고 지정 카드를 1장 지급·자동 선택 상태로 둔 뒤 유저가 [카드 실행]을 누를 때까지 대기
        this.state = 'WAIT_CARD';
        AppUI.hideCombatVnOverlay();
        this.engine.player.hand = [];
        const cardInst = this.engine.createCardInstance(cmd.cardId, !!cmd.freeCost);
        this.engine.player.hand.push(cardInst);
        AppUI.selectedCardIdx = 0;
        AppUI.renderStageActors();
        break;
      }

      case 'SET_SAVE':
        // 클리어 플래그 등 영구 데이터 저장 후 즉시 다음 명령어로 진행
        SaveLedger.set(cmd.key, cmd.value);
        this.next();
        break;

      default:
        this.next();
        break;
    }
  },

  // 유저가 대사창(#screen-vn 또는 #combat-vn-overlay)을 터치했을 때 현재 상태에 맞춰 다음 단계로 진행
  onUserClickDialogue() {
    if (this.state === 'WAIT_TEXT') {
      this.state = 'IDLE';
      AppUI.hideCombatVnOverlay();
      this.next();
    } else if (this.state === 'WAIT_FINISH') {
      this.state = 'IDLE';
      AppUI.hideCombatVnOverlay();
      AppUI.returnToLobby();
    }
  }
};

/**
 * ============================================================================
 * 8. AppUI (화면 전환, 순차 로그 연출 큐, 전투 HUD 렌더링, 팝업/도감 컨트롤러)
 * - 역할: 데이터(DB)와 코어 로직(Engine, RogueManager, StorySequencer)의 결과를
 *         실제 HTML DOM 요소에 그려주고, 유저의 터치 입력을 각 엔진으로 전달함
 * ============================================================================
 */
const AppUI = {
  engine: null,
  mode: 'LOBBY',          // 현재 앱 상태 ('LOBBY' | 'STORY' | 'ROGUE_HUB' | 'ROGUE_COMBAT')
  selectedCardIdx: null,  // 손패에서 터치해 선택 중인 카드 인덱스 (선택 안 했으면 null)

  // --- [순차 로그 연출 큐 상태] ---
  logViewMode: 'STEP',       // 'STEP'(1줄씩 클릭 재생) | 'FULL'(즉시 전체 출력)
  presentationQueue: [],     // 재생 대기 중인 로그 프레임 목록
  pendingFxList: [],         // 현재 로그 줄이 출력될 때 함께 터뜨릴 5색 테두리/흔들림 연출 임시 바구니
  pendingFloatingTexts: [],  // 현재 로그 줄이 출력될 때 함께 띄울 플로팅 텍스트 임시 바구니
  postQueueActions: [],      // 쌓인 로그를 끝까지 읽은 직후 실행할 후속 작업
  autoLogPlay: false,        // 0.3초 간격 로그 자동 진행 활성화 여부
  autoLogTimer: null,        // 자동 진행 setTimeout 핸들

  // ==========================================================================
  // [A] 초기화 및 전역 화면 · BGM 제어
  // ==========================================================================

  // 앱 최초 실행 시 1회 호출: 전투 엔진 생성 및 콜백 연결, 세이브/로고 초기화
  init() {
    this.engine = new CombatEngine();

    // 1) 엔진에서 5색 박스 연출 요청이 오면 즉시 실행하지 않고 현재 로그 프레임 바구니에 적재
    this.engine.onFxCallback = (boxId, fxClass) => {
      this.pendingFxList.push({ boxId, fxClass });
    };

    // 2) 엔진에서 플로팅 텍스트 요청이 오면 현재 로그 프레임 바구니에 적재
    this.engine.onFloatingTextCallback = (boxId, text, colorClass) => {
      this.pendingFloatingTexts.push({ boxId, text, colorClass });
    };

    // 3) 엔진에서 로그 1줄이 발생할 때마다 그 시점의 체력/방어 스냅샷과 함께 재생 큐에 등록
    this.engine.onLogCallback = (msg, cls) => {
      this.enqueueLogStep(msg, cls);
    };

    // 4) 대기 중인 로그 큐가 비어있을 때만 화면을 즉시 갱신 (큐가 돌고 있으면 스냅샷이 화면을 제어)
    this.engine.onRenderCallback = () => {
      if (this.presentationQueue.length === 0) {
        this.renderStageActors();
      }
    };

    StorySequencer.init(this.engine);
    this.refreshSaveTextarea();

    // 타이틀 화면 메인 로고 이미지 적용
    const logoUrl = SpriteMap['메인 로고'];
    const logoSlot = document.getElementById('main-logo-slot');
    if (logoSlot && logoUrl) {
      logoSlot.style.backgroundImage = `url('${logoUrl}')`;
      logoSlot.innerHTML = '';
    }
  },

  // 우측 상단 BGM 온/오프 토글
  toggleBgm() {
    const audio = document.getElementById('bgm-audio');
    const btn = document.getElementById('btn-bgm-toggle');
    if (!audio || !btn) return;

    if (audio.paused) {
      audio.play().then(() => {
        btn.textContent = '🔊 BGM: ON';
        btn.style.borderColor = 'var(--fx-green)';
        btn.style.color = 'var(--fx-green)';
      }).catch(() => {
        this.openInfo('🔇 재생 실패', '<code>rabbitknight.mp3</code> 파일을 찾을 수 없거나 브라우저에서 차단되었습니다.');
      });
    } else {
      audio.pause();
      btn.textContent = '🔇 BGM: OFF';
      btn.style.borderColor = 'var(--border)';
      btn.style.color = 'var(--text-main)';
    }
  },

  // 전술 메뉴의 [⏩ 빠른진행] 온/오프 토글
  toggleAutoLogPlay() {
    this.autoLogPlay = !this.autoLogPlay;
    const btn = document.getElementById('btn-auto-log');
    if (btn) {
      btn.textContent = this.autoLogPlay ? '⏩ 빠른진행: ON' : '⏩ 빠른진행: OFF';
      btn.style.borderColor = this.autoLogPlay ? 'var(--fx-green)' : 'var(--border)';
      btn.style.color = this.autoLogPlay ? 'var(--fx-green)' : 'var(--text-main)';
    }

    if (this.autoLogPlay) {
      if (this.presentationQueue.length > 0) {
        this.scheduleAutoLogStep();
        this.updateLogStepUI();
      }
    } else {
      this.clearAutoLogTimer();
      this.updateLogStepUI();
    }
  },

  scheduleAutoLogStep() {
    this.clearAutoLogTimer();
    if (!this.autoLogPlay || this.presentationQueue.length === 0) return;
    this.autoLogTimer = setTimeout(() => {
      this.autoLogTimer = null;
      this.advanceLogStep();
    }, 300); // 0.3초 간격
  },

  clearAutoLogTimer() {
    if (this.autoLogTimer) {
      clearTimeout(this.autoLogTimer);
      this.autoLogTimer = null;
    }
  },

  // 전투 화면(#screen-combat) 빈 곳을 터치했을 때의 통합 입력 처리
  handleCombatScreenClick(event) {
    // 1. 메뉴, 턴 종료, 스킵 버튼이나 상태이상 배지(.s-tag)를 직접 누른 경우엔 화면 넘김 차단
    if (event.target.closest('button, .s-tag')) return;

    // 2. 스토리 모드 전투 중 대사 오버레이가 떠 있으면 스토리 대사 진행
    const vnOverlay = document.getElementById('combat-vn-overlay');
    if (vnOverlay && !vnOverlay.classList.contains('hidden')) {
      StorySequencer.onUserClickDialogue();
      return;
    }

    // 3. 읽어야 할 전투 로그가 남아있으면 다음 로그 1줄 진행
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
    }
  },

  // 지정한 화면 ID(.screen)만 활성화하고 나머지는 숨김
  go(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
    if (screenId === 'screen-start' || screenId === 'screen-save' || screenId === 'screen-story-list') {
      this.refreshSaveTextarea();
    }
  },

  // 현재 진행 상태를 세이브에 동기화한 뒤 타이틀 로비(#screen-start)로 복귀
  returnToLobby() {
    StorySequencer.clearTimers();
    if (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB') {
      RogueManager.syncToSaveLedger();
    }
    this.mode = 'LOBBY';
    this.selectedCardIdx = null;
    this.go('screen-start');
  },

  // ==========================================================================
  // [B] 팝업 모달 · 전술 메뉴 · 도감 · 패치노트 · 세이브 UI
  // ==========================================================================

  // 모달 오버레이 열기/닫기
  toggleModal(id, show) {
    document.getElementById(id).classList.toggle('open', show);
  },

  // 범용 정보 팝업(#modal-info)에 제목과 HTML 본문을 채워 띄움
  openInfo(title, descHtml) {
    document.getElementById('info-title').textContent = title;
    document.getElementById('info-desc').innerHTML = descHtml;
    this.toggleModal('modal-info', true);
  },

  // 상태이상 배지 터치 시 해당 버프/디버프/의념의 설명과 누적 수치를 팝업으로 표시
  openStatusInfo(statusId, stacks, accumulated) {
    const def = StatusDB[statusId];
    const meta = StatusMeta[statusId] || { icon: '📌', desc: '상태 효과' };
    const accText = accumulated > 0 ? `<br><br><span style="color:var(--fx-yellow);">현재 누적 수치: ${accumulated}</span>` : '';
    this.openInfo(`${meta.icon} ${def.name} (스택: ${stacks})`, `${meta.desc}${accText}`);
  },

  // 보라색 배너 우측 [전체 로그] 버튼 클릭 시 지나간 전투 로그 전체를 팝업으로 출력
  openFullLogModal() {
    const logHtml = document.getElementById('log-box').innerHTML;
    this.openInfo('📜 전투 로그 기록', logHtml || '<div style="color:var(--text-sub);">기록된 로그가 없습니다.</div>');
  },

  // [메뉴] 버튼 클릭 시 전술 메뉴 팝업 열기 (층수, 누적 피격, 보유 특성/유물 배지, 덱/무덤 조회 버튼)
  openTacticalMenu() {
    const isRogue = (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB'); // 👈 이 1줄이 빠졌습니다
    const floorText = isRogue
      ? (RogueManager.isDreamMode()
          ? `${RogueManager.state.floor}층 (별빛회수 · ⭐${RogueManager.state.dreamStars})`
          : `${RogueManager.state.floor}층 (상한 ${RogueManager.getMaxFloor()}층)`)
      : '스토리 스테이지';
    const hitCount = this.mode === 'ROGUE_HUB' ? RogueManager.state.hitTakenCount : this.engine.player.runTrackers.hitTakenCount;

    const traitIds = isRogue ? RogueManager.state.traits : this.engine.player.traits.map(t => t.id);
    const relicIds = isRogue ? RogueManager.state.relics : this.engine.player.relics.map(r => r.id);

    const traitTags = traitIds.map(tid => {
      const t = TraitDB[tid];
      return `<span class="s-tag buff" onclick="AppUI.openInfo('🧬 특성: ${t.name}', '${t.desc}')">🧬 ${t.name}</span>`;
    }).join(' ') || '<span style="color:var(--text-sub);">없음</span>';

    const relicTags = relicIds.map(rid => {
      const r = RelicDB[rid];
      return `<span class="s-tag context" onclick="AppUI.openInfo('🏺 유물: ${r.name}', '${r.desc}')">🏺 ${r.name}</span>`;
    }).join(' ') || '<span style="color:var(--text-sub);">없음</span>';

    document.getElementById('menu-status-summary').innerHTML = `
      <div>🏰 진행 위치: <b>${floorText}</b> | 💥 누적 피격: <b>${hitCount}회</b></div>
      <div style="font-size:11px; color:var(--text-sub);">※ 아래 특성이나 유물 배지를 터치하면 상세 효과가 표시됩니다.</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"><b>보유 특성:</b> ${traitTags}</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"><b>보유 유물:</b> ${relicTags}</div>
    `;

    const pileBtns = document.getElementById('menu-pile-buttons');
    if (this.mode === 'ROGUE_HUB') {
      pileBtns.innerHTML = `
        <button style="flex:1;" onclick="AppUI.openPileViewer('MASTER')">🃏 현재 마스터 덱 (${RogueManager.state.deck.length}장)</button>
      `;
    } else {
      const p = this.engine.player;
      pileBtns.innerHTML = `
        <button style="flex:1;" onclick="AppUI.openPileViewer('DECK')">덱 잔량 (${p.deck.length}장)</button>
        <button style="flex:1;" onclick="AppUI.openPileViewer('GRAVE')">무덤 (${p.graveyard.length}장)</button>
      `;
    }

    this.toggleModal('modal-menu', true);
  },

  // 초상화 영역(#box-player / #box-enemy) 클릭 시 상세 상태 모달 열기
  onActorBoxClick(event, side) {
    // 하단 상태이상 배지(.s-tag)를 직접 누른 경우 기존 개별 설명 팝업 유지
    if (event.target.closest('.s-tag')) return;

    // 스토리 대사 오버레이가 떠 있거나 로그 재생 대기 중이면 화면 넘김(버블링) 우선
    const vnOverlay = document.getElementById('combat-vn-overlay');
    if (vnOverlay && !vnOverlay.classList.contains('hidden')) return;
    if (this.presentationQueue.length > 0) return;

    event.stopPropagation();
    this.openActorDetailModal(side);
  },

  // 플레이어 또는 적의 HP · 방어막 · 의념 · 버프 · 디버프 전체를 한눈에 보여주는 모달
  openActorDetailModal(side) {
    const ent = side === 'player' ? this.engine.player : this.engine.enemy;
    if (!ent) return;

    const renderGroup = (title, category, colorVar) => {
      const list = ent.statuses.filter(s =>
        StatusDB[s.id]?.category === category && (s.stacks > 0 || s.id === 'CTX_REINTERPRET')
      );
      if (list.length === 0) {
        return `
          <div style="margin-top:8px;">
            <div style="font-size:11.5px; font-weight:bold; color:${colorVar}; margin-bottom:4px;">${title} (0)</div>
            <div style="font-size:11px; color:var(--text-sub); padding-left:4px;">없음</div>
          </div>
        `;
      }
      const itemsHtml = list.map(s => {
        const def = StatusDB[s.id];
        const meta = StatusMeta[s.id] || { icon: '📌', desc: '설명 없음' };
        const accBadge = s.accumulated > 0
          ? ` <span style="color:var(--fx-yellow);">[누적: ${s.accumulated}]</span>`
          : '';
        return `
          <div style="background:var(--bg-card); border-left:3px solid ${colorVar}; border-radius:4px; padding:6px 8px; margin-bottom:5px;">
            <div style="font-weight:bold; color:${colorVar}; font-size:12px;">
              ${meta.icon} ${def.name} ×${s.stacks}${accBadge}
            </div>
            <div style="font-size:11px; color:#a9b1d6; line-height:1.35; margin-top:2px;">${meta.desc}</div>
          </div>
        `;
      }).join('');
      return `
        <div style="margin-top:8px;">
          <div style="font-size:11.5px; font-weight:bold; color:${colorVar}; margin-bottom:4px;">${title} (${list.length})</div>
          ${itemsHtml}
        </div>
      `;
    };

    const extraStat = side === 'player'
      ? `<span>⚡ 활력: <b>${ent.energy} / ${ent.maxEnergy}</b></span>`
      : (ent.tierDamageBonus > 0 ? `<span>⚔️ 티어 보너스: <b>+${ent.tierDamageBonus}</b></span>` : '');

    const html = `
      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:8px 10px; display:flex; flex-wrap:wrap; gap:10px; font-size:12px;">
        <span>❤️ HP: <b style="color:var(--fx-red);">${ent.hp} / ${ent.maxHp}</b></span>
        <span>🛡️ 방어막: <b style="color:var(--fx-blue);">${ent.armor}</b></span>
        ${extraStat}
      </div>
      ${renderGroup('✨ 의념', STATUS_CATEGORY.CONTEXT, 'var(--fx-yellow)')}
      ${renderGroup('💠 버프', STATUS_CATEGORY.BUFF, 'var(--fx-blue)')}
      ${renderGroup('☠️ 디버프', STATUS_CATEGORY.DEBUFF, 'var(--fx-purple)')}
    `;

    const label = side === 'player' ? `🛡️ ${ent.name} 상세 상태` : `👾 ${ent.name} 상세 상태`;
    this.openInfo(label, html);
  },

  // 마스터 덱(MASTER) / 남은 덱(DECK) / 무덤(GRAVE) 카드 목록 팝업 출력
  openPileViewer(pileType) {
    let cards = [];
    let title = '';
    if (pileType === 'MASTER') {
      title = `🃏 마스터 덱 목록 (${RogueManager.state.deck.length}장)`;
      cards = RogueManager.state.deck.map(cid => CardDB[cid]);
    } else if (pileType === 'DECK') {
      title = `🃏 남은 덱 목록 (${this.engine.player.deck.length}장 - 순서 섞임)`;
      cards = [...this.engine.player.deck].sort((a, b) => a.id.localeCompare(b.id));
    } else if (pileType === 'GRAVE') {
      title = `🪦 무덤 카드 목록 (${this.engine.player.graveyard.length}장)`;
      cards = [...this.engine.player.graveyard];
    }

    if (cards.length === 0) {
      this.openInfo(title, '<div style="color:var(--text-sub);">카드가 없습니다.</div>');
      return;
    }

    const lastGraveUid = this.engine.player.combatTrackers?.lastGraveyardCard?.uid;
    const html = cards.map(c => {
      const isLast = (pileType === 'GRAVE' && c.uid && c.uid === lastGraveUid);
      return `
        <div style="background:var(--bg-card); border:1px solid ${isLast ? 'var(--fx-yellow)' : 'var(--border)'}; border-radius:4px; padding:8px; margin-bottom:6px;">
          <div style="font-weight:bold; color:var(--fx-yellow); font-size:12px;">
            [${c.id}] ${c.name} (코스트 ${c.cost}) ${isLast ? '<span style="color:var(--fx-green);">[최근 묘지행 - 끼토산 대상]</span>' : ''}
          </div>
          <div style="font-size:11px; color:#a9b1d6; margin-top:2px;">${c.desc}</div>
        </div>
      `;
    }).join('');

    this.openInfo(title, html);
  },

  // 도감 화면 열기 및 카테고리별(카드/버프/디버프/의념/특성/유물/개체/룰북) 목록 렌더링
  openCodex(defaultTab = 'CARD') {
    this.go('screen-codex');
    this.renderCodex(defaultTab);
  },

  renderCodex(tab) {
    ['CARD', 'BUFF', 'DEBUFF', 'SEEKER', 'TRAIT', 'RELIC', 'ENEMY', 'RULE'].forEach(t => {
      const btn = document.getElementById(`tab-codex-${t}`);
      if (btn) btn.classList.toggle('active', t === tab);
    });

    const listEl = document.getElementById('codex-list');
    const countEl = document.getElementById('codex-count-info');
    let html = '';

    if (tab === 'CARD') {
      const cards = Object.values(CardDB).sort((a, b) => a.id.localeCompare(b.id));
      countEl.textContent = `전체 카드 목록 (${cards.length}종)`;
      html = cards.map(c => {
        const hitText = c.hits > 0 ? ` | 타수 ${c.hits}` : '';
        const typeColor = c.type === 'ATTACK' ? 'var(--fx-red)' : 'var(--fx-blue)';
        return `
          <div class="codex-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color:var(--fx-yellow); font-size:13px;">[${c.id}] ${c.name}</strong>
              <span style="font-size:11px; color:${typeColor}; font-weight:bold;">코스트 ${c.cost} · ${c.type}${hitText}</span>
            </div>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${c.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'BUFF' || tab === 'DEBUFF') {
      const isBuff = tab === 'BUFF';
      const statuses = Object.values(StatusDB)
        .filter(s => s.category === tab && !s.id.startsWith('CTX_'))
        .sort((a, b) => (a.code || '').localeCompare(b.code || ''));
      countEl.textContent = `${isBuff ? '버프' : '디버프'} 목록 (${statuses.length}종)`;
      html = statuses.map(s => {
        const meta = StatusMeta[s.id] || { icon: '📌', desc: '설명 없음' };
        const color = isBuff ? 'var(--fx-blue)' : 'var(--fx-purple)';
        return `
          <div class="codex-item" style="border-left: 3px solid ${color};">
            <strong style="color:${color}; font-size:13px;">${meta.icon} [${s.code}] ${s.name}</strong>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${meta.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'SEEKER') {
      const seekers = Object.values(StatusDB).filter(s => s.id.startsWith('CTX_'));
      countEl.textContent = `의념 목록 (${seekers.length}종)`;
      html = seekers.map(s => {
        const meta = StatusMeta[s.id] || { icon: '✨', desc: '설명 없음' };
        return `
          <div class="codex-item" style="border-left: 3px solid var(--fx-yellow);">
            <strong style="color:var(--fx-yellow); font-size:13px;">${meta.icon} ${s.name}</strong>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${meta.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'TRAIT') {
      const traits = Object.values(TraitDB).sort((a, b) => a.id.localeCompare(b.id));
      countEl.textContent = `특성 목록 (${traits.length}종)`;
      html = traits.map(t => `
        <div class="codex-item" style="border-left: 3px solid var(--fx-blue);">
          <strong style="color:var(--fx-blue); font-size:13px;">🧬 [${t.id}] ${t.name}</strong>
          <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${t.desc}</div>
        </div>
      `).join('');

    } else if (tab === 'RELIC') {
      const relics = Object.values(RelicDB).sort((a, b) => a.id.localeCompare(b.id));
      countEl.textContent = `유물 목록 (${relics.length}종)`;
      html = relics.map(r => `
        <div class="codex-item" style="border-left: 3px solid var(--fx-yellow);">
          <strong style="color:var(--fx-yellow); font-size:13px;">🏺 [${r.id}] ${r.name}</strong>
          <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${r.desc}</div>
        </div>
      `).join('');

    } else if (tab === 'ENEMY') {
      const enemies = Object.values(EnemyDB);
      countEl.textContent = `개체 도감 (${enemies.length}종)`;
      html = enemies.map(e => {
        const meta = EnemyMeta[e.id] || { type: '개체', desc: '정보 없음' };
        const borderCol = e.isDreamBoss
          ? 'var(--fx-yellow)'
          : (e.isBoss ? 'var(--fx-red)' : (e.isElite ? 'var(--fx-purple)' : 'var(--border)'));
        const hpLabel = e.isDreamBoss ? `고정 HP ${e.maxHp}` : `기본 HP ${e.maxHp}`;
        return `
          <div class="codex-item" style="border-left: 3px solid ${borderCol};">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color:var(--text-main); font-size:13px;">👾 ${e.name}</strong>
              <span style="font-size:10.5px; color:var(--fx-yellow); font-weight:bold;">${meta.type} · ${hpLabel}</span>
            </div>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4; margin-top:2px;">${meta.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'RULE') {
      countEl.textContent = '기본 진행 가이드';
      const rules = [
        { title: '🌙 기사도 (모험의 목표)', desc: '토끼기사의 끝없는 꿈속 여정을 한 층씩 오르며 앞을 막는 적들을 쓰러뜨립니다.' },
        { title: '🃏 시작 덱 구성 (총 12장)', desc: '기본 9장(연속 때리기 3, 얼음방패 3, 출혈 1, 토끼의 투지 1, 용자의 행운 1)에 출발 전 직접 고른 카드 3장을 더해 여정을 시작합니다. 카드는 최소 9장~최대 21장까지 보유할 수 있습니다.' },
        { title: '🔄 매 턴 카드 뽑기와 버리기', desc: '내 턴이 시작될 때마다 카드를 3장 뽑습니다. 턴을 마칠 때 쓰지 않고 손에 남긴 카드는 모두 버려집니다.' },
        { title: '💚 활력 (초록색 보석)', desc: '체력바 옆의 초록색 보석은 카드를 쓰는 힘입니다. 매 턴 3개씩 차오르며, 카드 오른쪽 위 숫자만큼 소모합니다. 쓰지 않은 활력은 최대 1개까지 다음 턴으로 넘어갑니다.' },
        { title: '🎁 전투 승리 보상', desc: '전투에서 이기면 새로운 카드 1장을 얻습니다. 강력한 엘리트를 이기면 유물을, 10층마다 등장하는 보스를 이기면 유물과 특성을 추가로 얻습니다.' },
        { title: '⭐ 몽중몽 (기사도 51층 이후)', desc: '모든 노드가 항상 해금되며 무한히 층을 오르고 별빛 보스를 쓰러뜨릴 수 있습니다.' },
      ];

      html = rules.map(r => `
        <div class="codex-item" style="border-left: 3px solid var(--accent);">
          <strong style="color:var(--fx-yellow); font-size:13px;">${r.title}</strong>
          <div style="font-size:12px; color:var(--text-main); line-height:1.5; margin-top:2px;">${r.desc}</div>
        </div>
      `).join('');
    }

    listEl.innerHTML = html;
    listEl.scrollTop = 0;
  },

  // 패치노트 화면 열기 및 버전 번호 기준 최신순 정렬 렌더링
  openPatchNotes() {
    this.go('screen-patch');
    this.renderPatchNotes();
  },

  renderPatchNotes() {
    const parseVersion = (v) => {
      const raw = String(v || '').trim();
      const isAlpha = raw.startsWith('알파');
      const s = raw.replace(/^알파\s*/i, '').replace(/^v/i, '');
      const num = (!s.includes('.') && s.startsWith('0') && s.length > 1)
        ? (parseFloat('0.' + s.slice(1)) || 0)
        : (parseFloat(s) || 0);
      return isAlpha ? -100 + num : num; // 알파 버전은 항상 본편(v0.01) 아래에 정렬
    };

    const sorted = [...PatchNotesDB].sort((a, b) => parseVersion(b.version) - parseVersion(a.version));
    document.getElementById('patch-count-info').textContent = `업데이트 기록 (${sorted.length}건 · 최신순)`;

    const listEl = document.getElementById('patch-list');
    listEl.innerHTML = sorted.map((p, idx) => {
      const isLatest = idx === 0;
      const descHtml = p.desc
        ? `<div style="font-size:11.5px; color:#a9b1d6; line-height:1.45; margin-top:4px;">${p.desc}</div>`
        : '';
      return `
        <div class="codex-item" style="border-left: 3px solid ${isLatest ? 'var(--fx-green)' : 'var(--accent)'};">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <strong style="color:${isLatest ? 'var(--fx-green)' : 'var(--fx-yellow)'}; font-size:13px;">${p.version}</strong>
            ${isLatest ? '<span style="font-size:10px; color:var(--fx-green); border:1px solid var(--fx-green); border-radius:3px; padding:1px 5px;">LATEST</span>' : ''}
          </div>
          <div style="font-size:12.5px; font-weight:bold; color:var(--text-main); margin-top:2px;">${p.title}</div>
          ${descHtml}
        </div>
      `;
    }).join('');
    listEl.scrollTop = 0;
  },

  // 세이브 텍스트창 갱신 및 로비 화면의 스토리/이어하기 버튼 상태 동기화
  refreshSaveTextarea() {
    document.getElementById('save-textarea').value = SaveLedger.exportText();
    this.renderLobbyLists();
  },

  handleSaveImport() {
    SaveLedger.importText(document.getElementById('save-textarea').value);
    RogueManager.loadFromSaveLedger();
    this.refreshSaveTextarea();
    this.openInfo('💾 기록 적용 완료', '입력된 세이브 기록이 성공적으로 반영되었습니다.');
  },

  copySaveText() {
    const val = document.getElementById('save-textarea').value;
    navigator.clipboard?.writeText(val);
    this.openInfo('📋 복사 완료', '세이브 텍스트가 클립보드에 복사되었습니다.');
  },

  renderLobbyLists() {
    const listEl = document.getElementById('story-chapter-list');
    listEl.innerHTML = StoryDB.map(ch => {
      const isCleared = SaveLedger.get(ch.saveClearKey) === true;
      return `
        <button class="list-btn" onclick="StorySequencer.startChapter('${ch.id}')">
          <span>${ch.title}</span>
          <span style="color:${isCleared ? 'var(--fx-green)' : 'var(--accent)'}; font-size:11px;">${isCleared ? 'CLEAR' : '진입 가능'}</span>
        </button>
      `;
    }).join('');

    RogueManager.loadFromSaveLedger();
    const continueBtn = document.getElementById('btn-rogue-continue');
    const subEl = document.getElementById('start-subtitle');
    const maxFloor = RogueManager.getMaxFloor();

    if (RogueManager.state.active) {
      continueBtn.classList.remove('hidden');
      if (RogueManager.isDreamMode()) {
        continueBtn.textContent = `🌙 몽중몽 이어하기 (${RogueManager.state.floor}층 · ⭐${RogueManager.state.dreamStars})`;
        subEl.innerHTML = `진행 중 몽중몽: <b>${RogueManager.state.floor}층 (⭐${RogueManager.state.dreamStars})</b> (HP ${RogueManager.state.hp}/${RogueManager.state.maxHp} | 덱 ${RogueManager.state.deck.length}장)`;
      } else {
        continueBtn.textContent = `⚔️ 기사도 이어하기 (${RogueManager.state.floor}층)`;
        subEl.innerHTML = `진행 중 세이브: <b>${RogueManager.state.floor}층</b> (HP ${RogueManager.state.hp}/${RogueManager.state.maxHp} | 덱 ${RogueManager.state.deck.length}장)`;
      }
    } else {
      continueBtn.classList.add('hidden');
      subEl.innerHTML = `v1.15 | 기사도 ${maxFloor}층 + 몽중몽 별빛 ${DREAM_BOSS_ORDER.length}개`;
    }
  },

  // ==========================================================================
  // [C] 로그라이크 전투 진입 · 범용 선택지 화면 · 스토리 대사 UI 브릿지
  // ==========================================================================

  enterRogueCombatView() {
    this.mode = 'ROGUE_COMBAT';
    this.selectedCardIdx = null;
    this.hideCombatVnOverlay();
    this.clearLogs();
    this.go('screen-combat');
    this.renderStageActors();
  },

  // 범용 선택 화면(#screen-choice)에 제목, 부제, 선택 카드 목록을 동적 생성
  setChoiceScreen(headerTitle, subtitle, items) {
    document.getElementById('choice-header-title').textContent = headerTitle;
    document.getElementById('choice-subtitle').textContent = subtitle;
    const listEl = document.getElementById('choice-list');
    listEl.innerHTML = '';

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'list-btn';
      div.style.cssText = `
        background: var(--bg-card);
        border: 1.5px solid ${item.borderColor || 'var(--border)'};
        border-radius: 6px;
        cursor: ${item.disabled ? 'not-allowed' : 'pointer'};
        opacity: ${item.disabled ? '0.4' : '1'};
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      `;
      div.innerHTML = `
        <strong style="color:${item.borderColor || 'var(--text-main)'}; font-size:13.5px;">${item.title}</strong>
        <span style="font-size:11.5px; color:var(--text-sub); line-height:1.35;">${item.desc}</span>
      `;
      if (!item.disabled && item.onClick) div.onclick = (e) => item.onClick(e, div);
      listEl.appendChild(div);
    });
  },

  // 스토리 대사 출력 (전투 전이면 #screen-vn 대사창, 전투 진입 후면 #combat-vn-overlay에 출력)
  showStoryText(speaker, text, inCombat) {
    if (inCombat) {
      const ov = document.getElementById('combat-vn-overlay');
      ov.classList.remove('hidden');
      document.getElementById('combat-vn-speaker').textContent = speaker;
      document.getElementById('combat-vn-text').textContent = text;
    } else {
      document.getElementById('vn-speaker').textContent = speaker;
      document.getElementById('vn-text').textContent = text;
      document.getElementById('vn-choices').classList.add('hidden');
      document.getElementById('vn-next-hint').classList.remove('hidden');
    }
  },

  hideCombatVnOverlay() {
    document.getElementById('combat-vn-overlay').classList.add('hidden');
  },

  // 스토리 분기 선택지 버튼 생성
  showStoryChoices(speaker, text, options, onSelect) {
    document.getElementById('vn-speaker').textContent = speaker;
    document.getElementById('vn-text').textContent = text;
    document.getElementById('vn-next-hint').classList.add('hidden');
    const choicesEl = document.getElementById('vn-choices');
    choicesEl.classList.remove('hidden');
    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'vn-choice-btn';
      btn.textContent = opt.label;
      btn.onclick = () => onSelect(opt);
      choicesEl.appendChild(btn);
    });
  },

  // ==========================================================================
  // [D] 순차 로그 재생 큐 (스냅샷 캡처 · 1줄씩 터치 진행 · 스킵 처리)
  // ==========================================================================

  // 현재 시점의 양측 HP·방어도·활력·상태이상·손패를 깊은 복사(Snapshot)하여 보관
  captureStateSnapshot() {
    const cloneActor = (ent) => ({
      name: ent.name,
      hp: ent.hp,
      maxHp: ent.maxHp,
      armor: ent.armor,
      energy: ent.energy,
      maxEnergy: ent.maxEnergy,
      enemyId: ent.enemyId,
      tierDamageBonus: ent.tierDamageBonus || 0,
      deckCount: ent.deck.length,
      graveCount: ent.graveyard.length,
      hitTakenCount: ent.runTrackers.hitTakenCount,
      statuses: ent.statuses.map(s => ({ ...s })),
      hand: ent.hand.map(c => ({
        ...c,
        effCost: this.engine.getEffectiveCost(ent, c),
        effHits: this.engine.getEffectiveHits(ent, c)
      }))
    });
    return {
      turn: this.engine.turn,
      combatEnded: this.engine.combatEnded,
      player: cloneActor(this.engine.player),
      enemy: cloneActor(this.engine.enemy)
    };
  },

  // 엔진에서 로그 1줄이 생성될 때 호출: 시각 연출 + 스냅샷을 하나의 스텝으로 묶어 큐에 적재
  enqueueLogStep(msg, cls = '') {
    const step = {
      msg,
      cls,
      fxList: [...this.pendingFxList],
      floatingTextList: [...this.pendingFloatingTexts],
      snapshot: this.captureStateSnapshot()
    };
    this.pendingFxList = [];
    this.pendingFloatingTexts = [];

    const combatScreen = document.getElementById('screen-combat');
    const isCombatVisible = combatScreen && combatScreen.classList.contains('active');
    if (this.logViewMode === 'FULL' || !isCombatVisible) {
      this.applyPresentationStep(step);
      this.checkPostQueueActions();
      return;
    }

    this.presentationQueue.push(step);
    // 첫 번째 로그라면 즉시 화면에 첫 프레임을 띄우고, 빠른진행이 켜져 있으면 0.3초 뒤 자동 진행 예약
    if (this.presentationQueue.length === 1) {
      this.applyPresentationStep(this.presentationQueue[0]);
      if (this.autoLogPlay) {
        this.scheduleAutoLogStep();
      }
    }
    this.updateLogStepUI();
  },

  // 유저가 화면을 터치하거나 0.3초 타이머가 만료되었을 때 다음 로그 스텝 재생
  advanceLogStep() {
    this.clearAutoLogTimer();
    if (this.presentationQueue.length === 0) return;

    this.presentationQueue.shift();

    if (this.presentationQueue.length > 0) {
      this.applyPresentationStep(this.presentationQueue[0]);
      this.updateLogStepUI();
      if (this.autoLogPlay) {
        this.scheduleAutoLogStep();
      }
    } else {
      // 큐의 모든 로그를 다 읽었으면 최신 상태로 동기화하고 예약된 후속 작업(승/패 이동 등) 실행
      this.updateLogStepUI();
      this.renderStageActors();
      this.checkPostQueueActions();
    }
  },

  // [스킵 ⏭️] 버튼 클릭 시 남은 로그를 한꺼번에 전체 로그창에 밀어 넣고 즉시 최신 상태 표시
  flushAllLogs() {
    this.clearAutoLogTimer();
    while (this.presentationQueue.length > 0) {
      const step = this.presentationQueue.shift();
      this.appendDomLog(step.msg, step.cls);
    }
    this.updateLogStepUI();
    this.renderStageActors();
    this.checkPostQueueActions();
  },

  // 단일 로그 스텝의 텍스트 기록, 5색 박스 연출, 플로팅 텍스트, 스냅샷 HUD 렌더링을 일괄 적용
  applyPresentationStep(step) {
    this.appendDomLog(step.msg, step.cls);
    step.fxList.forEach(fx => this.triggerFX(fx.boxId, fx.fxClass));
    if (step.floatingTextList) {
      step.floatingTextList.forEach(ft => this.createFloatingText(ft.boxId, ft.text, ft.colorClass));
    }
    this.renderStageActors(step.snapshot, step);
  },

  updateLogStepUI() {
    this.renderStageActors(this.presentationQueue[0]?.snapshot || null, this.presentationQueue[0] || null);
  },

  // 전투 종료 화면 전환 등 "쌓인 로그를 유저가 다 읽은 뒤에 실행해야 할 콜백"을 등록
  runAfterLogs(callback) {
    if (this.presentationQueue.length === 0) {
      callback();
    } else {
      this.postQueueActions.push(callback);
      this.updateLogStepUI();
    }
  },

  checkPostQueueActions() {
    while (this.presentationQueue.length === 0 && this.postQueueActions.length > 0) {
      const fn = this.postQueueActions.shift();
      fn();
    }
  },

  clearLogs() {
    this.clearAutoLogTimer();
    this.presentationQueue = [];
    this.pendingFxList = [];
    this.pendingFloatingTexts = [];
    this.postQueueActions = [];
    document.getElementById('log-box').innerHTML = '';
    this.updateLogStepUI();
  },

  // ==========================================================================
  // [E] 시각 연출 · 2단계 카드 조작 · 전투 HUD 전체 렌더링
  // ==========================================================================

  // 초상화 박스(#box-player / #box-enemy)에 5색 테두리 점멸·흔들림 클래스 부여 후 0.38초 뒤 해제
  triggerFX(targetId, fxClass) {
    const el = document.getElementById(targetId);
    if (!el) return;
    el.classList.remove('fx-red', 'fx-green', 'fx-purple', 'fx-blue', 'fx-yellow');
    void el.offsetWidth; // 동일 이펙트 연속 발동 시 CSS 애니메이션 재시작 트릭
    el.classList.add(fxClass);
    setTimeout(() => el.classList.remove(fxClass), 380);
  },

  // 초상화 박스 내부 무작위 좌표에서 데미지/회복/상태이상 글씨를 띄우고 0.8초 뒤 DOM에서 제거
  createFloatingText(boxId, text, colorClass) {
    const box = document.getElementById(boxId);
    if (!box || !box.parentElement) return;

    const stageRow = box.parentElement;
    const ft = document.createElement('div');
    ft.className = `fct-text ${colorClass}`;
    ft.textContent = text;

    const rx = box.offsetLeft + box.offsetWidth * (Math.random() * 0.4 + 0.3);
    const ry = box.offsetTop + box.offsetHeight * (Math.random() * 0.2 + 0.4);

    ft.style.left = `${rx}px`;
    ft.style.top = `${ry}px`;

    stageRow.appendChild(ft);
    setTimeout(() => { if (ft.parentElement) ft.remove(); }, 800);
  },

  // 숨김 컨테이너(#log-box)에 지나간 로그 한 줄씩 누적 ([전체 로그] 팝업용)
  appendDomLog(msg, cls = '') {
    const box = document.getElementById('log-box');
    if (!box) return;
    const div = document.createElement('div');
    div.className = cls;
    div.style.marginBottom = '4px';
    div.textContent = `▶ ${msg}`;
    box.appendChild(div);
  },

  // 1단계 카드 조작: 손패 카드를 터치해 선택/선택 해제 (로그 재생 중이면 로그 진행 우선)
  selectCard(idx) {
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
      return;
    }
    this.selectedCardIdx = (this.selectedCardIdx === idx) ? null : idx;
    this.renderStageActors();
  },

  // 2단계 카드 조작: 중앙에 나타난 [카드 실행] 버튼을 눌러 실제 엔진에 카드 사용 요청
  executeSelectedCard() {
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
      return;
    }
    if (this.selectedCardIdx === null) return;
    const idx = this.selectedCardIdx;
    this.selectedCardIdx = null;
    this.engine.playCardFromHand(idx);
  },

  // 우측 [턴 종료] 버튼 클릭 처리
  onClickEndTurn() {
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
      return;
    }
    if (this.mode !== 'ROGUE_COMBAT' || this.engine.combatEnded) return;
    this.selectedCardIdx = null;
    this.engine.endPlayerTurn();
  },

  /**
   * [전투 화면 전체 HUD 갱신 함수]
   * - snapshot이 전달되면 해당 스냅샷 시점의 상태를, 없으면 현재 최신 엔진 상태를 기준으로 그림
   * - 1) 좌측 플레이어 박스 -> 2) 우측 적 박스 -> 3) 중상단 보라색 배너(로그 or 적 행동 예고)
   *   -> 4) 중간 버튼 줄(카드 실행 버튼 표시 여부) -> 5) 하단 가로 스크롤 손패 카드 순으로 렌더링
   */
  renderStageActors(snapshot = null, activeStep = null) {
    const state = snapshot || this.captureStateSnapshot();
    const p = state.player;
    const e = state.enemy;
    const isQueueLocked = this.presentationQueue.length > 0;
    const currentStep = activeStep || this.presentationQueue[0] || null;

    // 상태이상 배지 HTML 생성 헬퍼
    const renderStatusTags = (ent) => {
      if (!ent.statuses.length) return `<span style="font-size:9.5px; color:#414868;">상태 없음</span>`;
      return ent.statuses.map(s => {
        const def = StatusDB[s.id];
        const meta = StatusMeta[s.id] || { icon: '📌' };
        const cls = def.category === 'BUFF' ? 'buff' : (def.category === 'DEBUFF' ? 'debuff' : 'context');
        const acc = s.accumulated ? `(${s.accumulated})` : '';
        return `<span class="s-tag ${cls}" onclick="AppUI.openStatusInfo('${s.id}', ${s.stacks}, ${s.accumulated || 0})">${meta.icon}${def.name} ${s.stacks}${acc}</span>`;
      }).join('');
    };

    // 1. 좌측: 플레이어 초상화, HP/방어도 게이지, 활력 보석, 상태이상 슬롯 갱신
    const pSpriteUrl = SpriteMap[p.name];
    const pSpriteEl = document.getElementById('sprite-player');
    if (pSpriteUrl) {
      pSpriteEl.style.backgroundImage = `url('${pSpriteUrl}')`;
      pSpriteEl.innerHTML = '';
    } else {
      pSpriteEl.style.backgroundImage = 'none';
      pSpriteEl.innerHTML = `[내 도트]<br>${p.name}`;
    }
    document.getElementById('player-name-label').textContent = p.name;
    const pPct = p.maxHp > 0 ? Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100)) : 0;
    const pArmorPct = p.maxHp > 0 ? Math.max(0, Math.min(100, (p.armor / p.maxHp) * 100)) : 0;
    document.getElementById('player-hp-fill').style.width = `${pPct}%`;
    document.getElementById('player-armor-fill').style.width = `${pArmorPct}%`;
    document.getElementById('player-hp-text').textContent = `${p.hp} / ${p.maxHp}`;
    document.getElementById('player-status-list').innerHTML = renderStatusTags(p);

    const gemsEl = document.getElementById('player-ap-gems');
    gemsEl.innerHTML = Array.from({ length: p.maxEnergy }, (_, i) =>
      `<div class="ap-gem ${i < p.energy ? 'on' : ''}"></div>`
    ).join('');

    // 2. 우측: 적 초상화, 층수 표기, HP/방어도 게이지, 상태이상 슬롯 갱신
    const floorTag = this.mode === 'ROGUE_COMBAT' ? ` (${RogueManager.state.floor}F)` : '';
    const eSpriteUrl = SpriteMap[e.name];
    const eSpriteEl = document.getElementById('sprite-enemy');
    if (eSpriteUrl) {
      eSpriteEl.style.backgroundImage = `url('${eSpriteUrl}')`;
      eSpriteEl.innerHTML = '';
    } else {
      eSpriteEl.style.backgroundImage = 'none';
      eSpriteEl.innerHTML = `[적 도트]<br>${e.name}`;
    }
    document.getElementById('enemy-name-label').textContent = `${e.name}${floorTag}`;
    const ePct = e.maxHp > 0 ? Math.max(0, Math.min(100, (e.hp / e.maxHp) * 100)) : 0;
    const eArmorPct = e.maxHp > 0 ? Math.max(0, Math.min(100, (e.armor / e.maxHp) * 100)) : 0;
    document.getElementById('enemy-hp-fill').style.width = `${ePct}%`;
    document.getElementById('enemy-armor-fill').style.width = `${eArmorPct}%`;
    document.getElementById('enemy-hp-text').textContent = `${e.hp} / ${e.maxHp}`;
    document.getElementById('enemy-status-list').innerHTML = renderStatusTags(e);

    // 3. 중상단 보라색 통합 박스: 로그 재생 대기 중이면 1줄 로그 출력, 평소에는 적 다음 행동 예고 출력
    document.getElementById('deck-grave-Summary').textContent = `덱${p.deckCount}/묘${p.graveCount}`;
    const purpleBox = document.getElementById('purple-box');
    const headerLabel = document.getElementById('purple-header-label');
    const mainDisplay = document.getElementById('purple-main-display');
    const countEl = document.getElementById('log-step-counter');
    const hintEl = document.getElementById('log-step-hint');
    const skipBtn = document.getElementById('btn-skip-logs');

    if (isQueueLocked && currentStep) {
      const remaining = Math.max(0, this.presentationQueue.length - 1);
      const hasPendingAction = this.postQueueActions.length > 0;
      purpleBox.classList.add('waiting-log');
      if (remaining > 0) skipBtn.classList.remove('hidden');
      else skipBtn.classList.add('hidden');

      headerLabel.style.color = 'var(--fx-yellow)';
      headerLabel.textContent = `⚡ 전투 로그 진행 중`;
      mainDisplay.className = `purple-main-text ${currentStep.cls}`;
      mainDisplay.style.color = '';
      mainDisplay.textContent = `▶ ${currentStep.msg}`;
      countEl.textContent = remaining > 0 ? `남은 로그: +${remaining}줄` : `마지막 로그`;
      hintEl.style.color = 'var(--fx-yellow)';
      if (hasPendingAction && remaining === 0) {
        hintEl.textContent = '터치하여 결과 이동 ▶';
      } else {
        hintEl.textContent = this.autoLogPlay ? '⏩ 빠른 진행 중 (0.3초)...' : '화면 터치하여 다음 줄 ▶';
      }
    } else {
      purpleBox.classList.remove('waiting-log');
      skipBtn.classList.add('hidden');
      headerLabel.style.color = 'var(--fx-purple)';
      countEl.textContent = `${state.turn}턴 진행 중`;
      hintEl.style.color = 'var(--text-sub)';
      hintEl.textContent = '아래 카드를 선택하세요';

      if (this.mode === 'ROGUE_COMBAT' && e.enemyId && EnemyDB[e.enemyId] && e.hp > 0) {
        const resolved = this.engine.resolveEnemyAction(state.turn, this.engine.enemy, this.engine.player);
        if (resolved) {
          const act = resolved.action;
          let intentText = act.intent;
          // 10층 단위 티어 공격력 보너스(+3씩)를 예고창 텍스트 숫자에도 실시간 합산 표기
          if (e.tierDamageBonus > 0 && intentText.includes('물리')) {
            intentText = intentText.replace(/물리\s*(\d+)/g, (_, num) => `물리 ${Number(num) + e.tierDamageBonus}`);
          }

          if (resolved.blocker && !resolved.isFallback) {
            headerLabel.textContent = `🚫 적 행동 봉인됨 [${resolved.blocker.def.name}]`;
            mainDisplay.className = 'purple-main-text';
            mainDisplay.style.color = 'var(--text-sub)';
            mainDisplay.textContent = `(취소됨) ${act.name} — ${intentText}`;
          } else if (resolved.isFallback && resolved.blocker) {
            headerLabel.textContent = `💢 [${resolved.blocker.def.name}] 대체 행동 [${act.name}]`;
            mainDisplay.className = 'purple-main-text';
            mainDisplay.style.color = 'var(--fx-yellow)';
            mainDisplay.textContent = intentText;
          } else {
            headerLabel.textContent = `👾 적 다음 행동 예고 [${act.name}]`;
            mainDisplay.className = 'purple-main-text';
            mainDisplay.style.color = 'var(--fx-yellow)';
            mainDisplay.textContent = intentText;
          }
        }
      } else if (this.mode === 'STORY') {
        headerLabel.textContent = `📖 스토리 전투 안내`;
        mainDisplay.className = 'purple-main-text';
        mainDisplay.style.color = 'var(--text-main)';
        mainDisplay.textContent = p.hand.length > 0 ? `손패의 [${p.hand[0].name}] 카드를 선택해 실행하세요.` : `대사를 진행하세요.`;
      }
    }

    // 4. 중간 컨트롤 바: 카드가 선택되었을 때만 중앙에 실행 버튼 표시 및 활력/봉인 여부 판정
    const execBtn = document.getElementById('btn-exec-card');
    const endTurnBtn = document.getElementById('btn-end-turn');
    endTurnBtn.disabled = isQueueLocked || (this.mode !== 'ROGUE_COMBAT' || state.combatEnded);

    const canInteract = !isQueueLocked && ((this.mode === 'ROGUE_COMBAT' && !state.combatEnded) || (this.mode === 'STORY' && StorySequencer.state === 'WAIT_CARD'));
    if (this.selectedCardIdx !== null && !p.hand[this.selectedCardIdx]) {
      this.selectedCardIdx = null;
    }

    if (canInteract && this.selectedCardIdx !== null && this.engine.player.hand[this.selectedCardIdx]) {
      const selCard = this.engine.player.hand[this.selectedCardIdx];
      const cost = this.engine.getEffectiveCost(this.engine.player, selCard);
      const blocked = this.engine.player.getPassives().some(({ def, inst }) => def.canPlayCard && !def.canPlayCard(selCard, this.engine, this.engine.player, inst));

      execBtn.classList.remove('hidden');
      if (blocked) {
        execBtn.disabled = true;
        execBtn.textContent = `🚫 사용 불가 (난투 등)`;
      } else if (p.energy < cost) {
        execBtn.disabled = true;
        execBtn.textContent = `⚡ 활력 부족 (필요 ${cost})`;
      } else {
        execBtn.disabled = false;
        execBtn.textContent = `▶ [${selCard.name}] 실행`;
      }
    } else {
      execBtn.classList.add('hidden');
    }

    // 5. 하단 손패 영역: 가로 스크롤 카드 렌더링 ([013 복수]는 현재 누적 피격 데미지를 실시간 계산하여 표시)
    const gridEl = document.getElementById('hand-grid');
    const isStory1_1 = (this.mode === 'STORY' && StorySequencer.activeChapter?.id === 'stage_1_1');
    const isStory1_2 = (this.mode === 'STORY' && StorySequencer.activeChapter?.id === 'stage_1_2');
    gridEl.innerHTML = p.hand.map((card, idx) => {
      const isSelected = !isQueueLocked && this.selectedCardIdx === idx;
      const revMult = isStory1_1 ? 8 : 1;
      let baseDesc = (card.id === '013' && isStory1_1) ? card.desc.replace('1 x', '8 x') : card.desc;
      if (card.id === '040' && isStory1_2) baseDesc = '타수 1, 물리 0, 모두의 버프/디버프 제거. (스토리 전용: 겁먹은 아이를 해치지 않습니다)';
      const dynamicDesc = card.id === '013'
        ? `${baseDesc} <span style="color:var(--fx-yellow);">[현재: ${p.hitTakenCount * revMult} 피해]</span>`
        : baseDesc;
      return `
        <div class="hand-card ${isSelected ? 'selected' : ''}" style="${isQueueLocked ? 'opacity:0.55;' : ''}" onclick="AppUI.selectCard(${idx})">
          <div class="c-cost">${card.effCost}</div>
          <div class="c-name">${card.name}</div>
          <div class="c-type">${card.type}${card.effHits > 0 ? `(${card.effHits}타)` : ''}</div>
          <div class="c-desc">${dynamicDesc}</div>
        </div>
      `;
    }).join('');
  }
};

// ============================================================================
// [9] 앱 부팅 (AppUI 초기화, 에셋 백그라운드 프리로딩, 전역 에러 알림)
// ============================================================================
AppUI.init();

// SpriteMap에 등록된 모든 캐릭터 이미지를 백그라운드에서 미리 로드하여 전투 진입 시 깜빡임 방지
Object.values(new Set(Object.values(SpriteMap))).forEach(src => {
  if (!src) return;
  const img = new Image();
  img.src = src;
});

// 모바일/로컬 테스트 중 런타임 자바스크립트 오류가 발생했을 때 줄 번호를 즉시 팝업으로 알림
window.onerror = (msg, src, line) => {
  alert(`오류 발생 (${line}줄): ${msg}`);
};
</script>
</body>
</html>
