  pendingFloatingTexts: [], // 👇 추가됨
  postQueueActions: [], // 승리/패배 화면 전환 등 로그를 다 읽은 후 실행할 콜백

  init() {
    this.engine = new CombatEngine();
    // 5색 이펙트가 발생하면 바로 터뜨리지 않고 현재 로그 프레임에 묶어둠
    this.engine.onFxCallback = (boxId, fxClass) => {
      this.pendingFxList.push({ boxId, fxClass });
    };

    this.engine.onFloatingTextCallback = (boxId, text, colorClass) => {
      this.pendingFloatingTexts.push({ boxId, text, colorClass });
    };

    // 로그가 1줄 발생할 때마다 현재 캐릭터 상태 스냅샷과 함께 큐에 적재
    this.engine.onLogCallback = (msg, cls) => {
      this.enqueueLogStep(msg, cls);
    };
    // 큐가 비어있을 때만 즉시 렌더링, 큐가 돌고 있으면 스냅샷이 렌더링을 담당
    this.engine.onRenderCallback = () => {
      if (this.presentationQueue.length === 0) {
        this.renderStageActors();
      }
    };

    StorySequencer.init(this.engine);
    this.refreshSaveTextarea();

    // 메인 로고 이미지 적용
    const logoUrl = SpriteMap['메인 로고'];
    const logoSlot = document.getElementById('main-logo-slot');
    if (logoSlot && logoUrl) {
      logoSlot.style.backgroundImage = `url('${logoUrl}')`;
      logoSlot.innerHTML = ''; // 텍스트 숨김
    }
  },

  toggleBgm() {
    const audio = document.getElementById('bgm-audio');
    const btn = document.getElementById('btn-bgm-toggle');
    if (!audio || !btn) return;

    if (audio.paused) {
      audio.play().then(() => {
        btn.textContent = '🔊 BGM: ON';
        btn.style.borderColor = 'var(--fx-green)';
        btn.style.color = 'var(--fx-green)';
      }).catch(() => {
        this.openInfo('🔇 재생 실패', '<code>rabbitknight.mp3</code> 파일을 찾을 수 없거나 브라우저에서 차단되었습니다.');
      });
    } else {
      audio.pause();
      btn.textContent = '🔇 BGM: OFF';
      btn.style.borderColor = 'var(--border)';
      btn.style.color = 'var(--text-main)';
    }
  },

  handleCombatScreenClick(event) {
    // 1. 메뉴, 턴 종료, 스킵 버튼이나 버프/디버프 배지(.s-tag)를 직접 누른 경우엔 진행 차단
    if (event.target.closest('button, .s-tag')) return;

    // 2. 스토리 모드 전투 중 대사 오버레이가 떠 있으면 대사 진행
    const vnOverlay = document.getElementById('combat-vn-overlay');
    if (vnOverlay && !vnOverlay.classList.contains('hidden')) {
      StorySequencer.onUserClickDialogue();
      return;
    }

    // 3. 대기 중인 1줄 로그가 남아있으면 다음 줄 진행
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
    }
  },

  go(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
    if (screenId === 'screen-start' || screenId === 'screen-save' || screenId === 'screen-story-list') {
      this.refreshSaveTextarea();
    }
  },

  toggleModal(id, show) {
    document.getElementById(id).classList.toggle('open', show);
  },

  openInfo(title, descHtml) {
    document.getElementById('info-title').textContent = title;
    document.getElementById('info-desc').innerHTML = descHtml;
    this.toggleModal('modal-info', true);
  },

  openStatusInfo(statusId, stacks, accumulated) {
    const def = StatusDB[statusId];
    const meta = StatusMeta[statusId] || { icon: '📌', desc: '상태 효과' };
    const accText = accumulated > 0 ? `<br><br><span style="color:var(--fx-yellow);">현재 누적 수치: ${accumulated}</span>` : '';
    this.openInfo(`${meta.icon} ${def.name} (스택: ${stacks})`, `${meta.desc}${accText}`);
  },

  // 보라색 박스의 [전체 로그] 버튼을 눌렀을 때 지나간 로그 전체를 팝업으로 표시
  openFullLogModal() {
    const logHtml = document.getElementById('log-box').innerHTML;
    this.openInfo('📜 전투 로그 기록', logHtml || '<div style="color:var(--text-sub);">기록된 로그가 없습니다.</div>');
  },

  // 전술 메뉴 모달 열기 (특성/유물 터치 시 설명 팝업 + 덱/무덤 카드 목록 확인)
  openTacticalMenu() {
    const isRogue = (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB');
    const floorText = isRogue ? `${RogueManager.state.floor}층 (상한 ${RogueManager.getMaxFloor()}층)` : '스토리 스테이지';
    const hitCount = this.mode === 'ROGUE_HUB' ? RogueManager.state.hitTakenCount : this.engine.player.runTrackers.hitTakenCount;

    const traitIds = isRogue ? RogueManager.state.traits : this.engine.player.traits.map(t => t.id);
    const relicIds = isRogue ? RogueManager.state.relics : this.engine.player.relics.map(r => r.id);

    const traitTags = traitIds.map(tid => {
      const t = TraitDB[tid];
      return `<span class="s-tag buff" onclick="AppUI.openInfo('🧬 특성: ${t.name}', '${t.desc}')">🧬 ${t.name}</span>`;
    }).join(' ') || '<span style="color:var(--text-sub);">없음</span>';

    const relicTags = relicIds.map(rid => {
      const r = RelicDB[rid];
      return `<span class="s-tag context" onclick="AppUI.openInfo('🏺 유물: ${r.name}', '${r.desc}')">🏺 ${r.name}</span>`;
    }).join(' ') || '<span style="color:var(--text-sub);">없음</span>';

    document.getElementById('menu-status-summary').innerHTML = `
      <div>🏰 진행 위치: <b>${floorText}</b> | 💥 누적 피격: <b>${hitCount}회</b></div>
      <div style="font-size:11px; color:var(--text-sub);">※ 아래 특성이나 유물 배지를 터치하면 상세 효과가 표시됩니다.</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"><b>보유 특성:</b> ${traitTags}</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"><b>보유 유물:</b> ${relicTags}</div>
    `;

    const pileBtns = document.getElementById('menu-pile-buttons');
    if (this.mode === 'ROGUE_HUB') {
      pileBtns.innerHTML = `
        <button style="flex:1;" onclick="AppUI.openPileViewer('MASTER')">🃏 현재 마스터 덱 (${RogueManager.state.deck.length}장)</button>
      `;
    } else {
      const p = this.engine.player;
      pileBtns.innerHTML = `
        <button style="flex:1;" onclick="AppUI.openPileViewer('DECK')">덱 잔량 (${p.deck.length}장)</button>
        <button style="flex:1;" onclick="AppUI.openPileViewer('GRAVE')">무덤 (${p.graveyard.length}장)</button>
      `;
    }

    this.toggleModal('modal-menu', true);
  },

  openCodex(defaultTab = 'CARD') {
    this.go('screen-codex');
    this.renderCodex(defaultTab);
  },

  openPatchNotes() {
    this.go('screen-patch');
    this.renderPatchNotes();
  },

  renderPatchNotes() {
	    const parseVersion = (v) => {
      const raw = String(v || '').trim();
      const isAlpha = raw.startsWith('알파');
      const s = raw.replace(/^알파\s*/i, '').replace(/^v/i, '');
      const num = (!s.includes('.') && s.startsWith('0') && s.length > 1)
        ? (parseFloat('0.' + s.slice(1)) || 0)
        : (parseFloat(s) || 0);
      return isAlpha ? -100 + num : num; // 알파 버전은 항상 본편(v0.01) 아래에서 수치순 정렬
    };

    const sorted = [...PatchNotesDB].sort((a, b) => parseVersion(b.version) - parseVersion(a.version));
    document.getElementById('patch-count-info').textContent = `업데이트 기록 (${sorted.length}건 · 최신순)`;

    const listEl = document.getElementById('patch-list');
    listEl.innerHTML = sorted.map((p, idx) => {
      const isLatest = idx === 0;
      const descHtml = p.desc
        ? `<div style="font-size:11.5px; color:#a9b1d6; line-height:1.45; margin-top:4px;">${p.desc}</div>`
        : '';
      return `
        <div class="codex-item" style="border-left: 3px solid ${isLatest ? 'var(--fx-green)' : 'var(--accent)'};">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <strong style="color:${isLatest ? 'var(--fx-green)' : 'var(--fx-yellow)'}; font-size:13px;">${p.version}</strong>
            ${isLatest ? '<span style="font-size:10px; color:var(--fx-green); border:1px solid var(--fx-green); border-radius:3px; padding:1px 5px;">LATEST</span>' : ''}
          </div>
          <div style="font-size:12.5px; font-weight:bold; color:var(--text-main); margin-top:2px;">${p.title}</div>
          ${descHtml}
        </div>
      `;
    }).join('');
    listEl.scrollTop = 0;
  },
	
  renderCodex(tab) {
    // 1. 탭 활성화 하이라이트 갱신 (7종으로 확장)
    ['CARD', 'BUFF', 'DEBUFF', 'SEEKER', 'TRAIT', 'RELIC', 'ENEMY', 'RULE'].forEach(t => {
      const btn = document.getElementById(`tab-codex-${t}`);
      if (btn) btn.classList.toggle('active', t === tab);
    });

    const listEl = document.getElementById('codex-list');
    const countEl = document.getElementById('codex-count-info');
    let html = '';

    if (tab === 'CARD') {
      // (기존 카드 렌더링 유지)
      const cards = Object.values(CardDB).sort((a, b) => a.id.localeCompare(b.id));
      countEl.textContent = `전체 카드 목록 (${cards.length}종)`;
      html = cards.map(c => {
        const hitText = c.hits > 0 ? ` | 타수 ${c.hits}` : '';
        const typeColor = c.type === 'ATTACK' ? 'var(--fx-red)' : 'var(--fx-blue)';
        return `
          <div class="codex-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color:var(--fx-yellow); font-size:13px;">[${c.id}] ${c.name}</strong>
              <span style="font-size:11px; color:${typeColor}; font-weight:bold;">코스트 ${c.cost} · ${c.type}${hitText}</span>
            </div>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${c.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'BUFF' || tab === 'DEBUFF') {
      // (기존 버프/디버프 렌더링 유지)
      const isBuff = tab === 'BUFF';
      const statuses = Object.values(StatusDB)
        .filter(s => s.category === tab && !s.id.startsWith('CTX_'))
        .sort((a, b) => (a.code || '').localeCompare(b.code || ''));
      countEl.textContent = `${isBuff ? '버프' : '디버프'} 목록 (${statuses.length}종)`;
      html = statuses.map(s => {
        const meta = StatusMeta[s.id] || { icon: '📌', desc: '설명 없음' };
        const color = isBuff ? 'var(--fx-blue)' : 'var(--fx-purple)';
        return `
          <div class="codex-item" style="border-left: 3px solid ${color};">
            <strong style="color:${color}; font-size:13px;">${meta.icon} [${s.code}] ${s.name}</strong>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${meta.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'SEEKER') {
      // 👈 [추가] 의념 (CTX_로 시작하는 턴 맥락 버프들)
      const seekers = Object.values(StatusDB).filter(s => s.id.startsWith('CTX_'));
      countEl.textContent = `의념 목록 (${seekers.length}종)`;
      html = seekers.map(s => {
        const meta = StatusMeta[s.id] || { icon: '✨', desc: '설명 없음' };
        return `
          <div class="codex-item" style="border-left: 3px solid var(--fx-yellow);">
            <strong style="color:var(--fx-yellow); font-size:13px;">${meta.icon} ${s.name}</strong>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${meta.desc}</div>
          </div>
        `;
      }).join('');

    } else if (tab === 'TRAIT') {
      // (기존 특성 렌더링 유지)
      const traits = Object.values(TraitDB).sort((a, b) => a.id.localeCompare(b.id));
      countEl.textContent = `특성 목록 (${traits.length}종)`;
      html = traits.map(t => `
        <div class="codex-item" style="border-left: 3px solid var(--fx-blue);">
          <strong style="color:var(--fx-blue); font-size:13px;">🧬 [${t.id}] ${t.name}</strong>
          <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${t.desc}</div>
        </div>
      `).join('');

    } else if (tab === 'RELIC') {
      // (기존 유물 렌더링 유지)
      const relics = Object.values(RelicDB).sort((a, b) => a.id.localeCompare(b.id));
      countEl.textContent = `유물 목록 (${relics.length}종)`;
      html = relics.map(r => `
        <div class="codex-item" style="border-left: 3px solid var(--fx-yellow);">
          <strong style="color:var(--fx-yellow); font-size:13px;">🏺 [${r.id}] ${r.name}</strong>
          <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4;">${r.desc}</div>
        </div>
      `).join('');

    } else if (tab === 'ENEMY') {
      // 👈 [추가] 개체(적) 도감 렌더링
      const enemies = Object.values(EnemyDB);
      countEl.textContent = `개체 도감 (${enemies.length}종)`;
      html = enemies.map(e => {
        const meta = EnemyMeta[e.id] || { type: '개체', desc: '정보 없음' };
        const borderCol = e.isBoss ? 'var(--fx-red)' : (e.isElite ? 'var(--fx-purple)' : 'var(--border)');
        return `
          <div class="codex-item" style="border-left: 3px solid ${borderCol};">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color:var(--text-main); font-size:13px;">👾 ${e.name}</strong>
              <span style="font-size:10.5px; color:var(--fx-yellow); font-weight:bold;">${meta.type} · 기본 HP ${e.maxHp}</span>
            </div>
            <div style="font-size:11.5px; color:#a9b1d6; line-height:1.4; margin-top:2px;">${meta.desc}</div>
          </div>
        `;
      }).join('');
      
    } else if (tab === 'RULE') {  // 👈 } 를 추가하여 올바르게 닫고 분기를 연결
      countEl.textContent = '기본 진행 가이드';
      const rules = [
        {
          title: '🌙 기사도 (모험의 목표)',
          desc: '토끼기사의 끝없는 꿈속 여정을 한 층씩 오르며 앞을 막는 적들을 쓰러뜨립니다.'
        },
        {
          title: '🃏 시작 덱 구성 (총 12장)',
          desc: '기본 9장(연속 때리기 3, 얼음방패 3, 출혈 1, 토끼의 투지 1, 용자의 행운 1)에 출발 전 직접 고른 카드 3장을 더해 여정을 시작합니다. 카드는 최소 9장~최대 21장까지 보유할 수 있습니다.'
        },
        {
          title: '🔄 매 턴 카드 뽑기와 버리기',
          desc: '내 턴이 시작될 때마다 카드를 3장 뽑습니다. 턴을 마칠 때 쓰지 않고 손에 남긴 카드는 모두 버려집니다.'
        },
        {
          title: '💚 활력 (초록색 보석)',
          desc: '체력바 옆의 초록색 보석은 카드를 쓰는 힘입니다. 매 턴 3개씩 차오르며, 카드 오른쪽 위 숫자만큼 소모합니다. 쓰지 않은 활력은 최대 1개까지 다음 턴으로 넘어갑니다.'
        },
        {
          title: '🎁 전투 승리 보상',
          desc: '전투에서 이기면 새로운 카드 1장을 얻습니다. 강력한 엘리트를 이기면 유물을, 10층마다 등장하는 보스를 이기면 유물과 특성을 추가로 얻습니다.'
        }
      ];

      html = rules.map(r => `
        <div class="codex-item" style="border-left: 3px solid var(--accent);">
          <strong style="color:var(--fx-yellow); font-size:13px;">${r.title}</strong>
          <div style="font-size:12px; color:var(--text-main); line-height:1.5; margin-top:2px;">${r.desc}</div>
        </div>
      `).join('');
    }

    listEl.innerHTML = html;
    listEl.scrollTop = 0;
  },

  openPileViewer(pileType) {
    let cards = [];
    let title = '';
    if (pileType === 'MASTER') {
      title = `🃏 마스터 덱 목록 (${RogueManager.state.deck.length}장)`;
      cards = RogueManager.state.deck.map(cid => CardDB[cid]);
    } else if (pileType === 'DECK') {
      title = `🃏 남은 덱 목록 (${this.engine.player.deck.length}장 - 순서 섞임)`;
      cards = [...this.engine.player.deck].sort((a, b) => a.id.localeCompare(b.id));
    } else if (pileType === 'GRAVE') {
      title = `🪦 무덤 카드 목록 (${this.engine.player.graveyard.length}장)`;
      cards = [...this.engine.player.graveyard];
    }

    if (cards.length === 0) {
      this.openInfo(title, '<div style="color:var(--text-sub);">카드가 없습니다.</div>');
      return;
    }

    const lastGraveUid = this.engine.player.combatTrackers?.lastGraveyardCard?.uid;
    const html = cards.map(c => {
      const isLast = (pileType === 'GRAVE' && c.uid && c.uid === lastGraveUid);
      return `
        <div style="background:var(--bg-card); border:1px solid ${isLast ? 'var(--fx-yellow)' : 'var(--border)'}; border-radius:4px; padding:8px; margin-bottom:6px;">
          <div style="font-weight:bold; color:var(--fx-yellow); font-size:12px;">
            [${c.id}] ${c.name} (코스트 ${c.cost}) ${isLast ? '<span style="color:var(--fx-green);">[최근 묘지행 - 끼토산 대상]</span>' : ''}
          </div>
          <div style="font-size:11px; color:#a9b1d6; margin-top:2px;">${c.desc}</div>
        </div>
      `;
    }).join('');

    this.openInfo(title, html);
  },

  refreshSaveTextarea() {
    document.getElementById('save-textarea').value = SaveLedger.exportText();
    this.renderLobbyLists();
  },

  handleSaveImport() {
    SaveLedger.importText(document.getElementById('save-textarea').value);
    RogueManager.loadFromSaveLedger();
    this.refreshSaveTextarea();
    this.openInfo('💾 기록 적용 완료', '입력된 세이브 기록이 성공적으로 반영되었습니다.');
  },

  copySaveText() {
    const val = document.getElementById('save-textarea').value;
    navigator.clipboard?.writeText(val);
    this.openInfo('📋 복사 완료', '세이브 텍스트가 클립보드에 복사되었습니다.');
  },

  renderLobbyLists() {
    const listEl = document.getElementById('story-chapter-list');
    listEl.innerHTML = StoryDB.map(ch => {
      const isCleared = SaveLedger.get(ch.saveClearKey) === true;
      return `
        <button class="list-btn" onclick="StorySequencer.startChapter('${ch.id}')">
          <span>${ch.title}</span>
          <span style="color:${isCleared ? 'var(--fx-green)' : 'var(--accent)'}; font-size:11px;">${isCleared ? 'CLEAR' : '진입 가능'}</span>
        </button>
      `;
    }).join('');

    RogueManager.loadFromSaveLedger();
    const continueBtn = document.getElementById('btn-rogue-continue');
    const subEl = document.getElementById('start-subtitle');
    const maxFloor = RogueManager.getMaxFloor();

    if (RogueManager.state.active) {
      continueBtn.classList.remove('hidden');
      continueBtn.textContent = `⚔️ 기사도 이어하기 (${RogueManager.state.floor}층)`;
      subEl.innerHTML = `진행 중 세이브: <b>${RogueManager.state.floor}층</b> (HP ${RogueManager.state.hp}/${RogueManager.state.maxHp} | 덱 ${RogueManager.state.deck.length}장)`;
    } else {
      continueBtn.classList.add('hidden');
      subEl.innerHTML = `v1.03 | 현재 등반 가능 최고층: ${maxFloor}층`;
    }
  },

  returnToLobby() {
    StorySequencer.clearTimers();
    if (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB') {
      RogueManager.syncToSaveLedger();
    }
    this.mode = 'LOBBY';
    this.selectedCardIdx = null;
    this.go('screen-start');
  },

  enterRogueCombatView() {
    this.mode = 'ROGUE_COMBAT';
    this.selectedCardIdx = null;
    this.hideCombatVnOverlay();
    this.clearLogs();
    this.go('screen-combat');
    this.renderStageActors();
  },

  setChoiceScreen(headerTitle, subtitle, items) {
    document.getElementById('choice-header-title').textContent = headerTitle;
    document.getElementById('choice-subtitle').textContent = subtitle;
    const listEl = document.getElementById('choice-list');
    listEl.innerHTML = '';

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'list-btn';
      div.style.cssText = `
        background: var(--bg-card);
        border: 1.5px solid ${item.borderColor || 'var(--border)'};
        border-radius: 6px;
        cursor: ${item.disabled ? 'not-allowed' : 'pointer'};
        opacity: ${item.disabled ? '0.4' : '1'};
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      `;
      div.innerHTML = `
        <strong style="color:${item.borderColor || 'var(--text-main)'}; font-size:13.5px;">${item.title}</strong>
        <span style="font-size:11.5px; color:var(--text-sub); line-height:1.35;">${item.desc}</span>
      `;
	  if (!item.disabled && item.onClick) div.onclick = (e) => item.onClick(e, div);
      listEl.appendChild(div);
    });
  },

  // 스토리 비주얼 노벨 출력 (전투 전이면 #screen-vn, 전투 진입 후면 #combat-vn-overlay)
  showStoryText(speaker, text, inCombat) {
    if (inCombat) {
      const ov = document.getElementById('combat-vn-overlay');
      ov.classList.remove('hidden');
      document.getElementById('combat-vn-speaker').textContent = speaker;
      document.getElementById('combat-vn-text').textContent = text;
    } else {
      document.getElementById('vn-speaker').textContent = speaker;
      document.getElementById('vn-text').textContent = text;
      document.getElementById('vn-choices').classList.add('hidden');
      document.getElementById('vn-next-hint').classList.remove('hidden');
    }
  },

  hideCombatVnOverlay() {
    document.getElementById('combat-vn-overlay').classList.add('hidden');
  },

  showStoryChoices(speaker, text, options, onSelect) {
    document.getElementById('vn-speaker').textContent = speaker;
    document.getElementById('vn-text').textContent = text;
    document.getElementById('vn-next-hint').classList.add('hidden');
    const choicesEl = document.getElementById('vn-choices');
    choicesEl.classList.remove('hidden');
    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'vn-choice-btn';
      btn.textContent = opt.label;
      btn.onclick = () => onSelect(opt);
      choicesEl.appendChild(btn);
    });
  },

  triggerFX(targetId, fxClass) {
    const el = document.getElementById(targetId);
    if (!el) return;
    el.classList.remove('fx-red', 'fx-green', 'fx-purple', 'fx-blue', 'fx-yellow');
    void el.offsetWidth;
    el.classList.add(fxClass);
    setTimeout(() => el.classList.remove(fxClass), 380);
  },

  // 현재 플레이어/적의 체력·방어도·상태이상을 깊은 복사(Snapshot)
  captureStateSnapshot() {
    const cloneActor = (ent) => ({
      name: ent.name,
      hp: ent.hp,
      maxHp: ent.maxHp,
      armor: ent.armor,
      energy: ent.energy,
      maxEnergy: ent.maxEnergy,
      enemyId: ent.enemyId,
      tierDamageBonus: ent.tierDamageBonus || 0,
      deckCount: ent.deck.length,
      graveCount: ent.graveyard.length,
      hitTakenCount: ent.runTrackers.hitTakenCount,
      statuses: ent.statuses.map(s => ({ ...s })),
      hand: ent.hand.map(c => ({
        ...c,
        effCost: this.engine.getEffectiveCost(ent, c),
        effHits: this.engine.getEffectiveHits(ent, c)
      }))
    });
    return {
      turn: this.engine.turn,
      combatEnded: this.engine.combatEnded,
      player: cloneActor(this.engine.player),
      enemy: cloneActor(this.engine.enemy)
    };
  },

  enqueueLogStep(msg, cls = '') {
    const step = {
      msg,
      cls,
      fxList: [...this.pendingFxList],
      floatingTextList: [...this.pendingFloatingTexts], // 👇 큐에 플로팅 텍스트 묶음 장전!
      snapshot: this.captureStateSnapshot()
    };
    this.pendingFxList = [];
    this.pendingFloatingTexts = []; // 👇 비우기

    const combatScreen = document.getElementById('screen-combat');
    const isCombatVisible = combatScreen && combatScreen.classList.contains('active');
    if (this.logViewMode === 'FULL' || !isCombatVisible) {
      this.applyPresentationStep(step);
      this.checkPostQueueActions();
      return;
    }

    this.presentationQueue.push(step);
    if (this.presentationQueue.length === 1) {
      this.applyPresentationStep(this.presentationQueue[0]);
    }
    this.updateLogStepUI();
  },

  // 유저가 1줄 로그 박스를 클릭했을 때 다음 스텝 재생
  advanceLogStep() {
    if (this.presentationQueue.length === 0) return;

    // 현재 보고 있던 줄을 큐에서 제거
    this.presentationQueue.shift();

    if (this.presentationQueue.length > 0) {
      // 다음 줄 스냅샷 적용 (체력/방어도/이펙트/로그가 이 순간 변화!)
      this.applyPresentationStep(this.presentationQueue[0]);
      this.updateLogStepUI();
    } else {
      // 모든 로그를 다 읽었으면 실제 최신 엔진 상태로 동기화하고 후속 액션(승패 이동 등) 실행
      this.updateLogStepUI();
      this.renderStageActors();
      this.checkPostQueueActions();
    }
  },

  // [스킵 ⏭️] 버튼 클릭 시 밀린 로그를 한 번에 모두 출력
  flushAllLogs() {
    while (this.presentationQueue.length > 0) {
      const step = this.presentationQueue.shift();
      this.appendDomLog(step.msg, step.cls);
    }
    this.updateLogStepUI();
    this.renderStageActors();
    this.checkPostQueueActions();
  },

  // [모드: 1줄 클릭 <-> 전체/실시간] 토글
  toggleLogViewMode() {
    this.logViewMode = (this.logViewMode === 'STEP') ? 'FULL' : 'STEP';
    const btn = document.getElementById('btn-toggle-log-mode');
    const stepBox = document.getElementById('log-step-box');
    const fullBox = document.getElementById('log-box');

    if (this.logViewMode === 'FULL') {
      btn.textContent = '모드: 전체/실시간';
      stepBox.classList.add('hidden');
      fullBox.classList.remove('hidden');
      this.flushAllLogs();
    } else {
      btn.textContent = '모드: 1줄 클릭';
      stepBox.classList.remove('hidden');
      fullBox.classList.add('hidden');
      this.updateLogStepUI();
    }
  },

  applyPresentationStep(step) {
    this.appendDomLog(step.msg, step.cls);
    step.fxList.forEach(fx => this.triggerFX(fx.boxId, fx.fxClass));
    
    // 👇 로그 1줄이 화면에 풀릴 때 글씨도 같이 허공에 뿌려줌
    if (step.floatingTextList) {
      step.floatingTextList.forEach(ft => this.createFloatingText(ft.boxId, ft.text, ft.colorClass));
    }
    
    this.renderStageActors(step.snapshot, step);
  },

  updateLogStepUI() {
    this.renderStageActors(this.presentationQueue[0]?.snapshot || null, this.presentationQueue[0] || null);
  },

  runAfterLogs(callback) {
    if (this.presentationQueue.length === 0) {
      callback();
    } else {
      this.postQueueActions.push(callback);
      this.updateLogStepUI();
    }
  },

  checkPostQueueActions() {
    while (this.presentationQueue.length === 0 && this.postQueueActions.length > 0) {
      const fn = this.postQueueActions.shift();
      fn();
    }
  },

  clearLogs() {
    this.presentationQueue = [];
    this.pendingFxList = [];
    this.pendingFloatingTexts = []; // 👇 추가됨
    this.postQueueActions = [];
    document.getElementById('log-box').innerHTML = '';
    this.updateLogStepUI();
  },

  // 👇 랜덤 위치에서 플로팅 텍스트를 만들고 0.8초 후 삭제하는 함수
  createFloatingText(boxId, text, colorClass) {
    const box = document.getElementById(boxId);
    if (!box || !box.parentElement) return;
    
    const stageRow = box.parentElement; // .stage-top-row
    const ft = document.createElement('div');
    ft.className = `fct-text ${colorClass}`;
    ft.textContent = text;
    
    // 대상 박스 내부(가로 30~70%, 세로 40~60%) 좌표를 부모 기준으로 환산
    const rx = box.offsetLeft + box.offsetWidth * (Math.random() * 0.4 + 0.3);
    const ry = box.offsetTop + box.offsetHeight * (Math.random() * 0.2 + 0.4);
    
    ft.style.left = `${rx}px`;
    ft.style.top = `${ry}px`;
    
    stageRow.appendChild(ft);
    setTimeout(() => { if (ft.parentElement) ft.remove(); }, 800);
  },

  appendDomLog(msg, cls = '') {
    const box = document.getElementById('log-box');
    if (!box) return;
    const div = document.createElement('div');
    div.className = cls;
    div.style.marginBottom = '4px';
    div.textContent = `▶ ${msg}`;
    box.appendChild(div);
  },

  selectCard(idx) {
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
      return;
    }
    this.selectedCardIdx = (this.selectedCardIdx === idx) ? null : idx;
    this.renderStageActors();
  },

  executeSelectedCard() {
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
      return;
    }
    if (this.selectedCardIdx === null) return;
    const idx = this.selectedCardIdx;
    this.selectedCardIdx = null;
    this.engine.playCardFromHand(idx);
  },

  onClickEndTurn() {
    if (this.presentationQueue.length > 0) {
      this.advanceLogStep();
      return;
    }
    if (this.mode !== 'ROGUE_COMBAT' || this.engine.combatEnded) return;
    this.selectedCardIdx = null;
    this.engine.endPlayerTurn();
  },

  renderStageActors(snapshot = null, activeStep = null) {
    const state = snapshot || this.captureStateSnapshot();
    const p = state.player;
    const e = state.enemy;
    const isQueueLocked = this.presentationQueue.length > 0;
    const currentStep = activeStep || this.presentationQueue[0] || null;

    const renderStatusTags = (ent) => {
      if (!ent.statuses.length) return `<span style="font-size:9.5px; color:#414868;">상태 없음</span>`;
      return ent.statuses.map(s => {
        const def = StatusDB[s.id];
        const meta = StatusMeta[s.id] || { icon: '📌' };
        const cls = def.category === 'BUFF' ? 'buff' : (def.category === 'DEBUFF' ? 'debuff' : 'context');
        const acc = s.accumulated ? `(${s.accumulated})` : '';
        return `<span class="s-tag ${cls}" onclick="AppUI.openStatusInfo('${s.id}', ${s.stacks}, ${s.accumulated || 0})">${meta.icon}${def.name} ${s.stacks}${acc}</span>`;
      }).join('');
    };

    // 1. 좌측: 플레이어 박스 (피격 텍스트 및 방어도 텍스트 완전 제거, 방어도는 흰색 반투명 게이지로 표시)
    const pSpriteUrl = SpriteMap[p.name];
    const pSpriteEl = document.getElementById('sprite-player');
    if (pSpriteUrl) {
      pSpriteEl.style.backgroundImage = `url('${pSpriteUrl}')`;
      pSpriteEl.innerHTML = ''; // 이미지 있으면 텍스트 삭제
    } else {
      pSpriteEl.style.backgroundImage = 'none';
      pSpriteEl.innerHTML = `[내 도트]<br>${p.name}`; // 이미지 없으면 텍스트
    }
    document.getElementById('player-name-label').textContent = p.name;
    const pPct = p.maxHp > 0 ? Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100)) : 0;
    const pArmorPct = p.maxHp > 0 ? Math.max(0, Math.min(100, (p.armor / p.maxHp) * 100)) : 0;
    document.getElementById('player-hp-fill').style.width = `${pPct}%`;
    document.getElementById('player-armor-fill').style.width = `${pArmorPct}%`;
    document.getElementById('player-hp-text').textContent = `${p.hp} / ${p.maxHp}`;
    document.getElementById('player-status-list').innerHTML = renderStatusTags(p);

    const gemsEl = document.getElementById('player-ap-gems');
    gemsEl.innerHTML = Array.from({ length: p.maxEnergy }, (_, i) =>
      `<div class="ap-gem ${i < p.energy ? 'on' : ''}"></div>`
    ).join('');

    // 2. 우측: 적 박스 (방어도는 흰색 반투명 게이지로 표시)
    const floorTag = this.mode === 'ROGUE_COMBAT' ? ` (${RogueManager.state.floor}F)` : '';
    const eSpriteUrl = SpriteMap[e.name];
    const eSpriteEl = document.getElementById('sprite-enemy');
    if (eSpriteUrl) {
      eSpriteEl.style.backgroundImage = `url('${eSpriteUrl}')`;
      eSpriteEl.innerHTML = '';
    } else {
      eSpriteEl.style.backgroundImage = 'none';
      eSpriteEl.innerHTML = `[적 도트]<br>${e.name}`;
    }
    document.getElementById('enemy-name-label').textContent = `${e.name}${floorTag}`;
    const ePct = e.maxHp > 0 ? Math.max(0, Math.min(100, (e.hp / e.maxHp) * 100)) : 0;
    const eArmorPct = e.maxHp > 0 ? Math.max(0, Math.min(100, (e.armor / e.maxHp) * 100)) : 0;
    document.getElementById('enemy-hp-fill').style.width = `${ePct}%`;
    document.getElementById('enemy-armor-fill').style.width = `${eArmorPct}%`;
    document.getElementById('enemy-hp-text').textContent = `${e.hp} / ${e.maxHp}`;
    document.getElementById('enemy-status-list').innerHTML = renderStatusTags(e);

    // 3. 중상단 보라색 통합 박스: [로그 대기 중이면 1줄 로그] vs [평소에는 적 다음 행동 예고]
    document.getElementById('deck-grave-Summary').textContent = `덱${p.deckCount}/묘${p.graveCount}`;
    const purpleBox = document.getElementById('purple-box');
    const headerLabel = document.getElementById('purple-header-label');
    const mainDisplay = document.getElementById('purple-main-display');
    const countEl = document.getElementById('log-step-counter');
    const hintEl = document.getElementById('log-step-hint');
    const skipBtn = document.getElementById('btn-skip-logs');

    if (isQueueLocked && currentStep) {
      const remaining = Math.max(0, this.presentationQueue.length - 1);
      const hasPendingAction = this.postQueueActions.length > 0;
      purpleBox.classList.add('waiting-log');
      if (remaining > 0) skipBtn.classList.remove('hidden');
      else skipBtn.classList.add('hidden');

      headerLabel.style.color = 'var(--fx-yellow)';
      headerLabel.textContent = `⚡ 전투 로그 진행 중`;
      mainDisplay.className = `purple-main-text ${currentStep.cls}`;
      mainDisplay.textContent = `▶ ${currentStep.msg}`;
      countEl.textContent = remaining > 0 ? `남은 로그: +${remaining}줄` : `마지막 로그`;
      hintEl.style.color = 'var(--fx-yellow)';
      hintEl.textContent = (hasPendingAction && remaining === 0) ? '터치하여 결과 이동 ▶' : '화면 터치하여 다음 줄 ▶';
    } else {
      purpleBox.classList.remove('waiting-log');
      skipBtn.classList.add('hidden');
      headerLabel.style.color = 'var(--fx-purple)';
      countEl.textContent = `${state.turn}턴 진행 중`;
      hintEl.style.color = 'var(--text-sub)';
      hintEl.textContent = '아래 카드를 선택하세요';
		
      if (this.mode === 'ROGUE_COMBAT' && e.enemyId && EnemyDB[e.enemyId] && e.hp > 0) {
        const resolved = this.engine.resolveEnemyAction(state.turn, this.engine.enemy, this.engine.player);
        if (resolved) {
          const act = resolved.action;
          let intentText = act.intent;
          if (e.tierDamageBonus > 0 && intentText.includes('물리')) {
            intentText = intentText.replace(/물리\s*(\d+)/g, (_, num) => `물리 ${Number(num) + e.tierDamageBonus}`);
          }

          if (resolved.blocker && !resolved.isFallback) {
            headerLabel.textContent = `🚫 적 행동 봉인됨 [${resolved.blocker.def.name}]`;
            mainDisplay.className = 'purple-main-text';
            mainDisplay.style.color = 'var(--text-sub)';
            mainDisplay.textContent = `(취소됨) ${act.name} — ${intentText}`;
          } else if (resolved.isFallback && resolved.blocker) {
            headerLabel.textContent = `💢 [${resolved.blocker.def.name}] 대체 행동 [${act.name}]`;
            mainDisplay.className = 'purple-main-text';
            mainDisplay.style.color = 'var(--fx-yellow)';
            mainDisplay.textContent = intentText;
          } else {
            headerLabel.textContent = `👾 적 다음 행동 예고 [${act.name}]`;
            mainDisplay.className = 'purple-main-text';
            mainDisplay.style.color = 'var(--fx-yellow)';
            mainDisplay.textContent = intentText;
          }
	}
      } else if (this.mode === 'STORY') {
        headerLabel.textContent = `📖 스토리 전투 안내`;
        mainDisplay.className = 'purple-main-text';
        mainDisplay.style.color = 'var(--text-main)';
        mainDisplay.textContent = p.hand.length > 0 ? `손패의 [${p.hand[0].name}] 카드를 선택해 실행하세요.` : `대사를 진행하세요.`;
      }
    }

    // 4. 중간 컨트롤 바 (선택된 카드가 있을 때만 중앙에 실행 버튼 등장!)
    const execBtn = document.getElementById('btn-exec-card');
    const endTurnBtn = document.getElementById('btn-end-turn');
    endTurnBtn.disabled = isQueueLocked || (this.mode !== 'ROGUE_COMBAT' || state.combatEnded);

    const canInteract = !isQueueLocked && ((this.mode === 'ROGUE_COMBAT' && !state.combatEnded) || (this.mode === 'STORY' && StorySequencer.state === 'WAIT_CARD'));
    if (this.selectedCardIdx !== null && !p.hand[this.selectedCardIdx]) {
      this.selectedCardIdx = null;
    }

    if (canInteract && this.selectedCardIdx !== null && this.engine.player.hand[this.selectedCardIdx]) {
      const selCard = this.engine.player.hand[this.selectedCardIdx];
      const cost = this.engine.getEffectiveCost(this.engine.player, selCard);
      const blocked = this.engine.player.getPassives().some(({ def, inst }) => def.canPlayCard && !def.canPlayCard(selCard, this.engine, this.engine.player, inst));

      execBtn.classList.remove('hidden'); // 카드 선택 시 중앙에 등장!
      if (blocked) {
        execBtn.disabled = true;
        execBtn.textContent = `🚫 사용 불가 (난투 등)`;
      } else if (p.energy < cost) {
        execBtn.disabled = true;
        execBtn.textContent = `⚡ 활력 부족 (필요 ${cost})`;
      } else {
        execBtn.disabled = false;
        execBtn.textContent = `▶ [${selCard.name}] 실행`;
      }
    } else {
      execBtn.classList.add('hidden'); // 선택 안 했을 때는 깔끔하게 숨김
    }

    // 5. 하단: 고정 폭 가로 스크롤 카드 렌더링 (013 복수는 설명란에 누적 피격 계산치 자동 표시)
    const gridEl = document.getElementById('hand-grid');
    const isStory1_1 = (this.mode === 'STORY' && StorySequencer.activeChapter?.id === 'stage_1_1');
    const isStory1_2 = (this.mode === 'STORY' && StorySequencer.activeChapter?.id === 'stage_1_2');
    gridEl.innerHTML = p.hand.map((card, idx) => {
      const isSelected = !isQueueLocked && this.selectedCardIdx === idx;
      const revMult = isStory1_1 ? 8 : 1;
      let baseDesc = (card.id === '013' && isStory1_1) ? card.desc.replace('1 x', '8 x') : card.desc;
      if (card.id === '040' && isStory1_2) baseDesc = '타수 1, 물리 0, 모두의 버프/디버프 제거. (스토리 전용: 겁먹은 아이를 해치지 않습니다)';
      const dynamicDesc = card.id === '013'
        ? `${baseDesc} <span style="color:var(--fx-yellow);">[현재: ${p.hitTakenCount * revMult} 피해]</span>`
        : baseDesc;
      return `
        <div class="hand-card ${isSelected ? 'selected' : ''}" style="${isQueueLocked ? 'opacity:0.55;' : ''}" onclick="AppUI.selectCard(${idx})">
          <div class="c-cost">${card.effCost}</div>
          <div class="c-name">${card.name}</div>
          <div class="c-type">${card.type}${card.effHits > 0 ? `(${card.effHits}타)` : ''}</div>
          <div class="c-desc">${dynamicDesc}</div>
        </div>
      `;
    }).join('');
  }
};
AppUI.init();
    // SpriteMap의 모든 이미지를 백그라운드에서 미리 캐싱
    Object.values(new Set(Object.values(SpriteMap))).forEach(src => {
      if (!src) return;
      const img = new Image();
      img.src = src;
    });
    window.onerror = (msg, src, line) => {
      alert(`오류 발생 (${line}줄): ${msg}`);
    };
</script>
</body>
</html>
