<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 화면 비율 고정 및 더블탭 확대 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sir Mad Boomer: Rabbit Knight</title>
  <style>
    /* ==========================================================================
       [0] 전역 색상 변수 (CSS Variables)
       ========================================================================== */
    :root {
      --bg-outer: #0b0c10;  /* 브라우저 맨 바깥 여백 배경색 (PC 화면 좌우 검은 영역) */
      --bg-app: #13141c;    /* 게임 본체(#app) 기본 배경색 */
      --bg-panel: #1a1b26;  /* 내부 패널(초상화 틀, 손패 틀, 모달창) 배경색 */
      --bg-card: #24283b;   /* 카드 및 일반 버튼 배경색 */
      --border: #414868;    /* 기본 테두리 색상 */
      --text-main: #c0caf5; /* 기본 텍스트 색상 */
      --text-sub: #787c99;  /* 보조/설명 텍스트 색상 */
      --accent: #7aa2f7;    /* 강조색 (주요 버튼, 코스트 동그라미, 선택된 탭) */

      /* 전투 피드백 연출 5색 (테두리 발광 및 텍스트 색상용) */
      --fx-red: #f7768e;    /* HP 감소 / 공격 / 보스 */
      --fx-green: #9ece6a;  /* HP 회복 / 캠프 */
      --fx-purple: #bb9af7; /* 디버프 획득 / 엘리트 / 적 행동 예고 배너 */
      --fx-blue: #7dcfff;   /* 버프 / 방어도 획득 / 특성 */
      --fx-yellow: #e0af68; /* 유물 / 의념 / 카드 이름 / 대기 중인 로그 강조 */
    }

    /* ==========================================================================
       [1] 기본 리셋 및 앱 프레임 레이아웃
       ========================================================================== */
    /* 모든 요소의 크기 계산을 테두리 포함(border-box)으로 통일하고 드래그 선택 방지 */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    /* 화면 정중앙에 모바일 세로형 게임기(#app)를 배치하고 전체 스크롤을 막음 */
    body {
      background: var(--bg-outer); color: var(--text-main);
      font-family: 'Pretendard', monospace, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh; overflow: hidden;
    }

    /* 모바일 세로 화면 컨테이너 (최대 가로폭 440px 고정) */
    #app {
      width: 100%; max-width: 440px; height: 100%;
      background: var(--bg-app); border: 1px solid var(--border);
      position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    /* 화면 전환 단위: 기본적으로 숨겨두고(display: none), .active가 붙은 화면만 표시 */
    .screen {
      display: none; flex-direction: column;
      width: 100%; height: 100%; padding: 12px; gap: 10px;
    }
    .screen.active { display: flex; }
    .hidden { display: none !important; } /* 특정 버튼/오버레이를 강제로 숨길 때 사용 */

    /* 공통 버튼 스타일 */
    button {
      background: var(--bg-card); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button:active:not(:disabled) { transform: scale(0.97); } /* 누를 때 살짝 작아지는 타격감 */
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #111; border-color: var(--accent); }

    /* ==========================================================================
       [2] 타이틀 로비 / 서브 화면 / 비주얼 노벨 스타일
       ========================================================================== */
    .menu-stack { display: flex; flex-direction: column; gap: 10px; width: 88%; margin: auto; } /* 타이틀 메뉴 버튼 묶음 */
    .menu-stack button { padding: 15px; font-size: 14.5px; }
    .screen-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); } /* 각 화면 상단 제목+뒤로가기 줄 */
    .scroll-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; } /* 세로 스크롤 목록(스토리, 갈림길, 도감 등) */
    .list-btn { text-align: left; padding: 14px; display: flex; justify-content: space-between; align-items: center; } /* 목록 안의 개별 선택지 박스 */

    /* 세이브 관리 화면의 텍스트 입력창 (드래그/복사를 위해 user-select: text 허용) */
    textarea.notepad {
      flex: 1; width: 100%; background: #0d0e14; color: var(--fx-green);
      border: 1px solid var(--border); border-radius: 6px; padding: 10px;
      font-family: monospace; font-size: 12px; resize: none; user-select: text;
    }

    /* 스토리 모드(비주얼 노벨) 상단 스탠딩 일러스트 영역 & 하단 대사창 */
    .vn-illust-area {
      flex: 1; background: var(--bg-panel); border: 1px dashed var(--border);
      border-radius: 6px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 12px;
    }
    .vn-textbox {
      min-height: 34%; background: #0e1017; border: 2px solid var(--accent);
      border-radius: 6px; padding: 14px; display: flex; flex-direction: column;
      justify-content: space-between; cursor: pointer;
    }
    .vn-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; } /* 스토리 분기 선택지 묶음 */
    .vn-choice-btn { text-align: left; background: #1f2335; border: 1px solid var(--accent); padding: 9px 12px; font-size: 12.5px; }

    /* ==========================================================================
       [3] 전투 화면 (#screen-combat) 4단 분할 레이아웃
       ========================================================================== */
    #screen-combat { padding: 10px; gap: 8px; position: relative; }

    /* [전투 1단 - 상단 38%] 좌(플레이어) / 우(적) 초상화 박스 나란히 배치 */
    .stage-top-row {
      height: 38%; min-height: 170px;
      display: flex; gap: 8px; width: 100%;
      position: relative; /* 데미지 플로팅 텍스트(.fct-text)가 떠오르는 좌표 기준점 */
    }
    /* 플레이어(#box-player)와 적(#box-enemy) 각각의 사각 프레임 */
    .actor-box {
      flex: 1; height: 100%; position: relative; overflow: hidden;
      background: var(--bg-panel); border: 2px solid var(--border); border-radius: 8px;
      display: flex; flex-direction: column; justify-content: flex-end;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    /* 캐릭터 도트/초상화 배경 이미지 레이어 */
    .avatar-bg {
      position: absolute; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 12px; color: var(--text-sub); text-align: center;
      background-color: #111218;
      background-size: cover;
      background-position: center 20%; /* 캐릭터 얼굴이 잘리지 않도록 위쪽(20%) 중심 정렬 */
      background-repeat: no-repeat;
      image-rendering: pixelated; /* 도트 그래픽이 흐려지지 않게 픽셀 유지 */
      padding-bottom: 52px;
    }
    /* 초상화 좌측 상단에 떠 있는 이름표 */
    .actor-name-floating {
      position: absolute; top: 6px; left: 8px; z-index: 2;
      font-size: 12px; font-weight: bold; padding: 2px 6px;
      background: rgba(11, 12, 16, 0.75); border: 1px solid var(--border); border-radius: 4px;
    }

    /* 초상화 하단에 반투명하게 겹쳐지는 상태창(체력바 + 활력 보석 + 버프/디버프 칸) */
    .actor-hud-overlay {
      position: relative; z-index: 2;
      background: rgba(13, 14, 20, 0.86); border-top: 1px solid var(--border);
      padding: 6px; display: flex; flex-direction: column; gap: 5px;
    }
    .hud-vital-row { display: flex; align-items: center; gap: 6px; } /* 체력바와 활력 보석을 한 줄에 배치 */
    .hp-bar-outer {
      flex: 1; height: 16px; background: #090a0f; border: 1px solid #414868;
      border-radius: 3px; position: relative; overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%; width: 100%; background: linear-gradient(90deg, #db4b4b, #f7768e);
      transition: width 0.25s ease-out; /* 체력 증감 시 부드럽게 줄어드는 애니메이션 */
    }
    /* 방어도 게이지: 체력바 위에 겹쳐지는 흰색 반투명 막 */
    .armor-bar-overlay {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: rgba(255, 255, 255, 0.55);
      border-right: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      transition: width 0.25s ease-out; pointer-events: none;
    }
    .hp-bar-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: bold; color: #fff; text-shadow: 0 0 4px #000, 0 0 2px #000;
    }

    /* 플레이어 활력(AP) 초록 보석 슬롯 */
    .ap-gems {
      display: flex; gap: 3px; align-items: center; flex-shrink: 0;
      padding: 2px 4px; border: 1px solid #2f3549; border-radius: 4px; background: #0d0e14;
    }
    .ap-gem {
      width: 9px; height: 9px; border-radius: 50%;
      background: #232634; border: 1px solid #414868; transition: 0.15s; /* 빈 보석 */
    }
    .ap-gem.on {
      background: #41f075; border-color: #d5ffdf; box-shadow: 0 0 5px #41f075; /* 채워진 초록 보석 */
    }

    /* 버프 / 디버프 / 의념 태그가 나열되는 가로 스크롤 슬롯 */
    .status-framed-box {
      min-height: 24px; border: 1px solid #2f3549; border-radius: 4px;
      background: #0b0c10; padding: 2px 4px;
      display: flex; align-items: center; gap: 4px; overflow-x: auto;
    }
    .s-tag {
      padding: 1px 5px; border-radius: 3px; background: #292e42;
      border: 1px solid #414868; cursor: pointer; white-space: nowrap; font-size: 10px;
    }
    .s-tag.buff { border-color: var(--fx-blue); color: var(--fx-blue); }       /* 파란 테두리: 버프 */
    .s-tag.debuff { border-color: var(--fx-purple); color: var(--fx-purple); } /* 보라 테두리: 디버프 */
    .s-tag.context { border-color: var(--fx-yellow); color: var(--fx-yellow); }/* 노란 테두리: 의념 */

    /* [전투 2단 - 중상단 18%] 보라색 통합 배너 (평소엔 적 행동 예고 / 로그 발생 시 1줄씩 클릭 재생) */
    .purple-unified-box {
      height: 18%; min-height: 78px;
      background: #181524; border: 2px solid var(--fx-purple); border-radius: 8px;
      padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between;
      position: relative; cursor: pointer; transition: border-color 0.15s, background-color 0.15s;
    }
    /* 읽어야 할 전투 로그가 쌓여 있을 때 테두리가 노란색으로 빛나며 터치를 유도함 */
    .purple-unified-box.waiting-log {
      border-color: var(--fx-yellow); background: #211d30;
      box-shadow: inset 0 0 14px rgba(224, 175, 104, 0.22);
    }
    .purple-top-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10.5px; color: var(--fx-purple); font-weight: bold;
    }
    .purple-main-text {
      font-family: monospace; font-size: 13px; font-weight: bold;
      color: var(--text-main); line-height: 1.4; word-break: keep-all;
      margin: auto 0;
    }
    .purple-bottom-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; color: var(--text-sub);
    }

    /* 스토리 모드 전투 중 보라색 배너 위에 덮어씌워지는 캐릭터 대사창 */
    .combat-vn-overlay {
      position: absolute; inset: 0; background: rgba(14, 16, 23, 0.96);
      border: 2px solid var(--accent); border-radius: 6px; padding: 10px 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; z-index: 20;
    }

    /* [전투 3단 - 중간 컨트롤 줄] 좌: 전술 메뉴 / 중앙: 카드 실행 버튼 / 우: 턴 종료 */
    .mid-control-row {
      height: 40px; display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-shrink: 0;
    }
    .mid-side-btn {
      width: 86px; height: 100%; padding: 0; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1f2335; border: 1px solid #565f89; flex-shrink: 0;
    }
    .mid-center-slot {
      flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
    }
    #btn-exec-card {
      width: 100%; height: 100%; padding: 0 10px; font-size: 12.5px;
      box-shadow: 0 0 12px rgba(122, 162, 247, 0.4);
    }

    /* [전투 4단 - 하단 34%] 가로 스크롤 손패(Hand) 영역 */
    .hand-section {
      flex: 1; min-height: 145px;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; display: flex; align-items: center;
      overflow: hidden;
    }
    .hand-carousel {
      display: flex; flex-direction: row; gap: 10px;
      width: 100%; height: 100%;
      overflow-x: auto; overflow-y: hidden;
      align-items: stretch; scroll-snap-type: x proximity; /* 가로 스크롤 시 카드 단위로 자석처럼 붙음 */
      padding-bottom: 4px;
    }
    /* 손패의 개별 카드 틀 (가로 128px 고정) */
    .hand-card {
      flex: 0 0 128px; width: 128px; height: 100%;
      scroll-snap-align: start;
      background: var(--bg-card); border: 2px solid #414868; border-radius: 6px;
      padding: 8px; display: flex; flex-direction: column; gap: 4px;
      cursor: pointer; position: relative; transition: transform 0.12s, border-color 0.12s;
    }
    /* 터치해서 선택된 카드: 위로 살짝 들리며(-4px) 노란 테두리 점등 */
    .hand-card.selected {
      border-color: var(--fx-yellow); background: #2f334d;
      transform: translateY(-4px);
      box-shadow: 0 4px 12px rgba(224, 175, 104, 0.35);
    }
    /* 카드 우측 상단 코스트 원형 배지 */
    .c-cost {
      position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
      border-radius: 50%; background: var(--accent); color: #111;
      font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .c-name { font-size: 12px; font-weight: bold; color: var(--fx-yellow); padding-right: 22px; word-break: keep-all; }
    .c-type { font-size: 10px; color: var(--fx-blue); }
    .c-desc { font-size: 10.5px; color: #a9b1d6; line-height: 1.35; margin-top: 4px; overflow-y: auto; }

    /* ==========================================================================
       [4] 시각 이펙트 (5색 박스 점멸, 모달 팝업, 도감 탭, 플로팅 텍스트)
       ========================================================================== */
    /* 피격 시 초상화 박스가 좌우로 흔들리는 애니메이션 */
    @keyframes box-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .fx-red {
      animation: box-shake 0.32s ease-in-out;
      border-color: var(--fx-red) !important;
      box-shadow: inset 0 0 22px rgba(247, 118, 142, 0.55) !important;
    }
    .fx-green {
      border-color: var(--fx-green) !important;
      box-shadow: inset 0 0 22px rgba(158, 206, 106, 0.5) !important;
    }
    .fx-purple {
      border-color: var(--fx-purple) !important;
      box-shadow: inset 0 0 22px rgba(187, 154, 247, 0.5) !important;
    }
    .fx-blue {
      border-color: var(--fx-blue) !important;
      box-shadow: inset 0 0 22px rgba(125, 207, 255, 0.5) !important;
    }
    .fx-yellow {
      border-color: var(--fx-yellow) !important;
      box-shadow: inset 0 0 22px rgba(224, 175, 104, 0.5) !important;
    }

    /* 모달 팝업 배경(어두운 암막) 및 팝업 카드 본체 */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.82);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      padding: 16px; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: 100%; max-height: 82%; background: var(--bg-panel);
      border: 1px solid var(--border); border-radius: 8px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }

    /* 보라색 박스 우측 상단 미니 버튼(스킵, 전체 로그) */
    .log-mini-btn {
      padding: 2px 7px; font-size: 10px; border-radius: 4px;
      background: #1f2335; border: 1px solid #414868; color: var(--text-main);
    }
    .log-mini-btn.active { border-color: var(--accent); color: var(--accent); }

    /* 도감 화면 상단 8개 카테고리 가로 스크롤 탭 및 개별 항목 카드 */
    .codex-tabs {
      display: flex; gap: 4px; flex-shrink: 0;
      overflow-x: auto; white-space: nowrap; padding-bottom: 4px;
    }
    .codex-tab {
      flex: 0 0 auto; padding: 7px 10px; font-size: 11.5px;
      background: #1a1b26; border: 1px solid var(--border); color: var(--text-sub);
    }
    .codex-tab.active {
      background: #24283b; border-color: var(--accent); color: var(--accent);
    }
    .codex-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 4px;
    }

    /* 데미지/회복/상태이상이 초상화 위로 떠올랐다가 사라지는 플로팅 텍스트(FCT) */
    @keyframes fct-float {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
      15% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
      30% { opacity: 1; transform: translate(-50%, -15px) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -30px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
    }
    .fct-text {
      position: absolute; z-index: 100;
      font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 26px;
      pointer-events: none; white-space: nowrap;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 6px rgba(0,0,0,0.6);
      animation: fct-float 0.8s ease-out forwards;
    }
    .fct-red { color: #f7768e; }    /* 체력 피해 수치 (-15 등) */
    .fct-blue { color: #7dcfff; }   /* 방어도 획득 (🛡️+18 등) */
    .fct-white { color: #ffffff; }  /* 방어도 차감 / 의념 발동 / 면역 */

    /* 1층 출발 보급에서 카드 3장을 고를 때 0.3초 동안 초록색 '추가!'가 튀어 오르는 연출 */
    @keyframes draft-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      25% { opacity: 1; transform: translate(-50%, -55%) scale(1.15); }
      80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
    }
    .draft-picked {
      animation: box-shake 0.3s ease-in-out;
      border-color: var(--fx-green) !important;
      box-shadow: inset 0 0 18px rgba(158, 206, 106, 0.45) !important;
    }
    .draft-pop-text {
      position: absolute; top: 50%; left: 50%; z-index: 10;
      font-size: 22px; font-weight: 900; color: var(--fx-green);
      pointer-events: none; white-space: nowrap;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      animation: draft-pop 0.3s ease-out forwards;
    }

  </style>
</head>

<script>
/**
 * ============================================================================
 * 1. RNG (난수 생성 및 배열 추첨 모듈)
 * - 일반 전투에서는 무작위 난수를 생성하고,
 * - 스토리 모드(예: 1-1장에서 용자의 행운이 무조건 30 데미지를 띄워야 할 때)에서는
 *   riggedQueue에 미리 넣어둔 조작값(rigNext)을 우선 꺼내 쓰는 구조입니다.
 * ============================================================================
 */
const RNG = {
  // 스토리 연출용 난수 조작 대기열 (비어있으면 순수 랜덤, 값이 있으면 그 값을 먼저 꺼내 씀)
  riggedQueue: [],

  // 다음번 randInt 호출 시 나올 숫자를 미리 예약 (스토리 스크립트의 RIG_NEXT_RANDOM에서 사용)
  rigNext(val) { this.riggedQueue.push(val); },

  // min 이상 max 이하의 정수 난수 1개를 반환 (예: randInt(10, 30) -> 10~30 중 하나)
  randInt(min, max) {
    if (this.riggedQueue.length > 0) {
      const rigged = this.riggedQueue.shift();
      return Math.max(min, Math.min(max, rigged));
    }
    return Math.floor(Math.random() * (max - min + 1)) + min;
  },

  // 배열(arr)에서 무작위로 원소 1개를 골라 반환 (예: 적 패턴 랜덤 선택, 랜덤 버프 1개 선택)
  pickRandom(arr) {
    if (!arr || !arr.length) return null;
    return arr[this.randInt(0, arr.length - 1)];
  },

  // 배열(arr)에서 중복 없이 count개만큼 무작위로 뽑아 새 배열로 반환
  // (보상 카드 3장 추첨, 유물 2개 추첨, 덱 셔플 시 전체 카드를 무작위 순서로 섞을 때 사용)
  sampleUnique(arr, count) {
    const copy = [...arr];
    const out = [];
    while (copy.length > 0 && out.length < count) {
      const idx = this.randInt(0, copy.length - 1);
      out.push(copy.splice(idx, 1)[0]);
    }
    return out;
  },

  // 조작 대기열 초기화 (스토리 챕터 새로 시작할 때 호출)
  reset() { this.riggedQueue = []; }
};

/**
 * ============================================================================
 * 2. SaveLedger (스토리 + 로그라이크 계승 평면 텍스트 세이브)
 * - 브라우저 LocalStorage 대신 유저가 직접 복사/수정할 수 있는 텍스트 장부 구조
 * ============================================================================
 */
const SaveLedger = {
  data: {

  // 특정 세이브 키 값 읽기
  get(key) { return this.data[key]; },

  // 특정 세이브 키 값 덮어쓰기
  set(key, value) { this.data[key] = value; },

  // 현재 data 객체를 "key = value" 형태의 여러 줄 텍스트로 변환 (세이브 기록장 출력용)
  exportText() {
    const lines = ['# Sir Mad Boomer Save Data (v1.15)'];
    for (const [k, v] of Object.entries(this.data)) {
      lines.push(`${k} = ${v}`);
    }
    return lines.join('\n');
  },

  // 유저가 텍스트창에 붙여넣은 문자열을 파싱하여 data 객체에 반영 ([기록 적용하기] 버튼용)
  importText(rawText) {
    const nextData = {};
    const lines = rawText.split(/\r?\n/);
    for (const rawLine of lines) {
      const cleanLine = rawLine.split('#')[0].trim(); // '#' 뒷부분 주석 제거
      if (!cleanLine) continue;
      const eqIdx = cleanLine.indexOf('=');
      if (eqIdx === -1) continue;
      const key = cleanLine.slice(0, eqIdx).trim();
      const valStr = cleanLine.slice(eqIdx + 1).trim();
      if (!key) continue;

      // 문자열을 원래 자료형(불리언, 숫자, 문자열 목록)으로 복원
      // ※ deck, relics, traits는 카드/유물이 1개만 남았을 때(예: '001') 숫자로 변환되면 앞의 0이 날아가므로 무조건 문자열로 유지
      if (valStr === 'true') nextData[key] = true;
      else if (valStr === 'false') nextData[key] = false;
      else if (!isNaN(valStr) && valStr !== '' && !valStr.includes(',') && !key.endsWith('deck') && !key.endsWith('relics') && !key.endsWith('traits')) {
        nextData[key] = Number(valStr);
      } else {
        nextData[key] = valStr;
      }
    }
    this.data = { ...this.data, ...nextData };
    return this.data;
  }
};

      let dmg = 0;
      let removed = false;
      const refunds = [];
      const hasUnfairContract = u.relics.some(r => r.id === '020');

      ['BLEED', 'CURSE'].forEach(id => {
        const inst = engine.statuses.get(t, id);

              const half = Math.floor(lost * 0.5);
              if (half > 0) refunds.push({ id, stacks: half });

          }
        }
      });

      // 2. 적의 모든 버프 제거 (스택당 +8)
      const buffRes = engine.statuses.removeAll(t, [STATUS_CATEGORY.BUFF], u);
      if (buffRes.removedStacks > 0) {
        dmg += buffRes.removedStacks * 8;
        removed = true;
      }

      // 3. 적의 방어도 제거 (1당 +1)
      if (t.armor > 0) {
        const seizedArmor = t.armor;
        t.armor = 0;
        dmg += seizedArmor;
        removed = true;
        engine.emitFloatingText(t, '방어 압류', 'fct-red');
        engine.emitLog(`💥 [강제정산] ${t.name}의 방어도 ${seizedArmor} 압류!`, 'log-sys');
      }

      if (removed) {
        engine.dealDamage(new DamagePacket({
          source: u, target: t, amount: dmg,
          type: DAMAGE_TYPE.PHYSICAL, isStrike: false, reason: '강제정산'
        }));
        if (!engine.combatEnded && refunds.length > 0) {
          refunds.forEach(r => {
            engine.emitLog(`📑 [유물: 부당계약서] [${StatusDB[r.id].name} ${r.stacks}] 스택 재부여!`, 'log-passive');

              self.cycleStep = 2;
              this.addViperBladesToDeck(engine, player, 5);
              engine.emitLog(`🍷 [만찬초대] 토끼기사의 덱에 [독사검] 5장이 섞여 들었습니다!`, 'log-status');
              engine.statuses.apply(self, player, 'BLEED', 2);
              engine.statuses.apply(self, self, 'CTX_FANG', 10);
            }
          };

        case 2: {
          const curViper = this.countViperBlades(player);
          return {
            name: '희노애락',
            type: 'MAGIC',
            intent: `[MAGIC] 🎭 토끼기사가 보유한 독사검을 2배(+${curViper}장 추가)로 만듦 + 💀 부귀영화가 스스로 저주 3 · 📜 계약 1 획득`,
            execute: () => {
              self.cycleStep = 3;
              const addCount = this.countViperBlades(player);
              if (addCount > 0) {
                this.addViperBladesToDeck(engine, player, addCount);
                engine.emitLog(`🎭 [희노애락] 토끼기사의 [독사검]이 2배(+${addCount}장)로 불어났습니다!`, 'log-status');
              } else {
                engine.emitLog(`🎭 [희노애락] 불어날 [독사검]이 없습니다.`, 'log-sys');
              }
              engine.statuses.apply(self, self, 'CURSE', 3);
              engine.statuses.apply(self, self, 'CONTRACT', 1);
            }
          };
        }

        case 3: {
          const curViper = this.countViperBlades(player);
          const hits = curViper * 2;
          return {
            name: '의심병',
            type: 'ATTACK',
            intent: `[ATTACK] ⚔️ 토끼기사에게 물리 2×${hits} 피해 (독사검 ${curViper}장×2 타수 증가) + 토끼기사의 잔여 방어 파쇄 및 물리 20 피해 + 토끼기사가 보유한 독사검 절반 제거`,
            execute: () => {
              self.cycleStep = 4;
              const nowViper = this.countViperBlades(player);
              const totalHits = nowViper * 2;
              if (totalHits > 0) {
                engine.executeAttack(self, player, 2, null, totalHits);
              } else {
                engine.emitLog(`👁️ [의심병] 덱에 독사검이 없어 타격이 발생하지 않았습니다.`, 'log-sys');
              }

              if (!engine.combatEnded && player.armor > 0) {
                const broken = player.armor;
                player.armor = 0;
                engine.emitFloatingText(player, '방어 파쇄!', 'fct-red');
                engine.emitLog(`💥 [의심병] 잔여 방어도(${broken})를 전부 무너뜨리고 추가 일격을 가합니다!`, 'log-hit');
                engine.executeAttack(self, player, 20, null, 1);
              }

              if (!engine.combatEnded) {
                const removed = this.removeHalfViperBlades(engine, player);
                if (removed > 0) {
                  engine.emitLog(`🗑️ [의심병] 히스테리가 가라앉으며 [독사검] ${removed}장이 제거되었습니다.`, 'log-sys');
                }
              }
            }
          };
        }

        case 4: {
          const willLoseHp = !self.patienceGainedSinceSerenade;
          return {
            name: '세레나데',
            type: 'MAGIC',
            intent: willLoseHp
              ? '[MAGIC] 🎵 인내 추가 누적 없음 -> 💔 부귀영화 최대 HP 300 상실 예정!'
              : '[MAGIC] 🎵 인내 추가 누적 감지됨 -> 최대 HP 상실 없음 (카운터 초기화)',
            execute: () => {
              self.cycleStep = 0;
              if (!self.patienceGainedSinceSerenade) {
                const prevMax = self.maxHp;
                if (prevMax <= 300) {
                  self.maxHp = 1;
                  self.hp = 0;
                  engine.emitFloatingText(self, '최대 HP 붕괴!', 'fct-red');
                  engine.emitLog(`🎵 [세레나데] 아무도 건드리지 않은 권좌가 스스로 무너져 내렸습니다!`, 'log-story');
                  engine.notifyRender();
                  engine.checkCombatEnd();
                } else {
                  self.maxHp = prevMax - 300;
                  self.hp = Math.min(self.hp, self.maxHp);
                  engine.emitFx(self, 'fx-red');
                  engine.emitFloatingText(self, '최대 HP -300', 'fct-red');
                  engine.emitLog(`🎵 [세레나데] 지난 세레나데 이후 인내가 쌓이지 않아 부귀영화의 최대 HP가 300 감소합니다! (${prevMax} -> ${self.maxHp})`, 'log-hit');
                  engine.notifyRender();
                }
              } else {
                engine.emitLog(`🎵 [세레나데] 인내에 누적된 적의가 권좌를 지탱합니다. (최대 HP 유지)`, 'log-sys');
              }
              self.patienceGainedSinceSerenade = false;
            }
          };
        }
      }
    }
  },
  DREAM_BOSS_DEUS_EX_MACHINA: {
    id: 'DREAM_BOSS_DEUS_EX_MACHINA',
    name: '데우스 엑스 마키나',
    maxHp: 2400,
    isBoss: false,
    isElite: false,
    isDreamBoss: true,

    injectErrorCodes(engine, player, count) {
      for (let i = 0; i < count; i++) {
        const card = engine.createCardInstance('901');
        const idx = RNG.randInt(0, player.deck.length);
        player.deck.splice(idx, 0, card);
      }
      engine.notifyRender();
    },

    onBattleStart(engine, self, player) {
      self.phase = 1;
      self.openedProof = false;
      self.cycleStep = 0;
      // 2막 멋진 신세계 덱 복원용 초기 덱 ID 스냅샷
      self.initialPlayerDeckIds = player.deck.map(c => c.id);
      self.statuses.push({ id: 'CONTRACT', stacks: 50, caster: self, accumulated: 0 });
    },

    onBeforeDeath(engine, self, player) {
      if ((self.phase || 1) !== 1) return false;

      self.phase = 2;
      self.cycleStep = 0;
      self.maxHp = 1600;
      self.hp = 0;

      // 1. 계약·결정론·재해석을 제외한 모든 버프/디버프/의념 초기화
      const keepIds = ['CONTRACT', 'CTX_DETERMINISM', 'CTX_REINTERPRET'];
      [self, player].forEach(ent => {
        ent.statuses = ent.statuses.filter(s => keepIds.includes(s.id));
      });

      // 2. 플레이어 덱 초기화(제외됐던 폭풍검·신성의식 포함 복구) + 오류코드 4장 투입
      engine.skipGraveyardAfterReset = true;
      player.hand = [];
      player.graveyard = [];
      player.combatTrackers.lastGraveyardCard = null;
      player.combatTrackers.lastPlayedCard = null;
      const baseIds = (self.initialPlayerDeckIds && self.initialPlayerDeckIds.length > 0)
        ? self.initialPlayerDeckIds
        : RogueManager.state.deck;
      const freshIds = RNG.sampleUnique(baseIds, baseIds.length);
      player.deck = freshIds.map(cid => engine.createCardInstance(cid));
      this.injectErrorCodes(engine, player, 4);

      engine.emitFx(self, 'fx-yellow');
      engine.emitFloatingText(self, '🌐 멋진 신세계!', 'fct-white fct-sm');
      engine.emitLog(`🌐 [2막: 멋진 신세계] 인과율이 재구축됩니다! 계약·결정론·재해석을 제외한 모든 상태와 의념이 소멸하고, 토끼기사의 덱이 초기화된 뒤 [오류코드] 4장이 삽입되었습니다!`, 'log-story');

      // 3. 보스 HP 1600 완전 회복 + 계약 최소 30 보충 / 플레이어 HP 30% 회복
      engine.heal(self, self.maxHp, '멋진 신세계');
      const playerHeal = Math.floor(player.maxHp * 0.3);
      if (playerHeal > 0) engine.heal(player, playerHeal, '멋진 신세계');

      const curContract = engine.statuses.get(self, 'CONTRACT')?.stacks || 0;
      if (curContract < 30) {
        engine.statuses.apply(self, self, 'CONTRACT', 30 - curContract);
      }

      // 플레이어 턴 도중 2막에 돌입했다면 손패가 비지 않도록 즉시 3장 드로우
      if (!engine.isEnemyTurn) {
        engine.drawCards(player, 3);
      }
      engine.notifyRender();
      return true;
    },

    getAction(turn, engine, self, player) {
      const isP2 = (self.phase || 1) >= 2;

      // ==================== [1막 오프닝: 최종증명] ====================
      if (!isP2 && !self.openedProof) {
        return {
          name: '최종증명',
          type: 'SKILL',
          ignoreBlockers: true,
          intent: '[SKILL] ⚙️ 모두의 버프/디버프 정화(계약 유지) + 데우스 엑스 마키나 [의념:결정론] 획득 + 토끼기사 [의념:재해석] 부여 및 덱에 [오류코드] 2장 추가',
          execute: () => {
            self.openedProof = true;
            self.cycleStep = 0;
            engine.emitLog(`⚙️ [최종증명] "모든 변수는 계산 아래 귀속된다."`, 'log-story');
            engine.statuses.removeAll(self, [STATUS_CATEGORY.BUFF, STATUS_CATEGORY.DEBUFF], self, ['CONTRACT']);
            engine.statuses.removeAll(player, [STATUS_CATEGORY.BUFF, STATUS_CATEGORY.DEBUFF], self);

            engine.statuses.setOrMaxContext(self, 'CTX_DETERMINISM', 1);
            if (!engine.statuses.get(player, 'CTX_REINTERPRET')) {
              player.statuses.push({ id: 'CTX_REINTERPRET', stacks: 0, caster: self, accumulated: 0 });
              engine.emitFloatingText(player, '🔍의념:재해석!!', 'fct-white fct-sm');
              engine.emitLog(`📌 [상태 부여] ${player.name} <- [의념:재해석 0/3]`, 'log-status');
            }
            this.injectErrorCodes(engine, player, 2);
            engine.emitLog(`👾 [최종증명] 토끼기사의 덱에 [오류코드] 2장이 삽입되었습니다!`, 'log-status');
            engine.notifyRender();
          }
        };
      }

      // ==================== [5단계 메인 사이클 (1막 / 2막 강화)] ====================
      const step = (((self.cycleStep || 0) + Math.max(0, turn - engine.turn)) % 5 + 5) % 5;

      switch (step) {
        case 0: {
          const cMin = isP2 ? 16 : 12;
          const cMax = isP2 ? 22 : 18;
          const dDesc = isP2 ? '저주 2 · 출혈 2' : '저주 1~2 · 출혈 1~2';
          return {
            name: isP2 ? '슈뢰딩거의 커튼 [II]' : '슈뢰딩거의 커튼',
            type: 'MAGIC',
            intent: `[MAGIC] 📜 데우스 엑스 마키나가 계약 ${cMin}~${cMax} 획득 + 💀 ${dDesc} 획득`,
            execute: () => {
              self.cycleStep = 1;
              engine.statuses.apply(self, self, 'CONTRACT', RNG.randInt(cMin, cMax));
              engine.statuses.apply(self, self, 'CURSE', isP2 ? 2 : RNG.randInt(1, 2));
              engine.statuses.apply(self, self, 'BLEED', isP2 ? 2 : RNG.randInt(1, 2));
            }
          };
        }

        case 1: {
          const cMin = isP2 ? 4 : 3;
          const cMax = isP2 ? 6 : 5;
          const needle = isP2 ? 5 : 4;
          const patience = isP2 ? 6 : 5;
          const regen = isP2 ? 10 : 8;
          return {
            name: isP2 ? '라그랑주의 도르래 [II]' : '라그랑주의 도르래',
            type: 'MAGIC',
            intent: `[MAGIC] 📜 데우스 엑스 마키나가 계약 ${cMin}~${cMax} + 🌵 도깨비바늘 ${needle} + 🛡️ 인내 ${patience} + 💚 재생 ${regen} 획득`,
            execute: () => {
              self.cycleStep = 2;
              engine.statuses.apply(self, self, 'CONTRACT', RNG.randInt(cMin, cMax));
              engine.statuses.apply(self, self, 'GOBLIN_NEEDLE', needle);
              engine.statuses.apply(self, self, 'PATIENCE', patience);
              engine.statuses.apply(self, self, 'REGEN', regen);
            }
          };
        }

        case 2: {
          const contractSpend = isP2 ? 10 : 7;
          const mult = isP2 ? 9 : 8;
          const nonContractStacks = self.statuses
            .filter(s => {
              const cat = StatusDB[s.id]?.category;
              return (cat === STATUS_CATEGORY.BUFF || cat === STATUS_CATEGORY.DEBUFF) && s.id !== 'CONTRACT' && s.stacks > 0;
            })
            .reduce((sum, s) => sum + s.stacks, 0);
          const curContract = engine.statuses.get(self, 'CONTRACT')?.stacks || 0;
          const estSpend = Math.min(curContract, contractSpend);
          const estArmor = (nonContractStacks + estSpend) * mult;
          return {
            name: isP2 ? '대통합 (GUT) [II]' : '대통합 (GUT)',
            type: 'MAGIC',
            intent: `[MAGIC] 🛡️ 계약 외 자신 버프/디버프 전부 해제(${nonContractStacks}) + 계약 ${estSpend} 소모 -> 총 소모×${mult} 방어도 획득 (예상 +${estArmor})`,
            execute: () => {
              self.cycleStep = 3;
              const res = engine.statuses.removeAll(self, [STATUS_CATEGORY.BUFF, STATUS_CATEGORY.DEBUFF], self, ['CONTRACT']);
              const cInst = engine.statuses.get(self, 'CONTRACT');
              let spentContract = 0;
              if (cInst && cInst.stacks > 0) {
                spentContract = Math.min(cInst.stacks, contractSpend);
                engine.statuses.changeStacks(self, cInst, -spentContract, 'CONSUME', self);
              }
              const totalConsumed = res.removedStacks + spentContract;
              if (totalConsumed > 0) {
                engine.gainArmor(self, totalConsumed * mult, '대통합(GUT)');
              } else {
                engine.emitLog(`⚙️ [대통합] 통합할 상태이상이 없어 방어도를 얻지 못했습니다.`, 'log-sys');
              }
            }
          };
        }

        case 3: {
          const hitDmg = isP2 ? 9 : 7;
          return {
            name: isP2 ? '플랑크 사계 [II]' : '플랑크 사계',
            type: 'ATTACK',
            intent: `[ATTACK] ⚔️ 토끼기사에게 물리 ${hitDmg}×4 피해 + 🎲 계약 외 모두의 버프/디버프 제거 후, 제거한 총 스택만큼 모두에게 랜덤 버프/디버프 재분배`,
            execute: () => {
              self.cycleStep = 4;
              engine.executeAttack(self, player, hitDmg, null, 4);
              if (engine.combatEnded) return;

              const r1 = engine.statuses.removeAll(self, [STATUS_CATEGORY.BUFF, STATUS_CATEGORY.DEBUFF], self, ['CONTRACT']);
              const r2 = engine.statuses.removeAll(player, [STATUS_CATEGORY.BUFF, STATUS_CATEGORY.DEBUFF], self, ['CONTRACT']);
              const totalRemoved = r1.removedStacks + r2.removedStacks;

              if (totalRemoved > 0) {
                const selfGains = {};
                const playerGains = {};
                for (let i = 0; i < totalRemoved; i++) {
                  const targetMap = RNG.randInt(0, 1) === 0 ? selfGains : playerGains;
                  const pick = RNG.pickRandom(RANDOM_BUFF_DEBUFF_POOL);
                  if (pick) targetMap[pick] = (targetMap[pick] || 0) + 1;
                }
                engine.emitLog(`🎲 [플랑크 사계] 총 ${totalRemoved}스택의 상태이상이 사계의 난수로 재분배됩니다!`, 'log-status');
                Object.entries(selfGains).forEach(([id, cnt]) => {
                  if (!engine.combatEnded) engine.statuses.apply(self, self, id, cnt);
                });
                Object.entries(playerGains).forEach(([id, cnt]) => {
                  if (!engine.combatEnded) engine.statuses.apply(self, player, id, cnt);
                });
              } else {
                engine.emitLog(`🎲 [플랑크 사계] 재분배할 버프/디버프가 없습니다.`, 'log-sys');
              }
            }
          };
        }

        case 4: {
          const ratio = isP2 ? 0.15 : 0.10;
          const pctLabel = isP2 ? '15%' : '10%';
          const curContract = engine.statuses.get(self, 'CONTRACT')?.stacks || 0;
          const spendPreview = curContract > 0 ? Math.max(1, Math.ceil(curContract * ratio)) : 0;
          const dmgPreview = spendPreview * 10;
          return {
            name: isP2 ? '뉴턴의 돌팔매 [II]' : '뉴턴의 돌팔매',
            type: 'ATTACK',
            intent: spendPreview > 0
              ? `[ATTACK] 💥 보유 계약 ${pctLabel}(${spendPreview}) 소모 -> 토끼기사에게 물리 ${dmgPreview} 피해`
              : `[ATTACK] 💤 보유 계약 고갈(0) -> 발사 실패 (물리 0 피해)`,
            execute: () => {
              self.cycleStep = 0;
              const cInst = engine.statuses.get(self, 'CONTRACT');
              const nowContract = cInst ? cInst.stacks : 0;
              const spend = nowContract > 0 ? Math.max(1, Math.ceil(nowContract * ratio)) : 0;
              if (spend > 0) {
                engine.statuses.changeStacks(self, cInst, -spend, 'CONSUME', self);
                engine.emitLog(`💥 [뉴턴의 돌팔매] 계약 ${spend}스택을 질량으로 치환해 투척합니다!`, 'log-hit');
                engine.executeAttack(self, player, spend * 10, null, 1);
              } else {
                engine.emitLog(`⚙️ [뉴턴의 돌팔매] 소모할 계약이 고갈되어 투척이 불발되었습니다!`, 'log-sys');
              }
            }
          };
        }
      }
    }
  }
};

// 몽중몽 고정 보스 등장 순서 (별빛 0 -> 1번 보스, 별빛 1 -> 2번 보스...)
const DREAM_BOSS_ORDER = [
  'DREAM_BOSS_MAFIA_MOLE',
  'DREAM_BOSS_WEALTH_GLORY',
  'DREAM_BOSS_DEUS_EX_MACHINA'
];

/**
 * ============================================================================
 * 5. 코어 전투 엔진 (DamagePacket, Entity, StatusManager, CombatEngine)
 * ============================================================================
 */

/**
 * [DamagePacket] 단일 타격 또는 피해 이벤트 1건의 데이터를 담는 객체
 * - 데미지가 여러 패시브(실명, 인내, 성채, 방어도 등)를 통과하면서 수치가 깎이거나
 *   로그 꼬리표(logs)가 누적되는 과정을 하나의 패킷으로 추적하기 위해 사용
 */
class DamagePacket {
  constructor({ source, target, amount, type = DAMAGE_TYPE.PHYSICAL, isStrike = false, isBonus = false, reason = '' }) {
    this.source = source;         // 피해를 가한 주체 (도트/환경 피해면 null)
    this.target = target;         // 피해를 입는 대상
    this.baseAmount = amount;     // 패시브 감쇠 전 원래 기본 피해량
    this.amount = amount;         // 각종 감쇠/증폭 연산을 거치며 실시간으로 변하는 현재 피해량
    this.type = type;             // 피해 유형 (PHYSICAL / STATUS / HP_LOSS)
    this.isStrike = isStrike;     // 직접 타격 여부 (true일 때만 도깨비바늘·불굴의 털 반격 발동)
    this.isBonus = isBonus;       // 추가타 여부
    this.reason = reason;         // 로그 및 사망 원인 추적용 발동 출처 이름
    this.logs = [];               // 피격 중 적용된 효과 메모 (예: ['인내 흡수', '방어도(-10)'])
  }
}

/**
 * [Entity] 전투에 참여하는 개체(플레이어 또는 적) 1명의 실시간 전투 상태
 */
class Entity {
  constructor(name, maxHp, isPlayer = false) {
    this.name = name;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.armor = 0;               // 현재 방어도 (턴이 넘어가도 자동 초기화되지 않음)
    this.energy = 0;              // 현재 활력(AP)
    this.maxEnergy = 4;           // 최대 활력 상한 (기본 4)
    this.maxCarryOver = 1;        // 턴 종료 시 다음 턴으로 이월되는 최대 활력 (기본 1)
    this.isPlayer = isPlayer;     // 플레이어 여부
    this.enemyId = null;          // 적일 경우 EnemyDB의 ID
    this.traits = [];             // 보유 특성 인스턴스 배열
    this.relics = [];             // 보유 유물 인스턴스 배열
    this.statuses = [];           // 현재 걸린 버프/디버프/의념 인스턴스 배열
    this.deck = [];               // 전투 중 뽑을 카드 더미
    this.hand = [];               // 현재 손패
    this.graveyard = [];          // 버려진 카드 더미 (묘지)
    this.runTrackers = { hitTakenCount: 0 };          // 런 전체 누적 기록 ([013 복수]용 피격 횟수)
    this.combatTrackers = { lastGraveyardCard: null, lastPlayedCard: null }; // 단일 전투 내 기록 ([024 끼토산]용 직전 묘지 카드)

  }

  /**
   * 개체가 보유한 모든 패시브(특성 + 유물 + 상태이상)를 하나로 합쳐 우선순위(priority) 오름차순으로 반환
   * - 숫자가 낮을수록 먼저 실행됨 (예: 특성 10 -> 유물 20 -> 일반 상태이상 50 -> 인내/계약 90 -> 보험 95)
   */
  getPassives() {
    const list = [
      ...this.traits.map(t => ({ def: TraitDB[t.id], inst: t })),
      ...this.relics.map(r => ({ def: RelicDB[r.id], inst: r })),
      ...this.statuses.map(s => ({ def: StatusDB[s.id], inst: s }))
    ].filter(x => x.def);
    return list.sort((a, b) => (a.def.priority || 50) - (b.def.priority || 50));
  }
}

/**
 * [StatusManager] 버프·디버프·의념의 부여, 면역 판정, 스택 증감, 해제/제거를 전담하는 관리자
 */
class StatusManager {
  constructor(engine) { this.engine = engine; }

  // 표기 오타 보정용 별칭 정규화
  normalizeId(statusId) { return statusId === 'BABAYAGA' ? 'BABA_YAGA' : statusId; }

  // 대상에게 특정 상태이상이 걸려있는지 조회 (없으면 undefined)
  get(target, statusId) { return target.statuses.find(s => s.id === this.normalizeId(statusId)); }

  /**
   * 상태이상 부여 파이프라인:
   * 1) 디버프 면역 체크 -> 2) 시전자 부여 스택 증감 -> 3) 피시전자 획득 스택 증감 -> 4) 합산 및 시각 연출
   * 삭제됨 (notifyApplyFailed의 apply로 이관
   */

  // [의념(CONTEXT)] 전용: 기존 지속 턴과 새 지속 턴 중 더 긴 값으로 설정
  setOrMaxContext(target, statusId, durationTurns) {
    let inst = this.get(target, statusId);
    if (inst) inst.stacks = Math.max(inst.stacks, durationTurns);
    else target.statuses.push({ id: statusId, stacks: durationTurns, caster: target });
    this.engine.notifyRender();
  }

  // 디버프 자연 감소 시도: 대상에게 [계약]이 걸려 있으면 다른 디버프의 자연 감소를 차단
  tryDecayDebuff(owner, instance, amount) {
    const hasContract = owner.statuses.some(s => StatusDB[s.id].preventsOtherDebuffDecay && s.id !== instance.id && s.stacks > 0);
    if (hasContract) return;
    this.changeStacks(owner, instance, -amount, 'DISPEL');
  }

  // v1.15 추가: 버프/디버프 부여 실패
  notifyApplyFailed(caster, target, statusId) {
    if (!caster) return;
    const cat = StatusDB[statusId]?.category;
    if (cat !== STATUS_CATEGORY.BUFF && cat !== STATUS_CATEGORY.DEBUFF) return;
    caster.getPassives().forEach(({ def, inst }) => {
      if (!this.engine.combatEnded && def.onStatusApplyFailed) {
        def.onStatusApplyFailed(this.engine, caster, inst, target, statusId);
      }
    });
  }

  apply(caster, target, rawStatusId, stacks) {
    const statusId = this.normalizeId(rawStatusId);
    const def = StatusDB[statusId];
    if (!def || stacks <= 0) return;

    // 1-A) 특정 상태 획득 금지([의념:책임자]의 보험·언데드 금지 등)
    const bannedBy = target.getPassives().find(({ def: pDef }) =>
      Array.isArray(pDef.preventStatusIds) && pDef.preventStatusIds.includes(statusId)
    );
    if (bannedBy) {
      this.engine.emitFloatingText(target, '획득 불가!', 'fct-white');
      this.engine.emitLog(`🚫 [${bannedBy.def.name}] 효과로 ${target.name}은(는) [${def.name}] 상태를 획득할 수 없습니다!`, 'log-sys');
      this.notifyApplyFailed(caster, target, statusId);
      return;
    }

    // 1-B) 디버프 면역([의념:구도자], [의념:승천자], [의념:결정론]의 뇌진탕 면역)
    if (def.category === STATUS_CATEGORY.DEBUFF) {
      const blocker = target.getPassives().find(({ def: pDef }) =>
        pDef.preventDebuff || (Array.isArray(pDef.preventDebuffIds) && pDef.preventDebuffIds.includes(statusId))
      );
      if (blocker) {
        this.engine.emitFloatingText(target, '면역!', 'fct-white');
        this.engine.emitLog(`✨ [${blocker.def.name}] 효과로 ${target.name}이(가) [${def.name}] 디버프를 면역했습니다!`, 'log-sys');
        this.notifyApplyFailed(caster, target, statusId);
        return;
      }
    }

    let finalStacks = stacks;

    // 2) 시전자(caster)의 부여량 증가 패시브 적용
    if (caster) {
      caster.getPassives().forEach(({ def: pDef, inst }) => {
        if (pDef.modifyStatusAppliedStacks) {
          finalStacks = pDef.modifyStatusAppliedStacks(finalStacks, caster, target, statusId, inst);
        }
      });
    }

    // 2-B) [의념:결정론] 상대에 의한 버프/디버프 부여 시 계약 소모 저항
    if ((def.category === STATUS_CATEGORY.BUFF || def.category === STATUS_CATEGORY.DEBUFF) && caster && caster !== target) {
      const determinism = target.getPassives().find(({ def: pDef }) => pDef.resistByContract);
      const contractInst = determinism ? this.get(target, 'CONTRACT') : null;
      if (determinism && contractInst && contractInst.stacks > 0) {
        const spend = Math.min(contractInst.stacks, finalStacks);
        this.engine.emitFx(target, 'fx-yellow');
        this.engine.emitFloatingText(target, `⚙️계약 -${spend}`, 'fct-white fct-sm');
        this.engine.emitLog(`⚙️ [${determinism.def.name}] ${target.name}이(가) 계약 ${spend}을 소모하여 [${def.name} ${finalStacks}] 부여에 저항했습니다! (남은 계약:${contractInst.stacks - spend})`, 'log-sys');
        this.changeStacks(target, contractInst, -spend, 'CONSUME', target);
        this.notifyApplyFailed(caster, target, statusId);
        return;
      }
    }

    // 3) 피시전자(target)의 획득량 증가 패시브 적용
    if (target) {
      target.getPassives().forEach(({ def: pDef, inst }) => {
        if (pDef.modifyStatusReceivedStacks) {
          finalStacks = pDef.modifyStatusReceivedStacks(finalStacks, caster, target, statusId, inst);
        }
      });
    }

    // 4) 기존 상태 합산 또는 신규 생성
    let inst = this.get(target, statusId);
    if (inst) inst.stacks += finalStacks;
    else {
      inst = { id: statusId, stacks: finalStacks, caster, accumulated: 0 };
      if (def.onInit) def.onInit(inst);
      target.statuses.push(inst);
    }

    // 5) 적용 직후 즉시 실행 훅
    if (def.onApply) def.onApply(this.engine, target, inst);

    const fx = def.category === STATUS_CATEGORY.DEBUFF ? 'fx-purple' : (def.category === STATUS_CATEGORY.BUFF ? 'fx-blue' : 'fx-yellow');
    const fct = def.category === STATUS_CATEGORY.DEBUFF ? 'fct-purple' : (def.category === STATUS_CATEGORY.BUFF ? 'fct-cyan' : 'fct-white');

    this.engine.emitFx(target, fx);
    this.engine.emitFloatingText(target, `${def.name}!!`, fct);
    this.engine.emitLog(`📌 [상태 부여] ${target.name} <- [${def.name} ${finalStacks}] (현재:${inst.stacks})`, 'log-status');
    this.engine.notifyRender();
  }

  /**
   * 스택 증감 및 0 이하 소멸 처리
   * @param {'DISPEL'|'REMOVE'|'CONSUME'} mode
   * - 'DISPEL': 자연 만료/조건 소모로 인한 해제 -> onDispel(인내 자폭, 바바야가 반격, 설리반 기절) 발동
   * - 'REMOVE': 카드/스킬에 의한 외부 강제 제거 -> onDispel 미발동, onRemoved(언데드 성불 회복)만 발동
   * - 'CONSUME': 언데드 부활 등 자체 소모 -> onDispel, onRemoved 모두 미발동
   */
  changeStacks(owner, instance, delta, mode = 'DISPEL', actor = null) {
    let actualDelta = delta;
    let skipOnRemoved = false;
    const def = StatusDB[instance.id];

    // 0) [의념:결정론] 상대에 의한 버프/디버프 정화·제거·해제 차단
    if (actualDelta < 0 && actor && actor !== owner && def && (def.category === STATUS_CATEGORY.BUFF || def.category === STATUS_CATEGORY.DEBUFF)) {
      const antiRemove = owner.getPassives().find(({ def: pDef }) => pDef.preventOpponentRemove);
      if (antiRemove) {
        this.engine.emitFloatingText(owner, '간섭 불가!', 'fct-white fct-sm');
        this.engine.emitLog(`⚙️ [${antiRemove.def.name}] ${owner.name}의 [${def.name}] 상태는 상대에 의해 제거되지 않습니다!`, 'log-sys');
        return 0;
      }
    }

    // 1) [의념:책임자] 버프/디버프 스택 감소 및 제거 차단
    if (actualDelta < 0 && def && (def.category === STATUS_CATEGORY.BUFF || def.category === STATUS_CATEGORY.DEBUFF)) {
      const isBannedExempt = (instance.id === 'INSURANCE' || instance.id === 'UNDEAD');
      const lockPassive = !isBannedExempt && owner.getPassives().find(({ def: pDef }) => pDef.preventStackDecrease);
      if (lockPassive) {
        if (mode === 'REMOVE') {
          this.engine.emitFloatingText(owner, '고정됨!', 'fct-white');
          this.engine.emitLog(`🔒 [${lockPassive.def.name}] 효과로 ${owner.name}의 [${def.name}] 상태가 감소/제거되지 않습니다!`, 'log-sys');
        }
        return 0;
      }
    }

    // 2) [의념:식구] 등 강제 제거량 변조 훅
    if (actualDelta < 0 && mode === 'REMOVE') {
      const guard = owner.getPassives().find(({ def: pDef }) => pDef.modifyRemoveDelta);
      if (guard) {
        const res = guard.def.modifyRemoveDelta(actualDelta, instance, this.engine, owner, guard.inst);
        if (res && typeof res === 'object') {
          actualDelta = res.delta;
          if (res.skipOnRemoved) skipOnRemoved = true;
        }
      }
    }

    const before = instance.stacks;
    instance.stacks += actualDelta;
    const actualLost = Math.max(0, before - Math.max(0, instance.stacks));

    if (instance.stacks <= 0) {
      const idx = owner.statuses.indexOf(instance);
      if (idx !== -1) owner.statuses.splice(idx, 1);
      this.engine.emitLog(`💨 [${mode === 'DISPEL' ? '해제' : '제거'}] ${owner.name}의 [${def.name}] 소멸`, 'log-status');
      if (mode === 'DISPEL' && def.onDispel) def.onDispel(this.engine, owner, instance);
      if (mode !== 'CONSUME' && !skipOnRemoved && def.onRemoved) def.onRemoved(this.engine, owner, instance);
    } else if (actualLost > 0 && mode === 'REMOVE') {
      this.engine.emitLog(`🎩 [제거 저항] ${owner.name}의 [${def.name}] ${actualLost}스택만 감소 (남은 스택:${instance.stacks})`, 'log-status');
    }
    this.engine.notifyRender();
    return actualLost;
  }

  // 특정 카테고리 중 무작위 1종을 '해제(DISPEL)'
  dispelRandom(target, category) {
    const cands = target.statuses.filter(s => StatusDB[s.id].category === category);
    if (!cands.length) return;
    const pick = cands[RNG.randInt(0, cands.length - 1)];
    this.changeStacks(target, pick, -pick.stacks, 'DISPEL');
  }

  // 특정 카테고리 중 무작위 1종을 '강제 제거(REMOVE)' ([009 숭고] 등)
  removeRandom(target, category) {
    const cands = target.statuses.filter(s => StatusDB[s.id].category === category);
    if (!cands.length) return;
    const pick = cands[RNG.randInt(0, cands.length - 1)];
    this.changeStacks(target, pick, -pick.stacks, 'REMOVE');
  }

  // 지정한 ID의 상태이상을 '강제 제거(REMOVE)'하고 제거된 스택 수 반환 ([004 강제정산] 등)
  removeSpecific(target, statusId, actor = null) {
    const inst = this.get(target, statusId);
    if (!inst) return 0;
    return this.changeStacks(target, inst, -inst.stacks, 'REMOVE', actor);
  }
  // 지정한 카테고리(예: [BUFF, DEBUFF])의 모든 상태를 '강제 제거(REMOVE)'하고 종류 수·총 스택 수 반환 ([040 희망의 기사] 등)
  removeAll(target, categories, actor = null, excludeIds = []) {
    const list = target.statuses.filter(s =>
      categories.includes(StatusDB[s.id].category) && !excludeIds.includes(s.id)
    );
    let removedCount = 0, removedStacks = 0;
    list.forEach(inst => {
      const lost = this.changeStacks(target, inst, -inst.stacks, 'REMOVE', actor);
      if (lost > 0) {
        removedCount += 1;
        removedStacks += lost;
      }
    });
    return { removedCount, removedStacks };
  }
}

/**
 * [CombatEngine] 턴 진행, 카드 사용, 피해 계산 파이프라인, 적 AI 패턴 결정 등 전투 규칙 총괄 엔진
 */
class CombatEngine {
  constructor() {
    this.uidCounter = 1;       // 전투 중 생성되는 카드 인스턴스의 고유 번호 발급기
    this.replayDepth = 0;      // 재사용 카드([024 끼토산], [039 금고]) 무한 루프 방지용 재귀 깊이 카운터
    this.turn = 1;             // 현재 전투 경과 턴
    this.combatEnded = false;  // 전투 종료(승/패 확정) 플래그 — true가 되면 남은 연타나 후속 효과를 즉시 중단
    this.statuses = new StatusManager(this);
    this.player = new Entity('토끼기사', 150, true);
    this.enemy = new Entity('적', 100, false);

    // UI(AppUI) 및 스토리 진행기(StorySequencer)와 연결되는 이벤트 콜백 슬롯
    this.onLogCallback = null;
    this.onRenderCallback = null;
    this.onCardPlayedCallback = null;
    this.onCombatEndCallback = null;

    // 몽중몽 2막 보스용
    this.isEnemyTurn = false;      // 페이즈 전환 시 다음 패턴 턴 계산용
    this.phaseJustChanged = false; // 1막 종료 시 진행 중이던 다단히트 공격 중단용
  }

  log(msg, cls = '') { this.emitLog(msg, cls); }
  emitLog(msg, cls = '') { if (this.onLogCallback) this.onLogCallback(msg, cls); }
  notifyRender() { if (this.onRenderCallback) this.onRenderCallback(); }
  getOpponent(entity) { return entity === this.player ? this.enemy : this.player; }

  // CardDB 원본 정의를 바탕으로 전투용 카드 인스턴스 복제 생성
  createCardInstance(cardId, freeCost = false) {
    const def = CardDB[cardId];
    return {
      uid: `card_${this.uidCounter++}`,
      ...def,
      turnCostOverride: freeCost ? 0 : null, // 이번 턴 고정 코스트 덮어쓰기 (천무지체 등)
      turnCostMod: 0                         // 이번 턴 상대적 코스트 증감치 (적응형 두뇌, 토끼시종의 부름 등)
    };
  }

  // 카드의 현재 실전 코스트 계산: 기본값/덮어쓰기 -> 임시 증감 -> 카드 자체 조건 -> 패시브(유물/특성) 순
  getEffectiveCost(user, card) {
    let cost = card.turnCostOverride != null ? card.turnCostOverride : card.cost;
    cost += (card.turnCostMod || 0);
    if (card.modifySelfCost) cost = card.modifySelfCost(cost, this, user);
    user.getPassives().forEach(({ def, inst }) => {
      if (def.modifyCardCost) cost = def.modifyCardCost(cost, card, this, user, inst);
    });
    return Math.max(0, cost);
  }

  // 카드의 현재 실전 타수 계산 ([의념:토끼의 투지] 등 타수 증가 효과 반영)
  getEffectiveHits(user, card) {
    let hits = card.hits || 0;
    const cost = this.getEffectiveCost(user, card);
    user.getPassives().forEach(({ def, inst }) => {
      if (def.modifyHitCount) hits = def.modifyHitCount(hits, card, cost, this, user, inst);
    });
    return hits;
  }

  // 유물 037 온기가 남은 검집용
  notifyGraveyardCardAccess(user, count) {
    if (!user || count <= 0) return;
    user.getPassives().forEach(({ def, inst }) => {
      if (def.onGraveyardCardAccess) def.onGraveyardCardAccess(this, user, count, inst);
    });
  }

  /**
   * 적의 이번 턴 행동 결정 및 상태이상(난투, 뇌진탕) 봉인 판정
   * - 원래 예정된 행동이 '난투(마법 금지)'에 막히면, 패턴 주기 내에서 가장 가까운 비마법 행동으로 자동 대체
   * - '뇌진탕(모든 행동 금지)'이거나 대체할 비마법 행동이 없으면 행동 봉인 상태로 반환
   */
  resolveEnemyAction(turn, enemy, player) {
    const enemyDef = EnemyDB[enemy.enemyId];
    if (!enemyDef) return null;

    const passives = enemy.getPassives();
    const findBlocker = (act) => passives.find(
      ({ def, inst }) => def.canPlayCard && !def.canPlayCard(act, this, enemy, inst)
    );

    // 1. 이번 턴 원래 예정된 행동 확인
    const primaryAction = enemyDef.getAction(turn, this, enemy, player);
    if (primaryAction.ignoreBlockers) {
      return { action: primaryAction, blocker: null, isFallback: false };
    }

    const primaryBlocker = findBlocker(primaryAction);
    if (!primaryBlocker) {
      return { action: primaryAction, blocker: null, isFallback: false };
    }

    // 전용 대체 행동(예: 천하인 봉인 시 강경책)이 지정된 경우 최우선 적용
    if (primaryAction.fallbackAction) {
      const fb = primaryAction.fallbackAction;
      if (fb.ignoreBlockers || !findBlocker(fb)) {
        return {
          action: fb,
          blocker: primaryBlocker,
          isFallback: true,
          originalName: primaryAction.name
        };
      }
    }

    // 2. 예정 행동이 봉인되었다면(예: 난투로 MAGIC 차단), 이후 최대 12턴 패턴을 탐색해 실행 가능한 대체 행동 선택
    for (let offset = 1; offset <= 12; offset++) {
      const altAction = enemyDef.getAction(turn + offset, this, enemy, player);
      if (!findBlocker(altAction)) {
        return {
          action: altAction,
          blocker: primaryBlocker,
          isFallback: true,
          originalName: primaryAction.name
        };
      }
    }

    // 3. 뇌진탕이거나 모든 패턴이 봉인된 경우 행동 불가 반환
    return { action: primaryAction, blocker: primaryBlocker, isFallback: false };
  }

  // 대상 초상화 박스에 5색 테두리/흔들림 연출 요청
  emitFx(targetEntity, fxClass) {
    if (this.onFxCallback && targetEntity) {
      this.onFxCallback(targetEntity === this.player ? 'box-player' : 'box-enemy', fxClass);
    }
  }

  /**
   * 다단히트 물리 공격 실행기
   * - 타수(hits)만큼 반복하며 매 타격마다 개별 DamagePacket을 생성해 dealDamage로 전달
   * - 적 공격일 경우 10층 단위 티어 보너스(+3씩) 가산, 플레이어일 경우 도금이빨/숫돌 등 타격 보너스 적용
   * - 보스 2막 전환 시 오류 방지
   */
  executeAttack(user, target, damageOrFn, currentCard = this.activeCard, explicitHits = null, onEachHit = null) {
    const isCardAttack = user === this.player && currentCard;
    const hits = explicitHits !== null
      ? explicitHits
      : (isCardAttack ? this.getEffectiveHits(user, currentCard) : 1);

    this.phaseJustChanged = false;
    for (let i = 0; i < hits; i++) {
      if (this.combatEnded || this.phaseJustChanged) break;
      let dmg = typeof damageOrFn === 'function' ? damageOrFn() : damageOrFn;
      if (!user.isPlayer && user.tierDamageBonus) {
        dmg += user.tierDamageBonus;
      }
      user.getPassives().forEach(({ def, inst }) => {
        if (def.modifyAttackHitDamage) {
          dmg = def.modifyAttackHitDamage(dmg, i, hits, currentCard, this, user, inst);
        }
      });
      this.dealDamage(new DamagePacket({
        source: user, target, amount: dmg,
        type: DAMAGE_TYPE.PHYSICAL, isStrike: true,
        reason: `${isCardAttack ? currentCard.name : user.name} (${i + 1}/${hits}타)`
      }));
      if (onEachHit && !this.combatEnded && !this.phaseJustChanged) {
        onEachHit(i, hits, dmg);
      }
    }
  }

  // 대상 초상화 위에 떠오르는 데미지/회복/상태이상 플로팅 텍스트 요청
  emitFloatingText(targetEntity, text, colorClass) {
    if (this.onFloatingTextCallback && targetEntity) {
      this.onFloatingTextCallback(targetEntity === this.player ? 'box-player' : 'box-enemy', text, colorClass);
    }
  }

  /**
   * [핵심 데미지 처리 파이프라인]
   * 모든 물리 공격, 상태이상 도트, 체력 상실 피해가 반드시 통과하는 8단계 연산 순서
   */
  dealDamage(packet) {
    if (this.combatEnded) return;
    const { source, target } = packet;

    // 1단계: 직접 타격 직전 공격자 훅 (예: [독검] 추가 피해 발동)
    if (packet.isStrike && source) {
      source.getPassives().forEach(({ def, inst }) => {
        if (def.onBeforeStrike) def.onBeforeStrike(this, source, target, packet, inst);
      });
    }

    // 2단계: 공격자의 주는 피해 변조 (예: [실명] 시 물리 피해를 0으로 만들고 missed = true 처리)
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && source) {
      source.getPassives().forEach(({ def, inst }) => {
        if (def.modifyOutgoingDamage) def.modifyOutgoingDamage(packet, this, source, inst);
      });
    }

    // 3단계: 피격자의 받는 피해 변조 (예: [인내]가 물리 피해 흡수, [안개얼음성채]가 피해 -25 차감)
    if (packet.type !== DAMAGE_TYPE.HP_LOSS) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.modifyIncomingDamage) def.modifyIncomingDamage(packet, this, target, inst);
      });
    }

    // 4단계: 방어도 차감 전 유효 피해량 확정 시 반응 (예: [바바야가] 피해 누적, [전화위복] 드로우)
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && packet.amount > 0) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onDamageTaken) def.onDamageTaken(this, target, packet, inst);
      });
    }

    // 5단계: 방어도(armor) 우선 차감 (HP_LOSS 유형은 방어도를 무시함)
    let unblocked = packet.amount;
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && target.armor > 0 && unblocked > 0) {
      const absorbed = Math.min(target.armor, unblocked);
      target.armor -= absorbed;
      unblocked -= absorbed;
      packet.logs.push(`방어도(-${absorbed})`);
      this.emitFloatingText(target, `방어 ${absorbed}`, 'fct-white');
    }

    // 6단계: 잔여 피해만큼 실제 HP 차감 및 시각 이펙트·전투 로그 출력
    const prevHp = target.hp;
    target.hp = Math.max(0, target.hp - unblocked);
    const actualLost = prevHp - target.hp;

    if (actualLost > 0) {
      this.emitFloatingText(target, `-${actualLost}`, 'fct-red');
    }
    if (actualLost > 0 || packet.amount > 0) {
      this.emitFx(target, 'fx-red');
    }

    const note = packet.logs.length ? ` [${packet.logs.join(', ')}]` : '';
    this.emitLog(`💥 [${packet.reason}] ${target.name}에게 ${packet.baseAmount} -> 실제 HP -${actualLost} (남은 HP: ${target.hp})${note}`, 'log-hit');

    // 7단계: 실제 HP가 1 이상 감소했을 때의 반응 ([재생], [설리반], [보험], [언데드] 부활, [늑대 마스크] 흡혈)
    if (actualLost > 0) {
      if (target === this.player) {
        target.lastHitReason = packet.reason || '불명'; // 패배 시 사망 원인 기록용 갱신
      }
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onHpDecreased) def.onHpDecreased(this, target, actualLost, inst);
      });
      const opp = this.getOpponent(target);
      if (opp && opp.hp > 0) {
        opp.getPassives().forEach(({ def, inst }) => {
          if (def.onOpponentHpDecreased) def.onOpponentHpDecreased(this, opp, target, actualLost, inst);
        });
      }
    }

    // 8단계: 빗나가지 않은 직접 타격 피격 후 반응 (피격 횟수 누적, [도깨비바늘] 반격, [불굴의 털], [피 묻은 붕대])
    // ※ [045 피해망상]은 자해 타격이지만 paranoiaRedirect 플래그를 통해 예외적으로 반격 트리거를 허용함
    if (packet.isStrike && (source !== target || packet.paranoiaRedirect)) {
      target.runTrackers.hitTakenCount += 1;
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onAfterBeStruck) def.onAfterBeStruck(this, target, source, packet, inst);
      });
    }

    this.notifyRender();
    this.checkCombatEnd();

    // 영구 인내(책임자 등)가 400 이상 누적되면 즉시 400 상태이상 피해 폭발 후 초과분 이월
    if (packet.patienceOverflowInst && !this.combatEnded && target.hp > 0) {
      const pInst = packet.patienceOverflowInst;
      while (pInst.accumulated >= 400 && !this.combatEnded && target.hp > 0) {
        pInst.accumulated -= 400;
        this.emitLog(`💥 [인내 과부하] ${target.name}의 인내 누적치가 400에 도달해 폭발합니다! (이월 잔여: ${pInst.accumulated})`, 'log-hit');
        this.dealDamage(new DamagePacket({
          source: null, target, amount: 400,
          type: DAMAGE_TYPE.STATUS, isStrike: false,
          reason: '인내 과부하(400)'
        }));
      }
    }
  }

  // 방어도 획득 처리 (빙하코트 +5 등 획득량 변조 패시브 적용)
  gainArmor(target, amount, reason) {
    let finalAmount = amount;
    if (finalAmount > 0 && target) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.modifyArmorGained) finalAmount = def.modifyArmorGained(finalAmount, this, target, inst);
      });
    }
    target.armor += finalAmount;
    this.emitFx(target, 'fx-blue');
    this.emitFloatingText(target, `🛡️+${finalAmount}`, 'fct-blue');
    this.emitLog(`🛡️ [${reason}] ${target.name} 방어도 +${finalAmount} (현재:${target.armor})`, 'log-sys');
    this.notifyRender();
  }

  // 양측의 HP를 확인하여 0 이하인 쪽이 있으면 승패 확정 콜백 호출
  checkCombatEnd() {
    if (this.combatEnded || !this.onCombatEndCallback) return;
    if (this.enemy.maxHp > 0 && this.enemy.hp <= 0) {
      const enemyDef = EnemyDB[this.enemy.enemyId];
      if (enemyDef && enemyDef.onBeforeDeath && enemyDef.onBeforeDeath(this, this.enemy, this.player)) {
        this.phaseJustChanged = true;
        return;
      }
      this.combatEnded = true;
      this.emitLog(`🏆 [전투 승리] ${this.enemy.name} 처치!`, 'log-sys');
      this.onCombatEndCallback(true);
    } else if (this.player.hp <= 0) {
      this.combatEnded = true;
      this.emitLog(`💀 [전투 패배] 토끼기사가 쓰러졌습니다...`, 'log-hit');
      this.onCombatEndCallback(false);
    }
  }

  // 체력 회복 처리 (최대 HP 초과 불가)
  heal(target, amount, reason) {
    const prev = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + amount);
    const actualHealed = target.hp - prev;

    this.emitFx(target, 'fx-green');
    if (actualHealed > 0) {
      this.emitFloatingText(target, `💚+${actualHealed}`, 'fct-green');
    }
    this.emitLog(`💚 [${reason}] ${target.name} HP +${actualHealed} 회복`, 'log-sys');
    this.notifyRender();
  }

  // 활력(AP) 회복 처리 (최대 활력 상한 초과 불가)
  recoverEnergy(user, amount) {
    user.energy = Math.min(user.maxEnergy, user.energy + amount);
    this.emitFx(user, 'fx-yellow');
    this.emitLog(`⚡ ${user.name} 활력 +${amount} (현재:${user.energy}/${user.maxEnergy})`, 'log-sys');
    this.notifyRender();
  }

  // 덱에서 count장만큼 손패로 드로우 (덱이 비면 묘지를 무작위로 섞어 덱으로 리필)
  drawCards(user, count) {
    for (let i = 0; i < count; i++) {
      if (!user.deck.length) {
        if (!user.graveyard.length) break;
        user.deck = RNG.sampleUnique(user.graveyard, user.graveyard.length);
        user.graveyard = [];
        this.emitLog(`🔄 [묘지 셔플] 묘지를 섞어 덱을 보충했습니다.`, 'log-sys');
      }
      user.hand.push(user.deck.pop());
    }
    this.notifyRender();
  }

  // 덱에서 특정 조건(predicate)에 맞는 카드 1장을 찾아 즉시 손패로 가져옴 ([나팔소리], [환영모자] 등)
  drawSpecificFromDeck(user, predicate, label) {
    const idx = user.deck.findIndex(predicate);
    if (idx !== -1) {
      const [c] = user.deck.splice(idx, 1);
      user.hand.push(c);
      this.emitLog(`🔍 덱에서 [${c.name}] 카드를 뽑았습니다.`, 'log-sys');
    } else {
      this.emitLog(`🔍 덱에 [${label}] 카드가 없습니다.`, 'log-sys');
    }
    this.notifyRender();
  }

  // 카드를 묘지로 이동시키며 임시 코스트 변동을 초기화하고 [008 토끼기사의 지혜] 등 묘지행 트리거 실행
  moveCardToGraveyard(user, card, fromPlay = false) {
    card.turnCostOverride = null;
    card.turnCostMod = 0;
    user.graveyard.push(card);
    if (card.id !== '024') user.combatTrackers.lastGraveyardCard = card;
    if (fromPlay && card.onEnterGraveyardFromPlay) {
      card.onEnterGraveyardFromPlay(this, user, this.getOpponent(user));
    }
  }

  // 플레이어가 손패의 카드를 선택해 실행할 때의 진입점 (사용 제한·활력 체크 -> 코스트 차감 -> 효과 발동 -> 묘지행)
  playCardFromHand(handIndex) {
    if (this.combatEnded) return false;
    const card = this.player.hand[handIndex];
    if (!card) return false;

    const blocked = this.player.getPassives().some(({ def, inst }) => def.canPlayCard && !def.canPlayCard(card, this, this.player, inst));
    if (blocked) {
      this.emitLog(`❌ 상태이상(난투 등)으로 인해 [${card.name}] 카드를 사용할 수 없습니다!`, 'log-hit');
      return false;
    }

    const cost = this.getEffectiveCost(this.player, card);
    if (this.player.energy < cost) {
      this.emitLog(`❌ 활력이 부족합니다. (필요: ${cost}, 현재: ${this.player.energy})`, 'log-hit');
      return false;
    }

    this.player.energy -= cost;
    this.player.hand.splice(handIndex, 1);
    this.player.combatTrackers.lastPlayedCard = card; // 👈 [멸문지화] 대상 추적
    this.emitLog(`🃏 [카드 발동] ${this.player.name} -> [${card.name}]`, 'log-sys');

    this.skipGraveyardAfterReset = false; // 👈 추가
    this.resolveCardEffect(card, this.player, this.enemy, false);
    if (!card.excludeOnPlay && !this.skipGraveyardAfterReset) { // 👈 조건 추가
      this.moveCardToGraveyard(this.player, card, true);
    }
    this.notifyRender();

    if (this.onCardPlayedCallback) this.onCardPlayedCallback(card);
    return true;
  }

  // 카드의 실제 효과를 실행하고, 카드 사용 완료 훅(도금당근, 녹슨 징, 호박가면, 말린 당근 조각)을 호출
  resolveCardEffect(card, user, target, isReplay = false) {
    if (this.replayDepth > 3) return; // 끼토산/금고 등 연속 재사용 무한 루프 방지
    if (isReplay) this.replayDepth++;
    const prev = this.activeCard;
    this.activeCard = card;
    card.play(this, user, target, isReplay);

    user.getPassives().forEach(({ def, inst }) => {
      if (def.onCardPlayed) def.onCardPlayed(this, user, card, target, isReplay, inst);
    });

    this.activeCard = prev;
    if (isReplay) this.replayDepth--;
  }

  /**
   * [플레이어 턴 시작 시퀀스]
   * 1) 잔여 활력 이월 + 기본 3 회복 -> 2) 시전자 턴 시작 기준 디버프(난투/실명) 및 바바야가 감소
   * -> 3) 턴 시작 패시브(망토, 전술 도약, 채권자 등) -> 4) 기본 3장 드로우 -> 5) 드로우 후 패시브(천무지체, 적응형 두뇌, 탐욕스런 앞니)
   */
  startPlayerTurn() {
    this.isEnemyTurn = false;
    this.phaseJustChanged = false;

    if (this.combatEnded) return;
    this.emitLog(` [${this.turn}턴: 토끼기사의 차례] `, 'log-sys');

    const carryOver = Math.min(this.player.maxCarryOver, this.player.energy);
    let recovery = 3;
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.modifyEnergyRecovery) recovery = def.modifyEnergyRecovery(recovery, this, this.player, inst);
    });
    this.player.energy = Math.min(this.player.maxEnergy, carryOver + recovery);

    [this.player, this.enemy].forEach(ent => {
      [...ent.statuses].forEach(s => {
        const def = StatusDB[s.id];
        if (def.decayTiming === DECAY_TIMING.CASTER_TURN_START && s.caster === this.player) {
          if (def.category === STATUS_CATEGORY.DEBUFF) this.statuses.tryDecayDebuff(ent, s, 1);
          else this.statuses.changeStacks(ent, s, -1, 'DISPEL');
        }
        if (ent === this.player && def.onOwnerTurnStart) {
          def.onOwnerTurnStart(this, ent, s);
        }
      });
    });

    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.onPlayerTurnStart) def.onPlayerTurnStart(this, this.player, this.turn, inst);
    });

    this.drawCards(this.player, 3);

    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.onPlayerTurnPostDraw) def.onPlayerTurnPostDraw(this, this.player, this.turn, inst);
    });

    this.notifyRender();
  }

  /**
   * [턴 종료 및 적 턴 일괄 진행 시퀀스]
   * 1) 남은 손패 전부 묘지로 버림 -> 2) 플레이어 턴 종료 유물 훅(센마의 털옷) -> 3) 플레이어 턴 종료 상태이상(저주/출혈/착란/인내)
   * -> 4) 플레이어 의념(투지/전화위복/성채/구도자) 차감 -> 5) 적 턴 시작 상태이상(적 바바야가 폭발, 적이 건 난투/실명 감소)
   * -> 6) 적 행동 실행 -> 7) 적 턴 종료 상태이상 처리 -> 8) 다음 턴(turn + 1) 플레이어 턴 시작
   */
  endPlayerTurn() {
    if (this.combatEnded) return;
    while (this.player.hand.length > 0) {
      const card = this.player.hand.pop();
      card.turnCostOverride = null;
      this.moveCardToGraveyard(this.player, card, false);
    }

    this.player.getPassives().forEach(({ def, inst }) => {
      if (!this.combatEnded && def.onPlayerTurnEnd) def.onPlayerTurnEnd(this, this.player, this.turn, inst);
    });

    this.processTurnEndStatuses(this.player);
    if (this.combatEnded) return;

    [...this.player.statuses].forEach(s => {
      if (StatusDB[s.id].decayTiming === DECAY_TIMING.PLAYER_TURN_END_CONTEXT) {
        const drop = (s.id === 'CTX_FIGHTING_SPIRIT') ? -s.stacks : -1;
        this.statuses.changeStacks(this.player, s, drop, 'REMOVE');
      }
    });

    this.isEnemyTurn = true;

    this.emitLog(` [${this.turn}턴: ${this.enemy.name} 차례] `, 'log-sys');
    [this.player, this.enemy].forEach(ent => {
      [...ent.statuses].forEach(s => {
        const def = StatusDB[s.id];
        if (def.decayTiming === DECAY_TIMING.CASTER_TURN_START && s.caster === this.enemy) {
          if (def.category === STATUS_CATEGORY.DEBUFF) this.statuses.tryDecayDebuff(ent, s, 1);
          else this.statuses.changeStacks(ent, s, -1, 'DISPEL');
        }
        if (ent === this.enemy && def.onOwnerTurnStart) {
          def.onOwnerTurnStart(this, ent, s);
        }
      });
    });
    if (this.combatEnded) return;

    const resolved = this.resolveEnemyAction(this.turn, this.enemy, this.player);
    if (resolved) {
      if (resolved.blocker && !resolved.isFallback) {
        this.emitLog(`🚫 [${resolved.blocker.def.name}] 효과로 인해 ${this.enemy.name}의 [${resolved.action.name}] 행동이 봉인되었습니다!`, 'log-hit');
      } else if (resolved.isFallback) {
        this.emitLog(`💢 [${resolved.blocker.def.name}] 마법 봉인! ${this.enemy.name}이(가) [${resolved.originalName}] 대신 '${resolved.action.name}' 발동!`, 'log-hit');
        resolved.action.execute();
      } else {
        this.emitLog(`👾 [${this.enemy.name}] '${resolved.action.name}' 발동!`, 'log-hit');
        resolved.action.execute();
      }
    }
    if (this.combatEnded) return;

    this.processTurnEndStatuses(this.enemy);
    if (this.combatEnded) return;

    this.turn += 1;
    this.startPlayerTurn();
  }

  // 턴 종료 시 발동하는 상태이상 처리 ([계약]이 항상 맨 마지막에 차감되도록 정렬하여 다른 디버프 감소 방어 보장)
  processTurnEndStatuses(entity) {
    const sorted = [...entity.statuses].sort((a, b) => (a.id === 'CONTRACT' ? 1 : b.id === 'CONTRACT' ? -1 : 0));
    sorted.forEach(s => {
      if (this.combatEnded) return;
      const def = StatusDB[s.id];
      if (def.onOwnerTurnEnd) def.onOwnerTurnEnd(this, entity, s);
    });
  }
}

/**
 * ============================================================================
 * 6. RogueManager (기사도 로그라이크 모드 진행 · 층 이동 · 보상 관리자)
 * - 흐름: 새 런 시작 -> 0층 초기 특성 3택 1 -> 출발 보급 카드 3장 선택
 *         -> 갈림길 선택(일반/엘리트/캠프/보스) -> 전투 또는 캠프 -> 보상 정산 -> 다음 층(advanceFloor) 반복
 * ============================================================================
 */
const RogueManager = {
  STARTER_DECK: ['001', '001', '001', '010', '010', '010', '005', '002', '011'], // 고정 기본 덱 9장
  MIN_DECK_SIZE: 9,        // 캠프 카드 제거 시 유지해야 하는 최소 덱 매수
  BASE_MAX_DECK_SIZE: 21,  // 기본 최대 덱 상한 ([003 학자안경] 보유 시 24장으로 확장)
  NORMAL_MAX_FLOOR: 50, // 1~50층 일반 구간 상한 고정 (51층부터 몽중몽)

  // 현재 진행 중인 로그라이크 런의 런타임 상태
  state: {
    active: false, floor: 1, hp: 150, maxHp: 150, hitTakenCount: 0,
    deck: [], relics: [], traits: [], clearedBosses: [],
    relic015Wins: 0,
    runLog: [],
    deathCause: '',
    dreamUnlocked: false,
    dreamStars: 0
  },
  currentPaths: [], // 현재 층 갈림길에 제시된 방 유형 목록 (예: ['NORMAL', 'ELITE', 'CAMP'])
  rewardQueue: [],  // 전투 승리 후 순차적으로 처리할 보상 대기열 (카드 -> 유물 -> 특성 순)
  pendingDreamAnchorUpdate: false, // 몽중몽 보스 격파 후 보상 정산이 끝나면 체크포인트 갱신

  // 노말모드 기사도 최대 층
  getMaxFloor() {
    return this.NORMAL_MAX_FLOOR;
  },

  // 몽중몽 최대 층
  isDreamMode() {
    return this.state.floor > this.NORMAL_MAX_FLOOR;
  },

  // 현재 스펙을 콜드슬립 체크포인트에 저장 (51층 최초 진입 및 몽중몽 보스 격파 직후 호출)
  saveDreamAnchor() {
    this.state.dreamUnlocked = true;
    SaveLedger.set('dream.unlocked', true);
    SaveLedger.set('dream.anchor.floor', this.state.floor);
    SaveLedger.set('dream.anchor.hp', this.state.hp);
    SaveLedger.set('dream.anchor.maxHp', this.state.maxHp);
    SaveLedger.set('dream.anchor.hitTakenCount', this.state.hitTakenCount);
    SaveLedger.set('dream.anchor.deck', this.state.deck.join(','));
    SaveLedger.set('dream.anchor.relics', this.state.relics.join(','));
    SaveLedger.set('dream.anchor.traits', this.state.traits.join(','));
  },

  // 몽중몽 패배 시 콜드슬립 스냅샷으로 상태 복원 (runLog와 deathCause는 유지)
  restoreFromDreamAnchor() {
    const parseList = (str) => String(str || '').split(',').map(s => s.trim()).filter(Boolean);
    const anchorFloor = Number(SaveLedger.get('dream.anchor.floor')) || (this.NORMAL_MAX_FLOOR + 1);
    const savedDeck = parseList(SaveLedger.get('dream.anchor.deck'));

    this.state.active = true;
    this.state.floor = anchorFloor;
    this.state.hp = Number(SaveLedger.get('dream.anchor.hp')) || 150;
    this.state.maxHp = Number(SaveLedger.get('dream.anchor.maxHp')) || 150;
    this.state.hitTakenCount = Number(SaveLedger.get('dream.anchor.hitTakenCount')) || 0;
    this.state.deck = savedDeck.length >= this.MIN_DECK_SIZE ? savedDeck : [...this.STARTER_DECK];
    this.state.relics = parseList(SaveLedger.get('dream.anchor.relics'));
    this.state.traits = parseList(SaveLedger.get('dream.anchor.traits'));
    this.state.runLog.push(`💫몽중몽 회귀(${anchorFloor}F)`);
    this.syncToSaveLedger();
    return anchorFloor;
  },

  // 특성을 반영한 현재 최대 덱 상한 계산
  getMaxDeckSize() {
    let max = this.BASE_MAX_DECK_SIZE;
    this.state.traits.forEach(tid => {
      if (TraitDB[tid]?.modifyMaxDeckSize) max = TraitDB[tid].modifyMaxDeckSize(max);
    });
    return max;
  },

  // 특성을 반영한 전투 승리 카드 보상 선택지 개수 계산 (기본 3택 1, 학자안경 시 4택 1)
  getRewardCardChoiceCount() {
    let cnt = 3;
    this.state.traits.forEach(tid => {
      if (TraitDB[tid]?.modifyRewardCardChoices) cnt = TraitDB[tid].modifyRewardCardChoices(cnt);
    });
    return cnt;
  },

  hasRelic(id) { return this.state.relics.includes(id); },
  hasTrait(id) { return this.state.traits.includes(id); },

  // 현재 런 상태를 SaveLedger(텍스트 세이브)에 동기화 저장
  syncToSaveLedger() {
    SaveLedger.set('roguelike.active', this.state.active);
    SaveLedger.set('roguelike.floor', this.state.floor);
    SaveLedger.set('roguelike.hp', this.state.hp);
    SaveLedger.set('roguelike.maxHp', this.state.maxHp);
    SaveLedger.set('roguelike.hitTakenCount', this.state.hitTakenCount);
    SaveLedger.set('roguelike.deck', this.state.deck.join(','));
    SaveLedger.set('roguelike.relics', this.state.relics.join(','));
    SaveLedger.set('roguelike.traits', this.state.traits.join(','));
    SaveLedger.set('roguelike.clearedBosses', this.state.clearedBosses.join(','));
    SaveLedger.set('roguelike.relic015Wins', this.state.relic015Wins);
    SaveLedger.set('roguelike.runLog', this.state.runLog.join(' > '));
    SaveLedger.set('roguelike.deathCause', this.state.deathCause);
    SaveLedger.set('dream.unlocked', this.state.dreamUnlocked);
    SaveLedger.set('dream.stars', this.state.dreamStars);
  },

  // SaveLedger에 기록된 텍스트 데이터를 불러와 RogueManager.state에 복원
  loadFromSaveLedger() {
    const parseList = (str) => String(str || '').split(',').map(s => s.trim()).filter(Boolean);
    this.state.active = Boolean(SaveLedger.get('roguelike.active'));
    this.state.floor = Number(SaveLedger.get('roguelike.floor')) || 1;
    this.state.hp = Number(SaveLedger.get('roguelike.hp')) || 150;
    this.state.maxHp = Number(SaveLedger.get('roguelike.maxHp')) || 150;
    this.state.hitTakenCount = Number(SaveLedger.get('roguelike.hitTakenCount')) || 0;
    const savedDeck = parseList(SaveLedger.get('roguelike.deck'));
    this.state.deck = savedDeck.length >= this.MIN_DECK_SIZE ? savedDeck : [...this.STARTER_DECK];
    this.state.relics = parseList(SaveLedger.get('roguelike.relics'));
    this.state.traits = parseList(SaveLedger.get('roguelike.traits'));
    this.state.clearedBosses = parseList(SaveLedger.get('roguelike.clearedBosses'));
    this.state.relic015Wins = Number(SaveLedger.get('roguelike.relic015Wins')) || 0;
    const rawLog = String(SaveLedger.get('roguelike.runLog') || '').trim();
    this.state.runLog = rawLog ? rawLog.split(' > ').map(s => s.trim()).filter(Boolean) : [];
    this.state.deathCause = String(SaveLedger.get('roguelike.deathCause') || '');
    this.state.dreamUnlocked = Boolean(SaveLedger.get('dream.unlocked'));
    this.state.dreamStars = Number(SaveLedger.get('dream.stars')) || 0;
  },

  // [새 기사도 시작] 상태 초기화 후 0층 초기 특성 선택 화면으로 진입
  startNewRun() {
    this.pendingDreamAnchorUpdate = false;
    this.state = {
      active: true, floor: 1, hp: 150, maxHp: 150, hitTakenCount: 0,
      deck: [...this.STARTER_DECK], relics: [], traits: [], clearedBosses: [],
      relic015Wins: 0,
      runLog: [],
      deathCause: '',
      dreamUnlocked: false,
      dreamStars: 0
    };
    SaveLedger.set('dream.anchor.floor', this.NORMAL_MAX_FLOOR + 1);
    SaveLedger.set('dream.anchor.hp', 150);
    SaveLedger.set('dream.anchor.maxHp', 150);
    SaveLedger.set('dream.anchor.hitTakenCount', 0);
    SaveLedger.set('dream.anchor.deck', '');
    SaveLedger.set('dream.anchor.relics', '');
    SaveLedger.set('dream.anchor.traits', '');
    this.syncToSaveLedger();
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    this.renderStartingTraitSelection();
  },

  // [기사도 이어하기] 세이브 데이터 로드 후 미완료된 초기 세팅 단계 또는 현재 층 갈림길로 복귀
  continueFromSave() {
    this.loadFromSaveLedger();
    this.state.active = true;
    AppUI.mode = 'ROGUE_HUB';
    AppUI.go('screen-choice');
    if (this.state.traits.length === 0 && this.state.floor === 1) {
      this.renderStartingTraitSelection();
    } else if (this.state.deck.length < 12 && this.state.floor === 1) {
      const currentStep = (this.state.deck.length - this.STARTER_DECK.length) + 1;
      this.renderStartingCardDraft(Math.max(1, currentStep), 3);
    } else {
      this.enterHubForCurrentFloor();
    }
  },

  // 무작위 특성 3종을 제시해 1개를 고르는 초기 특성 화면 렌더링
  renderStartingTraitSelection() {
    const offeredIds = RNG.sampleUnique(Object.keys(TraitDB), 3);
    AppUI.setChoiceScreen(
      '🌟 초기 특성 선택 (3택 1)',
      '이번 기사도 여정을 함께할 고유 특성을 1개 선택하십시오.',
      offeredIds.map(tid => {
        const t = TraitDB[tid];
        return {
          title: `🧬 [${t.id}] ${t.name}`,
          desc: t.desc,
          borderColor: 'var(--fx-blue)',
          onClick: () => this.pickStartingTrait(tid)
        };
      })
    );
  },

  // 선택한 초기 특성을 적용(최대 HP 증감 등 즉시 효과 포함)하고 출발 보급 3장 선택으로 전환
  pickStartingTrait(traitId) {
    if (!this.hasTrait(traitId)) {
      this.state.traits.push(traitId);
      if (TraitDB[traitId]?.onAcquire) TraitDB[traitId].onAcquire(this.state);
    }
    this.syncToSaveLedger();
