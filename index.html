<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Sir Mad Boomer: Rabbit Knight - v0.73</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', monospace, sans-serif;
      background: #13141c; color: #c0caf5;
      margin: 0; padding: 14px;
      display: flex; flex-direction: column; align-items: center;
    }
    .app-container { width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 12px; }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
      background: #1a1b26; border: 1px solid #414868; padding: 10px 16px; border-radius: 6px;
    }
    .header-bar h1 { margin: 0; font-size: 17px; color: #7aa2f7; }
    button {
      background: #292e42; color: #c0caf5; border: 1px solid #565f89;
      padding: 7px 13px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12.5px;
    }
    button:hover:not(:disabled) { border-color: #7aa2f7; color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #7aa2f7; color: #13141c; border-color: #7aa2f7; }
    button.primary:hover:not(:disabled) { background: #89ddff; }
    button.danger { background: #f7768e; color: #13141c; border-color: #f7768e; }
    .hidden { display: none !important; }

    /* 로비 뷰 */
    .lobby-view { display: flex; gap: 12px; flex-wrap: wrap; }
    .lobby-col {
      flex: 1; min-width: 290px; background: #1a1b26; border: 1px solid #414868;
      border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .lobby-col h2 { margin: 0; font-size: 15px; color: #e0af68; border-bottom: 1px solid #292e42; padding-bottom: 6px; }
    textarea.save-io {
      width: 100%; height: 190px; background: #111218; color: #9ece6a;
      border: 1px solid #414868; border-radius: 4px; padding: 8px;
      font-family: monospace; font-size: 11.5px; resize: vertical;
    }
    .chapter-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #24283b; border: 1px solid #414868; padding: 10px 12px; border-radius: 4px;
    }

    /* 로그라이크 상단 상태바 */
    .rogue-hud {
      background: #1f2335; border: 1px solid #565f89; border-radius: 6px;
      padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .rogue-hud-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-weight: bold; font-size: 13.5px; }
    .rogue-subpanel {
      background: #1a1b26; border: 1px solid #414868; border-radius: 6px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .rogue-subpanel h2 { margin: 0; font-size: 16px; color: #e0af68; }
    .choice-grid { display: flex; gap: 12px; flex-wrap: wrap; }
    .choice-card {
      flex: 1; min-width: 210px; background: #24283b; border: 1px solid #565f89;
      border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
      cursor: pointer; transition: 0.12s;
    }
    .choice-card:hover { border-color: #7aa2f7; transform: translateY(-2px); }

    /* 전투 & 비주얼노벨 스테이지 뷰 */
    .stage-view { display: flex; flex-direction: column; gap: 12px; }
    .vn-stage-box {
      background: #1a1b26; border: 1px solid #414868; border-radius: 6px;
      padding: 14px; display: flex; flex-direction: column; gap: 12px;
    }
    .standing-row { display: flex; justify-content: space-between; align-items: stretch; gap: 14px; min-height: 125px; flex-wrap: wrap; }
    .actor-slot {
      flex: 1; min-width: 280px; background: #16161e; border: 1px dashed #414868;
      border-radius: 6px; padding: 12px; display: flex; gap: 12px; align-items: center;
    }
    .sprite-placeholder {
      width: 68px; height: 68px; background: #24283b; border: 1px solid #565f89;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #7dcfff; text-align: center; flex-shrink: 0;
    }
    .actor-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .actor-name { font-weight: bold; color: #e0af68; font-size: 15px; }
    .intent-box {
      display: inline-block; background: #2e2236; border: 1px solid #bb9af7;
      color: #ff9e64; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px;
    }
    .stat-line { display: flex; gap: 12px; font-size: 13px; font-weight: bold; flex-wrap: wrap; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; }
    .badge.buff { background: #1b382c; color: #73daca; border: 1px solid #41a6b5; }
    .badge.debuff { background: #3b2229; color: #f7768e; border: 1px solid #db4b4b; }
    .badge.context { background: #2e2c44; color: #bb9af7; border: 1px solid #9d7cd8; }
    .badge.relic { background: #382e1e; color: #e0af68; border: 1px solid #e0af68; }
    .badge.trait { background: #1e2d3d; color: #7dcfff; border: 1px solid #7dcfff; }

    .vn-dialogue-box {
      background: #111218; border: 2px solid #7aa2f7; border-radius: 6px;
      padding: 14px 16px; min-height: 100px; display: flex; flex-direction: column;
      justify-content: space-between; cursor: pointer; user-select: none;
    }
    .vn-speaker { font-weight: bold; color: #e0af68; font-size: 14px; margin-bottom: 5px; }
    .vn-text { font-size: 13.5px; line-height: 1.5; color: #c0caf5; }
    .vn-next-indicator { align-self: flex-end; font-size: 12px; color: #7aa2f7; margin-top: 6px; }
    .vn-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .vn-choice-btn { text-align: left; background: #1f2335; border: 1px solid #7aa2f7; padding: 8px 12px; }

    .combat-board { display: flex; gap: 12px; flex-wrap: wrap; }
    .hand-panel {
      flex: 1.3; min-width: 320px; background: #1a1b26; border: 1px solid #414868;
      border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .hand-header { display: flex; justify-content: space-between; align-items: center; }
    .hand-panel h3, .log-panel h3 { margin: 0; font-size: 14px; color: #7aa2f7; }
    .hand-cards { display: flex; gap: 8px; flex-wrap: wrap; min-height: 115px; align-items: stretch; }
    .card {
      background: #24283b; border: 1px solid #7aa2f7; border-radius: 5px;
      padding: 9px; width: 168px; cursor: pointer; transition: 0.12s; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-2px); background: #292e42; }
    .card.disabled { opacity: 0.4; cursor: not-allowed; border-color: #414868; }
    .card-cost {
      float: right; background: #7aa2f7; color: #13141c; border-radius: 50%;
      width: 20px; height: 20px; text-align: center; line-height: 20px; font-weight: bold; font-size: 12px;
    }
    .card-title { font-weight: bold; color: #e0af68; font-size: 12.5px; margin-bottom: 3px; }
    .card-meta { font-size: 10.5px; color: #7dcfff; margin-bottom: 5px; }
    .card-desc { font-size: 11px; color: #a9b1d6; line-height: 1.35; }

    .log-panel {
      flex: 1; min-width: 290px; background: #1a1b26; border: 1px solid #414868;
      border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .log-box {
      background: #111218; border: 1px solid #292e42; border-radius: 4px;
      padding: 8px; height: 195px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.45;
    }
    .log-hit { color: #f7768e; }
    .log-sys { color: #7dcfff; }
    .log-status { color: #e0af68; }
    .log-story { color: #9ece6a; }
    .log-passive { color: #bb9af7; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 공통 헤더 -->
  <div class="header-bar">
    <h1>🐰 Sir Mad Boomer: Rabbit Knight <span style="font-size:13px; color:#9ece6a;">v0.73 (티어 가산)</span></h1>
    <div style="display:flex; gap:8px;">
      <button id="btn-toggle-deck" class="hidden" onclick="RogueManager.toggleDeckModal()">덱 확인 / 관리</button>
      <button id="btn-return-lobby" class="hidden" onclick="AppUI.returnToLobby()">세이브 & 로비로</button>
    </div>
  </div>

  <!-- [뷰 1] 메인 로비 화면 -->
  <div id="view-lobby" class="lobby-view">
    <div class="lobby-col">
      <h2>💾 세이브 관리 (SaveLedger)</h2>
      <div style="font-size:12px; color:#a9b1d6;">스토리 진행도 및 로그라이크(기사도) 계승 데이터가 순수 텍스트로 저장됩니다.</div>
      <textarea id="save-textarea" class="save-io" spellcheck="false"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="primary" style="flex:1;" onclick="AppUI.handleSaveImport()">텍스트 불러오기 (Import)</button>
        <button style="flex:1;" onclick="AppUI.refreshSaveTextarea()">현재 상태 내보내기</button>
      </div>
    </div>

    <div class="lobby-col">
      <h2>📖 모드 선택 - 스토리</h2>
      <div style="font-size:12px; color:#a9b1d6;">StoryDB에 등록된 챕터를 재생합니다.</div>
      <div id="story-chapter-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div class="lobby-col">
      <h2>⚔️ 모드 선택 - 로그라이크 (기사도)</h2>
      <div id="rogue-lobby-info" style="font-size:12px; color:#a9b1d6; line-height:1.5;"></div>
      <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
        <button id="btn-rogue-continue" class="primary hidden" onclick="RogueManager.continueFromSave()">저장된 기사도 이어하기 (계승 등반)</button>
        <button class="primary" onclick="RogueManager.startNewRun()">새 기사도 시작 (1층부터)</button>
      </div>
    </div>
  </div>

  <!-- [뷰 2] 로그라이크 진행 허브 (길 선택 / 캠프 / 보상 / 덱 확인) -->
  <div id="view-rogue-hub" class="stage-view hidden">
    <div id="rogue-hud" class="rogue-hud"></div>
    <div id="rogue-content" class="rogue-subpanel"></div>
    <div id="rogue-deck-modal" class="rogue-subpanel hidden"></div>
  </div>

  <!-- [뷰 3] 스테이지 화면 (비주얼 노벨 + 전투 겸용) -->
  <div id="view-stage" class="stage-view hidden">
    <div id="stage-rogue-hud" class="rogue-hud hidden"></div>
    <div class="vn-stage-box">
      <div class="standing-row">
        <div class="actor-slot">
          <div class="sprite-placeholder" id="sprite-player">[도트 슬롯]<br>토끼기사</div>
          <div class="actor-info" id="info-player"></div>
        </div>
        <div class="actor-slot">
          <div class="sprite-placeholder" id="sprite-enemy">[도트 슬롯]<br>적</div>
          <div class="actor-info" id="info-enemy"></div>
        </div>
      </div>

      <!-- 비주얼 노벨 대사창 (스토리 모드 시 표시) -->
      <div id="vn-dialogue-box" class="vn-dialogue-box hidden" onclick="StorySequencer.onUserClickDialogue()">
        <div>
          <div id="vn-speaker" class="vn-speaker"></div>
          <div id="vn-text" class="vn-text"></div>
          <div id="vn-choices" class="vn-choices hidden" onclick="event.stopPropagation()"></div>
        </div>
        <div id="vn-next-hint" class="vn-next-indicator">클릭하여 계속 ▶</div>
      </div>
    </div>

    <!-- 전투 조작 보드 -->
    <div id="combat-board" class="combat-board hidden">
      <div class="hand-panel">
        <div class="hand-header">
          <h3>🃏 플레이어 손패 <span id="hand-guide" style="font-size:12px; color:#e0af68; font-weight:normal;"></span></h3>
          <button id="btn-end-turn" class="primary" onclick="AppUI.engine.endPlayerTurn()">턴 종료</button>
        </div>
        <div id="hand-cards" class="hand-cards"></div>
      </div>
      <div class="log-panel">
        <h3>📜 전투 및 연출 로그</h3>
        <div id="log-box" class="log-box"></div>
      </div>
    </div>
  </div>
</div>

<script>
/**
 * ============================================================================
 * 1. RNG 모듈
 * ============================================================================
 */
const RNG = {
  riggedQueue: [],
  rigNext(val) { this.riggedQueue.push(val); },
  randInt(min, max) {
    if (this.riggedQueue.length > 0) {
      const rigged = this.riggedQueue.shift();
      return Math.max(min, Math.min(max, rigged));
    }
    return Math.floor(Math.random() * (max - min + 1)) + min;
  },
  pickRandom(arr) {
    if (!arr || !arr.length) return null;
    return arr[this.randInt(0, arr.length - 1)];
  },
  sampleUnique(arr, count) {
    const copy = [...arr];
    const out = [];
    while (copy.length > 0 && out.length < count) {
      const idx = this.randInt(0, copy.length - 1);
      out.push(copy.splice(idx, 1)[0]);
    }
    return out;
  },
  reset() { this.riggedQueue = []; }
};

/**
 * ============================================================================
 * 2. SaveLedger (스토리 + 로그라이크 계승 평면 텍스트 세이브)
 * ============================================================================
 */
const SaveLedger = {
  data: {
    'stage_1_1.clear': false,
    'flag.chose_revenge': false,
    'unlocked.cards': '020,013,011',
    'roguelike.active': false,
    'roguelike.floor': 1,
    'roguelike.hp': 150,
    'roguelike.maxHp': 150,
    'roguelike.hitTakenCount': 0,
    'roguelike.deck': '001,001,001,010,010,010,005,005,002,002,011,011',
    'roguelike.relics': '',
    'roguelike.traits': '',
    'roguelike.clearedBosses': ''
  },
  get(key) { return this.data[key]; },
  set(key, value) { this.data[key] = value; },
  exportText() {
    const lines = ['# Sir Mad Boomer Save Data (v0.71)'];
    for (const [k, v] of Object.entries(this.data)) {
      lines.push(`${k} = ${v}`);
    }
    return lines.join('\n');
  },
  importText(rawText) {
    const nextData = {};
    const lines = rawText.split(/\r?\n/);
    for (const rawLine of lines) {
      const cleanLine = rawLine.split('#')[0].trim();
      if (!cleanLine) continue;
      const eqIdx = cleanLine.indexOf('=');
      if (eqIdx === -1) continue;
      const key = cleanLine.slice(0, eqIdx).trim();
      const valStr = cleanLine.slice(eqIdx + 1).trim();
      if (!key) continue;
      if (valStr === 'true') nextData[key] = true;
      else if (valStr === 'false') nextData[key] = false;
      else if (!isNaN(valStr) && valStr !== '' && !valStr.includes(',') && !key.endsWith('deck') && !key.endsWith('relics') && !key.endsWith('traits') && !key.endsWith('cards')) {
        nextData[key] = Number(valStr);
      } else {
        nextData[key] = valStr;
      }
    }
    this.data = { ...this.data, ...nextData };
    return this.data;
  }
};

/**
 * ============================================================================
 * 3. 상수, 유물 6종(RelicDB), 특성 5종(TraitDB), 상태이상(StatusDB)
 * ============================================================================
 */
const EngineConfig = {
  COUNT_REMOVED_BY_STACKS: true,
  COUNT_BUFFS_BY_STACKS: false,
  TRIGGER_GRAVEYARD_EFFECT_ON_REPLAY: true
};

const DAMAGE_TYPE = { PHYSICAL: 'PHYSICAL', STATUS: 'STATUS', HP_LOSS: 'HP_LOSS' };
const STATUS_CATEGORY = { BUFF: 'BUFF', DEBUFF: 'DEBUFF', CONTEXT: 'CONTEXT' };
const DECAY_TIMING = {
  OWNER_TURN_START: 'OWNER_TURN_START',
  OWNER_TURN_END: 'OWNER_TURN_END',
  CASTER_TURN_START: 'CASTER_TURN_START',
  PLAYER_TURN_END_CONTEXT: 'PLAYER_TURN_END_CONTEXT',
  NONE: 'NONE'
};

// 유물 6종 정의
const RelicDB = {
  '001': {
    id: '001', name: '불굴의 털', priority: 20,
    desc: '적에게 피격될 때 방어도 +4 획득',
    onAfterBeStruck: (engine, owner, attacker) => {
      if (attacker && attacker !== owner) {
        engine.emitLog(`🏺 [유물: 불굴의 털] 피격 반응 -> 방어도 +4`, 'log-passive');
        engine.gainArmor(owner, 4, '불굴의 털');
      }
    }
  },
  '002': {
    id: '002', name: '도금당근', priority: 20,
    desc: '마법 카드를 3회 사용할 때마다 활력 +1 회복',
    onInit: (inst) => { inst.state = { count: 0 }; },
    onCardPlayed: (engine, owner, card, target, isReplay, inst) => {
      if (card.type === 'MAGIC') {
        inst.state.count = (inst.state.count || 0) + 1;
        if (inst.state.count >= 3) {
          inst.state.count = 0;
          engine.emitLog(`🏺 [유물: 도금당근] 마법 3회 사용 -> 활력 +1`, 'log-passive');
          engine.recoverEnergy(owner, 1);
        }
      }
    }
  },
  '003': {
    id: '003', name: '회중시계', priority: 20,
    desc: '적에게 착란을 부여할 때 부여 스택 +1 추가',
    modifyStatusAppliedStacks: (stacks, caster, target, statusId) => {
      if (caster !== target && statusId === 'DELIRIUM') return stacks + 1;
      return stacks;
    }
  },
  '004': {
    id: '004', name: '도금이빨', priority: 20,
    desc: '타수 2 이상 공격 카드의 첫 타격 피해 +4',
    modifyAttackHitDamage: (dmg, hitIndex, totalHits, card) => {
      if (card && card.type === 'ATTACK' && totalHits >= 2 && hitIndex === 0) {
        return dmg + 4;
      }
      return dmg;
    }
  },
  '005': {
    id: '005', name: '마도서', priority: 20,
    desc: '일반 전투 승리 시 10% 확률로 유물 보상 추가',
    bonusNormalRelicChance: 10
  },
  '006': {
    id: '006', name: '요람사진', priority: 20,
    desc: '길 선택 시 캠프 확정 등장 (매 10층 보스층 제외)',
    forceCampOnPath: true
  }
};

// 특성 5종 정의
const TraitDB = {
  '001': {
    id: '001', name: '빳빳한 털', priority: 10,
    desc: '최대 HP +50, 층을 오를 때마다 HP 7 회복',
    onAcquire: (runState) => {
      runState.maxHp += 50;
      runState.hp += 50;
    },
    onAdvanceFloor: (runState) => {
      runState.hp = Math.min(runState.maxHp, runState.hp + 7);
    }
  },
  '002': {
    id: '002', name: '전술 도약', priority: 10,
    desc: '매 전투 첫 턴 손패에 스텝 밟기 1장 생성',
    onPlayerTurnStart: (engine, owner, turn) => {
      if (turn === 1) {
        const stepCard = engine.createCardInstance('023');
        stepCard.isTemporary = true;
        owner.hand.push(stepCard);
        engine.emitLog(`🧬 [특성: 전술 도약] 첫 턴 손패에 [스텝 밟기] 1장 생성!`, 'log-passive');
      }
    }
  },
  '003': {
    id: '003', name: '학자안경', priority: 10,
    desc: '전투 보상 카드 선택지 +1개(4택 1) 및 최대 덱 상한 24장으로 증가',
    modifyRewardCardChoices: (count) => count + 1,
    modifyMaxDeckSize: (max) => Math.max(max, 24)
  },
  '004': {
    id: '004', name: '빠른 발굽', priority: 10,
    desc: '최대 활력 5, 이월 상한 2로 증가, 최대 HP -50',
    onAcquire: (runState) => {
      runState.maxHp = Math.max(1, runState.maxHp - 50);
      runState.hp = Math.min(runState.hp, runState.maxHp);
    },
    modifyMaxEnergy: (maxE) => Math.max(maxE, 5),
    modifyMaxCarryOver: (carry) => Math.max(carry, 2)
  },
  '005': {
    id: '005', name: '천무지체', priority: 10,
    desc: '2턴마다 손패 1장 코스트 0 취급',
    onPlayerTurnPostDraw: (engine, owner, turn) => {
      if (turn % 2 === 0 && owner.hand.length > 0) {
        const candidates = owner.hand.filter(c => engine.getEffectiveCost(owner, c) > 0);
        const targetCard = RNG.pickRandom(candidates.length > 0 ? candidates : owner.hand);
        if (targetCard) {

/**
 * ============================================================================
 * 5. 코어 전투 엔진 (CombatEngine, StatusManager, Entity, DamagePacket)
 * ============================================================================
 */
class DamagePacket {
  constructor({ source, target, amount, type = DAMAGE_TYPE.PHYSICAL, isStrike = false, isBonus = false, reason = '' }) {
    this.source = source;
    this.target = target;
    this.baseAmount = amount;
    this.amount = amount;
    this.type = type;
    this.isStrike = isStrike;
    this.isBonus = isBonus;
    this.reason = reason;
    this.logs = [];
  }
}

class Entity {
  constructor(name, maxHp, isPlayer = false) {
    this.name = name;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.armor = 0;
    this.energy = 0;
    this.maxEnergy = 4;
    this.maxCarryOver = 1;
    this.isPlayer = isPlayer;
    this.enemyId = null;
    this.traits = [];
    this.relics = [];
    this.statuses = [];
    this.deck = [];
    this.hand = [];
    this.graveyard = [];
    this.runTrackers = { hitTakenCount: 0 };
    this.combatTrackers = { lastGraveyardCard: null };
  }

  getPassives() {
    const list = [
      ...this.traits.map(t => ({ def: TraitDB[t.id], inst: t })),
      ...this.relics.map(r => ({ def: RelicDB[r.id], inst: r })),
      ...this.statuses.map(s => ({ def: StatusDB[s.id], inst: s }))
    ].filter(x => x.def);
    return list.sort((a, b) => (a.def.priority || 50) - (b.def.priority || 50));
  }
}

class StatusManager {
  constructor(engine) { this.engine = engine; }
  normalizeId(statusId) { return statusId === 'BABAYAGA' ? 'BABA_YAGA' : statusId; }
  get(target, statusId) { return target.statuses.find(s => s.id === this.normalizeId(statusId)); }

  apply(caster, target, rawStatusId, stacks) {
    const statusId = this.normalizeId(rawStatusId);
    const def = StatusDB[statusId];
    if (!def || stacks <= 0) return;

    let finalStacks = stacks;
    if (caster) {
      caster.getPassives().forEach(({ def: pDef, inst }) => {
        if (pDef.modifyStatusAppliedStacks) {
          finalStacks = pDef.modifyStatusAppliedStacks(finalStacks, caster, target, statusId, inst);
        }
      });
    }

    let inst = this.get(target, statusId);
    if (inst) inst.stacks += finalStacks;
    else {
      inst = { id: statusId, stacks: finalStacks, caster, accumulated: 0 };
      if (def.onInit) def.onInit(inst);
      target.statuses.push(inst);
    }
    this.engine.emitLog(`📌 [상태 부여] ${target.name} <- [${def.name} ${finalStacks}] (현재:${inst.stacks})`, 'log-status');
    this.engine.notifyRender();
  }

  setOrMaxContext(target, statusId, durationTurns) {
    let inst = this.get(target, statusId);
    if (inst) inst.stacks = Math.max(inst.stacks, durationTurns);
    else target.statuses.push({ id: statusId, stacks: durationTurns, caster: target });
    this.engine.notifyRender();
  }

  tryDecayDebuff(owner, instance, amount) {
    const hasContract = owner.statuses.some(s => StatusDB[s.id].preventsOtherDebuffDecay && s.id !== instance.id && s.stacks > 0);
    if (hasContract) return;
    this.changeStacks(owner, instance, -amount, 'DISPEL');
  }

  changeStacks(owner, instance, delta, mode = 'DISPEL') {
    instance.stacks += delta;
    if (instance.stacks <= 0) {
      const idx = owner.statuses.indexOf(instance);
      if (idx !== -1) owner.statuses.splice(idx, 1);
      const def = StatusDB[instance.id];
      this.engine.emitLog(`💨 [${mode === 'DISPEL' ? '해제' : '제거'}] ${owner.name}의 [${def.name}] 소멸`, 'log-status');
      if (mode === 'DISPEL' && def.onDispel) def.onDispel(this.engine, owner, instance);
    }
    this.engine.notifyRender();
  }

  dispelRandom(target, category) {
    const cands = target.statuses.filter(s => StatusDB[s.id].category === category);
    if (!cands.length) return;
    const pick = cands[RNG.randInt(0, cands.length - 1)];
    this.changeStacks(target, pick, -pick.stacks, 'DISPEL');
  }

  removeRandom(target, category) {
    const cands = target.statuses.filter(s => StatusDB[s.id].category === category);
    if (!cands.length) return;
    const pick = cands[RNG.randInt(0, cands.length - 1)];
    this.changeStacks(target, pick, -pick.stacks, 'REMOVE');
  }

  removeSpecific(target, statusId) {
    const inst = this.get(target, statusId);
    if (!inst) return 0;
    const s = inst.stacks;
    this.changeStacks(target, inst, -s, 'REMOVE');
    return s;
  }

  removeAll(target, categories) {
    const list = target.statuses.filter(s => categories.includes(StatusDB[s.id].category));
    let removedCount = 0, removedStacks = 0;
    list.forEach(inst => {
      removedCount += 1; removedStacks += inst.stacks;
      this.changeStacks(target, inst, -inst.stacks, 'REMOVE');
    });
    return { removedCount, removedStacks };
  }
}

class CombatEngine {
  constructor() {
    this.uidCounter = 1;
    this.replayDepth = 0;
    this.turn = 1;
    this.combatEnded = false;
    this.statuses = new StatusManager(this);
    this.player = new Entity('토끼기사', 150, true);
    this.enemy = new Entity('적', 100, false);

    this.onLogCallback = null;
    this.onRenderCallback = null;
    this.onCardPlayedCallback = null;
    this.onCombatEndCallback = null;
  }

  log(msg, cls = '') { this.emitLog(msg, cls); }
  emitLog(msg, cls = '') { if (this.onLogCallback) this.onLogCallback(msg, cls); }
  notifyRender() { if (this.onRenderCallback) this.onRenderCallback(); }
  getOpponent(entity) { return entity === this.player ? this.enemy : this.player; }

  createCardInstance(cardId, freeCost = false) {
    const def = CardDB[cardId];
    return { uid: `card_${this.uidCounter++}`, ...def, turnCostOverride: freeCost ? 0 : null };
  }

  getEffectiveCost(user, card) {
    let cost = card.turnCostOverride !== null ? card.turnCostOverride : card.cost;
    if (card.modifySelfCost) cost = card.modifySelfCost(cost, this, user);
    return Math.max(0, cost);
  }

  getEffectiveHits(user, card) {
    let hits = card.hits || 0;
    const cost = this.getEffectiveCost(user, card);
    user.getPassives().forEach(({ def, inst }) => {
      if (def.modifyHitCount) hits = def.modifyHitCount(hits, card, cost, this, user, inst);
    });
    return hits;
  }

  executeAttack(user, target, damageOrFn, currentCard = this.activeCard) {
    const isCardAttack = user === this.player && currentCard;
    const hits = isCardAttack ? this.getEffectiveHits(user, currentCard) : 1;
    for (let i = 0; i < hits; i++) {
      let dmg = typeof damageOrFn === 'function' ? damageOrFn() : damageOrFn;
      // --- 적중 시 티어 보정 공격력 가산 ---
      if (!user.isPlayer && user.tierDamageBonus) {
        dmg += user.tierDamageBonus;
      }
      user.getPassives().forEach(({ def, inst }) => {
        if (def.modifyAttackHitDamage) {
          dmg = def.modifyAttackHitDamage(dmg, i, hits, currentCard, this, user, inst);
        }
      });
      this.dealDamage(new DamagePacket({
        source: user, target, amount: dmg,
        type: DAMAGE_TYPE.PHYSICAL, isStrike: true,
        reason: `${isCardAttack ? currentCard.name : user.name} (${i + 1}/${hits}타)`
      }));
    }
  }

  dealDamage(packet) {
    if (this.combatEnded) return;
    const { source, target } = packet;
    if (packet.isStrike && source) {
      source.getPassives().forEach(({ def, inst }) => {
        if (def.onBeforeStrike) def.onBeforeStrike(this, source, target, packet, inst);
      });
    }
    if (packet.type !== DAMAGE_TYPE.HP_LOSS) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.modifyIncomingDamage) def.modifyIncomingDamage(packet, this, target, inst);
      });
    }
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && packet.amount > 0) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onDamageTaken) def.onDamageTaken(this, target, packet, inst);
      });
    }

    let unblocked = packet.amount;
    if (packet.type !== DAMAGE_TYPE.HP_LOSS && target.armor > 0 && unblocked > 0) {
      const absorbed = Math.min(target.armor, unblocked);
      target.armor -= absorbed;
      unblocked -= absorbed;
      packet.logs.push(`방어도(-${absorbed})`);
    }

    const prevHp = target.hp;
    target.hp = Math.max(0, target.hp - unblocked);
    const actualLost = prevHp - target.hp;

    const note = packet.logs.length ? ` [${packet.logs.join(', ')}]` : '';
    this.emitLog(`💥 [${packet.reason}] ${target.name}에게 ${packet.baseAmount} -> 실제 HP -${actualLost} (남은 HP: ${target.hp})${note}`, 'log-hit');

    if (actualLost > 0) {
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onHpDecreased) def.onHpDecreased(this, target, actualLost, inst);
      });
    }
    if (packet.isStrike && source !== target) {
      target.runTrackers.hitTakenCount += 1;
      target.getPassives().forEach(({ def, inst }) => {
        if (def.onAfterBeStruck) def.onAfterBeStruck(this, target, source, packet, inst);
      });
    }

    this.notifyRender();
    this.checkCombatEnd();
  }

  checkCombatEnd() {
    if (this.combatEnded || !this.onCombatEndCallback) return;
    if (this.enemy.maxHp > 0 && this.enemy.hp <= 0) {
      this.combatEnded = true;
      this.emitLog(`🏆 [전투 승리] ${this.enemy.name} 처치!`, 'log-sys');
      this.onCombatEndCallback(true);
    } else if (this.player.hp <= 0) {
      this.combatEnded = true;
      this.emitLog(`💀 [전투 패배] 토끼기사가 쓰러졌습니다...`, 'log-hit');
      this.onCombatEndCallback(false);
    }
  }

  gainArmor(target, amount, reason) {
    target.armor += amount;
    this.emitLog(`🛡️ [${reason}] ${target.name} 방어도 +${amount} (현재:${target.armor})`, 'log-sys');
    this.notifyRender();
  }

  heal(target, amount, reason) {
    const prev = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + amount);
    this.emitLog(`💚 [${reason}] ${target.name} HP +${target.hp - prev} 회복`, 'log-sys');
    this.notifyRender();
  }

  recoverEnergy(user, amount) {
    user.energy = Math.min(user.maxEnergy, user.energy + amount);
    this.emitLog(`⚡ ${user.name} 활력 +${amount} (현재:${user.energy}/${user.maxEnergy})`, 'log-sys');
    this.notifyRender();
  }

  drawCards(user, count) {
    for (let i = 0; i < count; i++) {
      if (!user.deck.length) {
        if (!user.graveyard.length) break;
        user.deck = RNG.sampleUnique(user.graveyard, user.graveyard.length);
        user.graveyard = [];
        this.emitLog(`🔄 [묘지 셔플] 묘지를 섞어 덱을 보충했습니다.`, 'log-sys');
      }
      user.hand.push(user.deck.pop());
    }
    this.notifyRender();
  }

  drawSpecificFromDeck(user, predicate, label) {
    const idx = user.deck.findIndex(predicate);
    if (idx !== -1) {
      const [c] = user.deck.splice(idx, 1);
      user.hand.push(c);
      this.emitLog(`🔍 덱에서 [${c.name}] 카드를 뽑았습니다.`, 'log-sys');
    } else {
      this.emitLog(`🔍 덱에 [${label}] 카드가 없습니다.`, 'log-sys');
    }
    this.notifyRender();
  }

  moveCardToGraveyard(user, card, fromPlay = false) {
    user.graveyard.push(card);
    if (card.id !== '024') user.combatTrackers.lastGraveyardCard = card;
    if (fromPlay && card.onEnterGraveyardFromPlay) {
      card.onEnterGraveyardFromPlay(this, user, this.getOpponent(user));
    }
  }

  playCardFromHand(handIndex) {
    if (this.combatEnded) return false;
    const card = this.player.hand[handIndex];
    if (!card) return false;

    const blocked = this.player.getPassives().some(({ def, inst }) => def.canPlayCard && !def.canPlayCard(card, this, this.player, inst));
    if (blocked) {
      this.emitLog(`❌ 상태이상(난투 등)으로 인해 [${card.name}] 카드를 사용할 수 없습니다!`, 'log-hit');
      return false;
    }

    const cost = this.getEffectiveCost(this.player, card);
    if (this.player.energy < cost) {
      this.emitLog(`❌ 활력이 부족합니다. (필요: ${cost}, 현재: ${this.player.energy})`, 'log-hit');
      return false;
    }

    this.player.energy -= cost;
    this.player.hand.splice(handIndex, 1);
    this.emitLog(`🃏 [카드 발동] ${this.player.name} -> [${card.name}]`, 'log-sys');

    this.resolveCardEffect(card, this.player, this.enemy, false);
    this.moveCardToGraveyard(this.player, card, true);
    this.notifyRender();

    if (this.onCardPlayedCallback) this.onCardPlayedCallback(card);
    return true;
  }

  resolveCardEffect(card, user, target, isReplay = false) {
    if (this.replayDepth > 3) return;
    if (isReplay) this.replayDepth++;
    const prev = this.activeCard;
    this.activeCard = card;
    card.play(this, user, target, isReplay);

    user.getPassives().forEach(({ def, inst }) => {
      if (def.onCardPlayed) def.onCardPlayed(this, user, card, target, isReplay, inst);
    });

    this.activeCard = prev;
    if (isReplay) this.replayDepth--;
  }

  startPlayerTurn() {
    if (this.combatEnded) return;
    this.emitLog(`========== [${this.turn}턴: 플레이어 차례] ==========`, 'log-sys');

    const carryOver = Math.min(this.player.maxCarryOver, this.player.energy);
    let recovery = 3;
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.modifyEnergyRecovery) recovery = def.modifyEnergyRecovery(recovery, this, this.player, inst);
    });
    this.player.energy = Math.min(this.player.maxEnergy, carryOver + recovery);

    [this.player, this.enemy].forEach(ent => {
      [...ent.statuses].forEach(s => {
        const def = StatusDB[s.id];
        if (def.decayTiming === DECAY_TIMING.CASTER_TURN_START && s.caster === this.player) {
          this.statuses.changeStacks(ent, s, -1, 'DISPEL');
        }
        if (ent === this.player && def.onOwnerTurnStart) {
          def.onOwnerTurnStart(this, ent, s);
        }
      });
    });

    // 특성 등 턴 시작 훅 (전술 도약 등)
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.onPlayerTurnStart) def.onPlayerTurnStart(this, this.player, this.turn, inst);
    });

    this.drawCards(this.player, 3);

    // 드로우 직후 훅 (천무지체 등)
    this.player.getPassives().forEach(({ def, inst }) => {
      if (def.onPlayerTurnPostDraw) def.onPlayerTurnPostDraw(this, this.player, this.turn, inst);
    });

    this.notifyRender();
  }

  endPlayerTurn() {
    if (this.combatEnded) return;
    while (this.player.hand.length > 0) {
      const card = this.player.hand.pop();
      card.turnCostOverride = null;
      this.moveCardToGraveyard(this.player, card, false);
    }

    this.processTurnEndStatuses(this.player);
    if (this.combatEnded) return;

    [...this.player.statuses].forEach(s => {
      if (StatusDB[s.id].decayTiming === DECAY_TIMING.PLAYER_TURN_END_CONTEXT) {
        this.statuses.changeStacks(this.player, s, -1, 'REMOVE');
      }
    });

    // 적 턴 시작
    this.emitLog(`========== [${this.turn}턴: ${this.enemy.name} 차례] ==========`, 'log-sys');
    [this.player, this.enemy].forEach(ent => {
      [...ent.statuses].forEach(s => {
        const def = StatusDB[s.id];
        if (def.decayTiming === DECAY_TIMING.CASTER_TURN_START && s.caster === this.enemy) {
          this.statuses.changeStacks(ent, s, -1, 'DISPEL');
        }
        if (ent === this.enemy && def.onOwnerTurnStart) {
          def.onOwnerTurnStart(this, ent, s);
        }
      });
    });
    if (this.combatEnded) return;

    // 적 패턴 실행 (EnemyDB)
    const enemyDef = EnemyDB[this.enemy.enemyId];
    if (enemyDef) {
      const action = enemyDef.getAction(this.turn, this, this.enemy, this.player);

      // ✅ [추가된 난투 검사 로직] 적이 낼 행동이 MAGIC인데 적 몸에 난투가 있으면 스킵
      const hasBrawl = this.statuses.get(this.enemy, 'BRAWL');
      if (action.type === 'MAGIC' && hasBrawl) {
        this.emitLog(`🚫 [난투] 효과로 인해 ${this.enemy.name}의 [${action.name}] 발동이 취소되었습니다!`, 'log-hit');
      } else {
        this.emitLog(`👾 [${this.enemy.name}] '${action.name}' 발동!`, 'log-hit');
        action.execute();
      }
    }
    if (this.combatEnded) return;

    this.processTurnEndStatuses(this.enemy);
    if (this.combatEnded) return;

    this.turn += 1;
    this.startPlayerTurn();
  }

  processTurnEndStatuses(entity) {
    const sorted = [...entity.statuses].sort((a, b) => (a.id === 'CONTRACT' ? 1 : b.id === 'CONTRACT' ? -1 : 0));
    sorted.forEach(s => {
      if (this.combatEnded) return;
      const def = StatusDB[s.id];
      if (def.onOwnerTurnEnd) def.onOwnerTurnEnd(this, entity, s);
    });
  }
}

/**
 * ============================================================================
 * 6. RogueManager (로그라이크 '기사도' 진행, 길 선택, 보상 큐, 세이브 계승)
 * ============================================================================
 */
const RogueManager = {
  STARTER_DECK: ['001', '001', '001', '010', '010', '010', '005', '005', '002', '002', '011', '011'],
  MIN_DECK_SIZE: 9,
  BASE_MAX_DECK_SIZE: 21,

  state: {
    active: false,
    floor: 1,
    hp: 150,
    maxHp: 150,
    hitTakenCount: 0,
    deck: [],
    relics: [],
    traits: [],
    clearedBosses: []
  },

  currentPaths: [],
  activeNodeQueue: [],
  currentNodeType: null,
  rewardQueue: [],

  getMaxFloor() {
    const bossCount = Object.values(EnemyDB).filter(e => e.isBoss).length;
    return bossCount * 10;
  },

  getMaxDeckSize() {
    let max = this.BASE_MAX_DECK_SIZE;
    this.state.traits.forEach(tid => {
      const def = TraitDB[tid];
      if (def && def.modifyMaxDeckSize) max = def.modifyMaxDeckSize(max);
    });
    return max;
  },

  getRewardCardChoiceCount() {
    let cnt = 3;
    this.state.traits.forEach(tid => {
      const def = TraitDB[tid];
      if (def && def.modifyRewardCardChoices) cnt = def.modifyRewardCardChoices(cnt);
    });
    return cnt;
  },

  hasRelic(id) { return this.state.relics.includes(id); },
  hasTrait(id) { return this.state.traits.includes(id); },

  syncToSaveLedger() {
    SaveLedger.set('roguelike.active', this.state.active);
    SaveLedger.set('roguelike.floor', this.state.floor);
    SaveLedger.set('roguelike.hp', this.state.hp);
    SaveLedger.set('roguelike.maxHp', this.state.maxHp);
    SaveLedger.set('roguelike.hitTakenCount', this.state.hitTakenCount);
    SaveLedger.set('roguelike.deck', this.state.deck.join(','));
    SaveLedger.set('roguelike.relics', this.state.relics.join(','));
    SaveLedger.set('roguelike.traits', this.state.traits.join(','));
    SaveLedger.set('roguelike.clearedBosses', this.state.clearedBosses.join(','));
  },

  loadFromSaveLedger() {
    const parseList = (str) => String(str || '').split(',').map(s => s.trim()).filter(Boolean);
    this.state.active = Boolean(SaveLedger.get('roguelike.active'));
    this.state.floor = Number(SaveLedger.get('roguelike.floor')) || 1;
    this.state.hp = Number(SaveLedger.get('roguelike.hp')) || 150;
    this.state.maxHp = Number(SaveLedger.get('roguelike.maxHp')) || 150;
    this.state.hitTakenCount = Number(SaveLedger.get('roguelike.hitTakenCount')) || 0;
    const savedDeck = parseList(SaveLedger.get('roguelike.deck'));
    this.state.deck = savedDeck.length >= this.MIN_DECK_SIZE ? savedDeck : [...this.STARTER_DECK];
    this.state.relics = parseList(SaveLedger.get('roguelike.relics'));
    this.state.traits = parseList(SaveLedger.get('roguelike.traits'));
    this.state.clearedBosses = parseList(SaveLedger.get('roguelike.clearedBosses'));
  },

  startNewRun() {
    this.state = {
      active: true,
      floor: 1,
      hp: 150,
      maxHp: 150,
      hitTakenCount: 0,
      deck: [...this.STARTER_DECK],
      relics: [],
      traits: [],
      clearedBosses: []
    };
    this.syncToSaveLedger();
    AppUI.showRogueHubView();
    this.renderStartingTraitSelection(); // 길 선택 대신 특성 선택 화면 렌더링
  },

  continueFromSave() {
    this.loadFromSaveLedger();
    this.state.active = true;
    this.enterHubForCurrentFloor();
  },

  renderStartingTraitSelection() {
    this.renderHud();
    const allTraits = Object.keys(TraitDB);
    // 무작위로 중복 없는 특성 3개 추출
    const offeredIds = RNG.sampleUnique(allTraits, 3);

    const html = offeredIds.map(tid => {
      const t = TraitDB[tid];
      return `
        <div class="choice-card" onclick="RogueManager.pickStartingTrait('${tid}')">
          <div style="font-weight:bold; color:#7dcfff;">🧬 [${t.id}] ${t.name}</div>
          <div style="font-size:12px; color:#a9b1d6;">${t.desc}</div>
        </div>
      `;
    }).join('');

    document.getElementById('rogue-content').innerHTML = `
      <h2>🌟 기사도 시작 — 초기 특성 선택 (3택 1)</h2>
      <div style="font-size:12px; color:#9ece6a;">이번 여정을 함께할 특성을 하나 선택하십시오.</div>
      <div class="choice-grid">${html}</div>
    `;
  },

  pickStartingTrait(traitId) {
    this.state.traits.push(traitId);
    
    // 빳빳한 털(+50 HP), 빠른 발굽(-50 HP) 등의 획득 즉시 반영 효과 실행
    const def = TraitDB[traitId];
    if (def && def.onAcquire) def.onAcquire(this.state);
    
    this.syncToSaveLedger();
    
    // 특성을 골랐으므로 정상적인 1층 길 선택 화면으로 진입
    this.enterHubForCurrentFloor();
  },

  enterHubForCurrentFloor() {
    AppUI.showRogueHubView();
    const maxFloor = this.getMaxFloor();

    // 구현된 최고층을 돌파한 경우: 다음 층 진행 불가 & 세이브/계승 안내 화면
    if (this.state.floor > maxFloor) {
      this.renderMaxFloorReached(maxFloor);
      return;
    }

    this.generatePathsForCurrentFloor();
    this.renderPathSelection();
  },

  generatePathsForCurrentFloor() {
    const floor = this.state.floor;
    
    // 1. 보스층 처리
    if (floor % 10 === 0) {
      this.currentPaths = ['BOSS'];
      return;
    }

    // 2. 방 개수는 무조건 2~3개로 고정 (선택권 박탈 방지)
    const optionCount = RNG.randInt(2, 3);

    // 3. 중복 없는 방 후보군 풀 설정 (1층은 끔살 방지를 위해 엘리트 제외)
    const pool = (floor % 10 === 1) ? ['NORMAL', 'CAMP'] : ['NORMAL', 'ELITE', 'CAMP'];

    // 4. 후보군에서 중복 없이 뽑기 (똑같은 방 2~3개 뜨는 바보 현상 해결)
    let options = RNG.sampleUnique(pool, Math.min(optionCount, pool.length));

    // 5. 요람사진(006) 유물 또는 9층 확정 캠프 룰 적용
    const isCampMilestone = (floor % 10 === 9);
    const forceCamp = isCampMilestone || this.hasRelic('006');

    if (forceCamp && !options.includes('CAMP')) {
      // 이미 2~3개의 서로 다른 방이 보장되어 있으므로, 
      // 랜덤한 방 1개를 덮어써도 일반 전투나 엘리트 전투가 최소 1개는 반드시 살아남음
      options[RNG.randInt(0, options.length - 1)] = 'CAMP';
    }

    // 배열을 한 번 더 섞어서 UI상 캠프의 위치가 랜덤하게 나오도록 처리
    this.currentPaths = RNG.sampleUnique(options, options.length);
  },

  selectPath(type) {
    this.currentNodeType = type;
    if (type === 'CAMP') {
      this.renderCampView();
    } else {
      this.startCombatNode(type);
    }
  },

  startCombatNode(type) {
    let enemyId = 'COAL_MOLE';
    if (type === 'NORMAL') {
      const normals = Object.values(EnemyDB).filter(e => !e.isBoss && !e.isElite);
      enemyId = RNG.pickRandom(normals).id;
    } else if (type === 'ELITE') {
      const elites = Object.values(EnemyDB).filter(e => e.isElite);
      enemyId = RNG.pickRandom(elites).id;
    } else if (type === 'BOSS') {
      const allBosses = Object.values(EnemyDB).filter(e => e.isBoss);
      const uncleared = allBosses.filter(b => !this.state.clearedBosses.includes(b.id));
      enemyId = RNG.pickRandom(uncleared.length > 0 ? uncleared : allBosses).id;
    }

    const eng = AppUI.engine;
    eng.combatEnded = false;
    eng.turn = 1;
    eng.replayDepth = 0;

    // 플레이어 엔티티 구성 및 유물/특성 장착
    eng.player = new Entity('토끼기사', this.state.maxHp, true);
    eng.player.hp = this.state.hp;
    eng.player.runTrackers.hitTakenCount = this.state.hitTakenCount;

    this.state.traits.forEach(tid => {
      const def = TraitDB[tid];
      if (!def) return;
      eng.player.traits.push({ id: tid, state: {} });
      if (def.modifyMaxEnergy) eng.player.maxEnergy = def.modifyMaxEnergy(eng.player.maxEnergy);
      if (def.modifyMaxCarryOver) eng.player.maxCarryOver = def.modifyMaxCarryOver(eng.player.maxCarryOver);
    });
    this.state.relics.forEach(rid => {
      const def = RelicDB[rid];
      if (!def) return;
      const inst = { id: rid, state: {} };
      if (def.onInit) def.onInit(inst);
      eng.player.relics.push(inst);
    });

    eng.player.energy = 0;
    const shuffledIds = RNG.sampleUnique(this.state.deck, this.state.deck.length);
    eng.player.deck = shuffledIds.map(cid => eng.createCardInstance(cid));

    // 적 엔티티 구성
    // const eDef = EnemyDB[enemyId];
    // eng.enemy = new Entity(eDef.name, eDef.maxHp, false);
    // eng.enemy.enemyId = enemyId;

    const eDef = EnemyDB[enemyId];
    
    // 1~10층 = 0 / 11~20층 = 1 / 21~30층 = 2
    const tier = Math.floor((this.state.floor - 1) / 10); 
    
    // 최대 HP 1.45배 복리 스케일링 (소수점 버림)
    const scaledHp = Math.floor(eDef.maxHp * Math.pow(1.45, tier));
    
    eng.enemy = new Entity(eDef.name, scaledHp, false);
    eng.enemy.enemyId = enemyId;
    
    // 적 엔티티에 티어당 물리 데미지 +3 가산 속성 부여
    eng.enemy.tierDamageBonus = tier * 3;

    eng.onCardPlayedCallback = null;
    eng.onCombatEndCallback = (victory) => this.onCombatFinished(victory, type, enemyId);

    AppUI.enterRogueCombatView();
    AppUI.clearLogs();
    eng.emitLog(`⚔️ [${this.state.floor}층 ${type} 전투] ${eDef.name} (HP ${eDef.maxHp}) 등장!`, 'log-sys');
    eng.startPlayerTurn();
  },

  onCombatFinished(victory, nodeType, enemyId) {
    const eng = AppUI.engine;
    this.state.hp = eng.player.hp;
    this.state.hitTakenCount = eng.player.runTrackers.hitTakenCount;

    if (!victory) {
      this.state.active = false;
      this.syncToSaveLedger();
      AppUI.showRogueHubView();
      document.getElementById('rogue-content').innerHTML = `
        <h2>💀 기사도 등반 실패 (${this.state.floor}층)</h2>
        <div>적의 공세에 쓰러졌습니다. 로비로 돌아가 새로운 런을 시작할 수 있습니다.</div>
        <div><button class="primary" onclick="AppUI.returnToLobby()">로비로 돌아가기</button></div>
      `;
      this.renderHud();
      return;
    }

    // 승리 보상 큐 구성
    this.rewardQueue = [];
    if (nodeType === 'NORMAL') {
      this.rewardQueue.push({ type: 'CARD' });
      if (this.hasRelic('005') && RNG.randInt(1, 100) <= 10) {
        this.rewardQueue.push({ type: 'RELIC', reason: '유물 [마도서] 10% 발동!' });
      }
    } else if (nodeType === 'ELITE') {
      this.rewardQueue.push({ type: 'CARD' });
      this.rewardQueue.push({ type: 'RELIC' });
    } else if (nodeType === 'BOSS') {
      if (!this.state.clearedBosses.includes(enemyId)) {
        this.state.clearedBosses.push(enemyId);
      }
      const healAmt = Math.floor(this.state.maxHp * 0.5);
      this.state.hp = Math.min(this.state.maxHp, this.state.hp + healAmt);
      this.rewardQueue.push({ type: 'CARD', note: `보스 격파! 체력 50%(+${healAmt})가 회복되었습니다.` });
      this.rewardQueue.push({ type: 'RELIC' });
      this.rewardQueue.push({ type: 'TRAIT' });
    }

    this.syncToSaveLedger();
    AppUI.showRogueHubView();
    this.processNextReward();
  },

  processNextReward() {
    this.renderHud();
    if (this.rewardQueue.length === 0) {
      this.advanceFloor();
      return;
    }

    const reward = this.rewardQueue.shift();
    if (reward.type === 'CARD') {
      this.renderCardReward(reward.note);
    } else if (reward.type === 'RELIC') {
      this.renderRelicReward(reward.reason);
    } else if (reward.type === 'TRAIT') {
      this.renderTraitReward();
    }
  },

  advanceFloor() {
    this.state.floor += 1;
    // 특성 001 빳빳한 털: 층을 오를 때마다 HP 7 회복
    this.state.traits.forEach(tid => {
      const def = TraitDB[tid];
      if (def && def.onAdvanceFloor) def.onAdvanceFloor(this.state);
    });
    this.syncToSaveLedger();
    this.enterHubForCurrentFloor();
  },

  // --- UI 렌더링 (허브/캠프/보상/덱 관리) ---
  renderHud() {
    const maxDeck = this.getMaxDeckSize();
    const maxFloor = this.getMaxFloor();
    const relicBadges = this.state.relics.map(id => `<span class="badge relic" title="${RelicDB[id]?.desc || ''}">🏺 ${RelicDB[id]?.name || id}</span>`).join('');
    const traitBadges = this.state.traits.map(id => `<span class="badge trait" title="${TraitDB[id]?.desc || ''}">🧬 ${TraitDB[id]?.name || id}</span>`).join('');

    const html = `
      <div class="rogue-hud-top">
        <span>🏰 층수: ${this.state.floor}층 (현재 구현 상한: ${maxFloor}층)</span>
        <span>❤️ HP: ${this.state.hp} / ${this.state.maxHp}</span>
        <span>🃏 덱: ${this.state.deck.length}장 (최소 ${this.MIN_DECK_SIZE} ~ 최대 ${maxDeck}장)</span>
        <span style="color:#9ece6a;">누적 피격(복수): ${this.state.hitTakenCount}회</span>
      </div>
      <div class="badge-row">
        ${traitBadges || '<span style="font-size:11px; color:#565f89;">보유 특성 없음</span>'}
        ${relicBadges || '<span style="font-size:11px; color:#565f89; margin-left:8px;">보유 유물 없음</span>'}
      </div>
    `;
    document.getElementById('rogue-hud').innerHTML = html;
    document.getElementById('stage-rogue-hud').innerHTML = html;
  },

  renderPathSelection() {
    this.renderHud();
    const labelMap = {
      NORMAL: { title: '⚔️ 일반 전투', desc: '일반 적과 교전합니다. (승리 시 카드 보상)' },
      ELITE: { title: '🔥 엘리트 전투', desc: '강력한 엘리트 적과 교전합니다. (승리 시 카드 + 유물 보상)' },
      CAMP: { title: '⛺ 캠프', desc: '체력 35% 회복 또는 덱에서 카드 1장을 제거합니다.' },
      BOSS: { title: '👑 보스 전투', desc: '10층마다 등장하는 보스와 결전을 치릅니다. (HP 50% 회복 + 카드 + 유물 + 특성)' }
    };

    const cardsHtml = this.currentPaths.map((type) => {
      const info = labelMap[type];
      return `
        <div class="choice-card" onclick="RogueManager.selectPath('${type}')">
          <div style="font-weight:bold; font-size:15px; color:#7aa2f7;">${info.title}</div>
          <div style="font-size:12px; color:#a9b1d6;">${info.desc}</div>
        </div>
      `;
    }).join('');

    document.getElementById('rogue-content').innerHTML = `
      <h2>🧭 ${this.state.floor}층 — 길 선택 (${this.currentPaths.length}개의 갈림길)</h2>
      <div style="font-size:12px; color:#9ece6a;">원하는 경로를 1개 선택하여 전진하십시오.</div>
      <div class="choice-grid">${cardsHtml}</div>
    `;
  },

  renderCampView() {
    this.renderHud();
    const healAmt = Math.floor(this.state.maxHp * 0.35);
    const canRemove = this.state.deck.length > this.MIN_DECK_SIZE;

    const deckButtons = this.state.deck.map((cid, idx) => {
      const c = CardDB[cid];
      return `
        <button ${!canRemove ? 'disabled' : ''} onclick="RogueManager.campRemoveCard(${idx})">

        </button>
      `;
    }).join('');

    document.getElementById('rogue-content').innerHTML = `
      <h2>⛺ ${this.state.floor}층 캠프 — 휴식 또는 카드 제거 (택 1)</h2>
      <div class="choice-grid">
        <div class="choice-card" onclick="RogueManager.campHeal(${healAmt})">
          <div style="font-weight:bold; color:#73daca; font-size:15px;">💚 체력 35% 회복 (+${healAmt} HP)</div>
          <div style="font-size:12px; color:#a9b1d6;">현재 체력을 ${Math.min(this.state.maxHp, this.state.hp + healAmt)} / ${this.state.maxHp}(으)로 회복하고 다음 층으로 이동합니다.</div>

      </div>

      </div>

    `;
  },

  campHeal(amount) {
    this.state.hp = Math.min(this.state.maxHp, this.state.hp + amount);
    this.advanceFloor();
  },

  campRemoveCard(deckIndex) {
    if (this.state.deck.length <= this.MIN_DECK_SIZE) return;
    this.state.deck.splice(deckIndex, 1);
    this.advanceFloor();
  },

  renderCardReward(note = '') {
    const choiceCount = this.getRewardCardChoiceCount();
    const allCardIds = Object.keys(CardDB);
    const offeredIds = RNG.sampleUnique(allCardIds, choiceCount);
    const maxDeck = this.getMaxDeckSize();
    const isDeckFull = this.state.deck.length >= maxDeck;

    const cardsHtml = offeredIds.map(cid => {
      const c = CardDB[cid];
      const copies = this.state.deck.filter(x => x === cid).length;
      const canAdd = !isDeckFull && copies < 3;
      return `
        <div class="choice-card" style="${!canAdd ? 'opacity:0.45; cursor:not-allowed;' : ''}" onclick="${canAdd ? `RogueManager.pickCardReward('${cid}')` : ''}">
          <div style="font-weight:bold; color:#e0af68;">[${c.id}] ${c.name} (코스트 ${c.cost})</div>
          <div style="font-size:11px; color:#7dcfff;">${c.type} | 현재 보유: ${copies}/3장</div>
          <div style="font-size:12px; color:#a9b1d6;">${c.desc}</div>
          ${!canAdd ? `<div style="font-size:11px; color:#f7768e;">${isDeckFull ? '덱 상한 도달 (하단에서 기존 카드 제거 후 획득 가능)' : '동명 카드 3장 제한 도달'}</div>` : ''}
        </div>
      `;
    }).join('');

    document.getElementById('rogue-content').innerHTML = `
      <h2>🎁 전투 승리 — 카드 보상 (${choiceCount}택 1 또는 건너뛰기)</h2>
      ${note ? `<div style="color:#9ece6a; font-size:13px;">${note}</div>` : ''}
      <div class="choice-grid">${cardsHtml}</div>
      <div><button onclick="RogueManager.processNextReward()">보상 건너뛰기 ▶</button></div>
    `;
  },

  pickCardReward(cardId) {
    if (this.state.deck.length >= this.getMaxDeckSize()) return;
    const copies = this.state.deck.filter(x => x === cardId).length;
    if (copies >= 3) return;
    this.state.deck.push(cardId);
    this.syncToSaveLedger();
    this.processNextReward();
  },

  renderRelicReward(reason = '') {
    const unowned = Object.keys(RelicDB).filter(id => !this.hasRelic(id));
    if (unowned.length === 0) {
      this.processNextReward();
      return;
    }
    const offered = RNG.sampleUnique(unowned, 2);
    const html = offered.map(rid => {
      const r = RelicDB[rid];
      return `
        <div class="choice-card" onclick="RogueManager.pickRelicReward('${rid}')">
          <div style="font-weight:bold; color:#e0af68;">🏺 [${r.id}] ${r.name}</div>
          <div style="font-size:12px; color:#a9b1d6;">${r.desc}</div>
        </div>
      `;
    }).join('');

    document.getElementById('rogue-content').innerHTML = `
      <h2>🏺 유물 보상 (2택 1 또는 건너뛰기)</h2>
      ${reason ? `<div style="color:#bb9af7; font-size:13px;">${reason}</div>` : ''}
      <div class="choice-grid">${html}</div>
      <div><button onclick="RogueManager.processNextReward()">유물 건너뛰기 ▶</button></div>
    `;
  },

  pickRelicReward(relicId) {
    if (!this.hasRelic(relicId)) this.state.relics.push(relicId);
    this.syncToSaveLedger();
    this.processNextReward();
  },

  renderTraitReward() {
    const unowned = Object.keys(TraitDB).filter(id => !this.hasTrait(id));
    if (unowned.length === 0) {
      this.processNextReward();
      return;
    }
    const offered = RNG.sampleUnique(unowned, 2);
    const html = offered.map(tid => {
      const t = TraitDB[tid];
      return `
        <div class="choice-card" onclick="RogueManager.pickTraitReward('${tid}')">
          <div style="font-weight:bold; color:#7dcfff;">🧬 [${t.id}] ${t.name}</div>
          <div style="font-size:12px; color:#a9b1d6;">${t.desc}</div>
        </div>
      `;
    }).join('');

    document.getElementById('rogue-content').innerHTML = `
      <h2>🧬 보스 격파 — 특성 보상 (2택 1 또는 건너뛰기)</h2>
      <div class="choice-grid">${html}</div>
      <div><button onclick="RogueManager.processNextReward()">특성 건너뛰기 ▶</button></div>
    `;
  },

  pickTraitReward(traitId) {
    if (!this.hasTrait(traitId)) {
      this.state.traits.push(traitId);
      const def = TraitDB[traitId];
      if (def && def.onAcquire) def.onAcquire(this.state);

    this.processNextReward();
  },

  renderMaxFloorReached(maxFloor) {

    document.getElementById('rogue-content').innerHTML = `
      <h2>🚩 현재 구현된 최고층(${maxFloor}층) 돌파 완료! (다음 등반 대기층: ${this.state.floor}층)</h2>
      <div style="font-size:13px; line-height:1.6; color:#a9b1d6;">

        보스 개수 제한으로 현재는 ${this.state.floor}층 진입이 잠겨 있으며, <b>보유 카드(${this.state.deck.length}장), HP(${this.state.hp}/${this.state.maxHp}), 특성, 유물, 클리어 보스 기록</b>이 SaveLedger에 온전히 보존되었습니다.<br>
        로비에서 세이브 텍스트를 백업해 두면 추후 보스가 추가되었을 때 ${this.state.floor}층부터 그대로 계승하여 오를 수 있습니다.
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="primary" onclick="AppUI.returnToLobby()">세이브 보존 후 로비로 이동</button>
      </div>
    `;
  },

  toggleDeckModal() {
    const modal = document.getElementById('rogue-deck-modal');
    if (!modal.classList.contains('hidden')) {
      modal.classList.add('hidden');
      return;
    }
    modal.classList.remove('hidden');
    this.renderDeckModal();

  renderDeckModal() {
    const modal = document.getElementById('rogue-deck-modal');
    // canRemove 변수 선언부 삭제 (이제 쓰지 않으므로 지워도 무방합니다)

    const listHtml = this.state.deck.map((cid, idx) => {
      const c = CardDB[cid];
      return `
        <div style="background:#24283b; border:1px solid #414868; padding:8px; border-radius:4px; width:180px; display:flex; flex-direction:column; gap:4px;">
          <div style="font-weight:bold; color:#e0af68; font-size:12px;">[${c.id}] ${c.name} (${c.cost})</div>
          <div style="font-size:11px; color:#a9b1d6;">${c.desc}</div>
          <!-- 여기에 있던 <button>덱에서 버리기</button> 코드를 삭제했습니다 -->
        </div>
      `;
    }).join('');

    modal.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>🃏 현재 보유 덱 (${this.state.deck.length} / ${this.getMaxDeckSize()}장)</h2>
        <button onclick="RogueManager.toggleDeckModal()">닫기</button>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">${listHtml}</div>
    `;
  },

  removeDeckCardFromModal(idx) {
    if (this.state.deck.length <= this.MIN_DECK_SIZE) return;
    this.state.deck.splice(idx, 1);
    this.syncToSaveLedger();
    this.renderHud();
    this.renderDeckModal();
  }
};

function buildZenaComboLogs() {
  const logs = [];
  for (let i = 1; i <= 10; i++) {
    logs.push(`[적 행동 ${i}합] 석궁병 제나가 [스텝 밟기] 사용! -> 활력 +1 회복`);
    logs.push(`[적 행동 ${i}합] 석궁병 제나가 [토끼풀] 사용! -> 자신에게 재생 3 부여 및 덱에서 1장 드로우 (덱 압축 가속!)`);
  }
  logs.push(`⚡ [적 피니시] 덱을 끝까지 압축한 석궁병 제나가 축적된 활력으로 [화살 4연사] 발동!`);
  logs.push(`💥 제나의 1타 적중! (-6) | 2타 적중! (-6) | 3타 적중! (-6) | 4타 적중! (-6) -> 총 24 데미지! (피격 횟수 +4)`);
  return logs;
}

const StorySequencer = {
  engine: null, activeChapter: null, queue: [], stageVars: {}, state: 'IDLE',
  logTimer: null, pendingLogs: [], pendingLogAfterHook: null,

  init(combatEngine) { this.engine = combatEngine; },

  startChapter(chapterId) {
    const chapter = StoryDB.find(c => c.id === chapterId);
    if (!chapter) return;
    this.clearTimers();
    RNG.reset();
    this.activeChapter = chapter;
    this.queue = [...chapter.script];
    this.stageVars = {};
    this.state = 'IDLE';

    this.engine.combatEnded = false;
    this.engine.onCombatEndCallback = null;
    this.engine.onCardPlayedCallback = () => {
      if (this.state === 'WAIT_CARD') {
        this.state = 'IDLE';
        document.getElementById('hand-guide').textContent = '';
        this.next();
      }
    };

    this.engine.player = new Entity('토끼기사', 150, true);
    this.engine.enemy = new Entity('???', 0, false);
    AppUI.enterStoryStageView();
    AppUI.setCombatBoardVisible(false);
    AppUI.clearLogs();
    AppUI.renderStageActors();
    this.next();
  },

  clearTimers() { if (this.logTimer) { clearInterval(this.logTimer); this.logTimer = null; } },

  next() {
    if (this.queue.length === 0) {
      AppUI.showDialogue('시스템', `[${this.activeChapter.title}] 클리어! 세이브 데이터가 갱신되었습니다. (클릭 시 로비로 이동)`, false);
      this.state = 'WAIT_FINISH';
      return;
    }
    this.executeCommand(this.queue.shift());
  },

  executeCommand(cmd) {
    switch (cmd.type) {
      case 'TEXT':
        this.state = 'WAIT_TEXT';
        AppUI.showDialogue(cmd.speaker || '나레이션', cmd.text, true);
        break;
      case 'CHOICE':
        this.state = 'WAIT_CHOICE';
        AppUI.showChoices(cmd.speaker || '선택', cmd.text, cmd.options, (opt) => {
          this.stageVars[cmd.varKey] = opt.value;
          if (opt.saveFlag) SaveLedger.set(opt.saveFlag.key, opt.saveFlag.val);
          this.state = 'IDLE';
          this.next();
        });
        break;
      case 'SETUP_STAGE':
        this.engine.player = new Entity(cmd.player.name, cmd.player.maxHp || cmd.player.hp, true);
        this.engine.player.hp = cmd.player.hp;
        this.engine.enemy = new Entity(cmd.enemy.name, cmd.enemy.maxHp || cmd.enemy.hp, false);
        this.engine.enemy.hp = cmd.enemy.hp;
        AppUI.setCombatBoardVisible(true);
        AppUI.renderStageActors();
        this.next();
        break;
      case 'SCRIPTED_LOGS':
        this.state = 'WAIT_LOGS';
        this.pendingLogs = [...(cmd.logs || [])];
        this.pendingLogAfterHook = () => {
          if (typeof cmd.playerHpDelta === 'number') {
            this.engine.player.hp = Math.max(0, Math.min(this.engine.player.maxHp, this.engine.player.hp + cmd.playerHpDelta));
          }
          if (typeof cmd.setHitTakenCount === 'number') {
            this.engine.player.runTrackers.hitTakenCount = cmd.setHitTakenCount;
          }
          AppUI.renderStageActors();
        };
        AppUI.showDialogue('전투 연출 진행 중', '적의 연속 행동 로그가 출력되고 있습니다... (클릭 시 즉시 완료)', true);
        this.logTimer = setInterval(() => {
          if (this.pendingLogs.length > 0) this.engine.emitLog(this.pendingLogs.shift(), 'log-story');
          else this.finishPendingLogs();
        }, 70);
        break;
      case 'BRANCH':
        if (typeof cmd.condition === 'function' && cmd.condition(this.stageVars, SaveLedger) && Array.isArray(cmd.steps)) {
          this.queue.unshift(...cmd.steps);
        }
        this.next();
        break;
      case 'RIG_NEXT_RANDOM':
        RNG.rigNext(cmd.value);
        this.next();
        break;
      case 'GIVE_CARD': {
        this.state = 'WAIT_CARD';
        this.engine.player.hand = [];
        const cardInst = this.engine.createCardInstance(cmd.cardId, !!cmd.freeCost);
        this.engine.player.hand.push(cardInst);
        const guideMsg = cmd.prompt || `손패에 지급된 [${cardInst.name}] 카드를 클릭하여 사용하십시오.`;
        document.getElementById('hand-guide').textContent = `👉 ${guideMsg}`;
        AppUI.showDialogue('카드 사용 대기', guideMsg, false);
        AppUI.renderStageActors();
        break;
      }
      case 'SET_SAVE':
        SaveLedger.set(cmd.key, cmd.value);
        this.next();
        break;
      default:
        this.next();
        break;
    }
  },

  finishPendingLogs() {
    this.clearTimers();
    while (this.pendingLogs.length > 0) this.engine.emitLog(this.pendingLogs.shift(), 'log-story');
    if (this.pendingLogAfterHook) { this.pendingLogAfterHook(); this.pendingLogAfterHook = null; }
    this.state = 'IDLE';
    this.next();
  },

  onUserClickDialogue() {
    if (this.state === 'WAIT_TEXT') { this.state = 'IDLE'; this.next(); }
    else if (this.state === 'WAIT_LOGS') this.finishPendingLogs();
    else if (this.state === 'WAIT_FINISH') { this.state = 'IDLE'; AppUI.returnToLobby(); }
  }
};

      infoEl.innerHTML = `
        기본 HP 150 | 덱 구축: 9~21장 (동명 최대 3장)<br>
        현재 구현된 보스 수 기준 최고층: <b>${maxFloor}층</b> (이후 층은 세이브 계승 지원)
      `;
    }
  },

  hideAllViews() {
    ['view-lobby', 'view-rogue-hub', 'view-stage', 'btn-return-lobby', 'btn-toggle-deck'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
  },

  returnToLobby() {
    StorySequencer.clearTimers();
    if (this.mode === 'ROGUE_COMBAT' || this.mode === 'ROGUE_HUB') {
      RogueManager.syncToSaveLedger();
    }
    this.mode = 'LOBBY';
    this.hideAllViews();
    document.getElementById('view-lobby').classList.remove('hidden');
    this.refreshSaveTextarea();
  },

  showRogueHubView() {
    this.mode = 'ROGUE_HUB';
    this.hideAllViews();
    document.getElementById('view-rogue-hub').classList.remove('hidden');
    document.getElementById('btn-return-lobby').classList.remove('hidden');
    document.getElementById('btn-toggle-deck').classList.remove('hidden');
    RogueManager.renderHud();
  },

  enterRogueCombatView() {
    this.mode = 'ROGUE_COMBAT';
    this.hideAllViews();
    document.getElementById('view-stage').classList.remove('hidden');
    document.getElementById('stage-rogue-hud').classList.remove('hidden');
    document.getElementById('vn-dialogue-box').classList.add('hidden');
    document.getElementById('combat-board').classList.remove('hidden');
    document.getElementById('btn-end-turn').classList.remove('hidden');
    document.getElementById('btn-return-lobby').classList.remove('hidden');
    document.getElementById('hand-guide').textContent = '';
    RogueManager.renderHud();
    this.renderStageActors();
  },

  enterStoryStageView() {
    this.mode = 'STORY';
    this.hideAllViews();
    document.getElementById('view-stage').classList.remove('hidden');
    document.getElementById('stage-rogue-hud').classList.add('hidden');
    document.getElementById('vn-dialogue-box').classList.remove('hidden');
    document.getElementById('btn-end-turn').classList.add('hidden');
    document.getElementById('btn-return-lobby').classList.remove('hidden');
  },

  setCombatBoardVisible(visible) {
    const board = document.getElementById('combat-board');
    if (visible) board.classList.remove('hidden');
    else board.classList.add('hidden');
  },

  showDialogue(speaker, text, showNextHint = true) {
    document.getElementById('vn-speaker').textContent = speaker;
    document.getElementById('vn-text').textContent = text;
    document.getElementById('vn-choices').classList.add('hidden');
    document.getElementById('vn-choices').innerHTML = '';
    const hint = document.getElementById('vn-next-hint');
    if (showNextHint) hint.classList.remove('hidden');
    else hint.classList.add('hidden');
  },

  showChoices(speaker, text, options, onSelect) {
    document.getElementById('vn-speaker').textContent = speaker;
    document.getElementById('vn-text').textContent = text;
    document.getElementById('vn-next-hint').classList.add('hidden');
    const choicesEl = document.getElementById('vn-choices');
    choicesEl.classList.remove('hidden');
    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'vn-choice-btn';
      btn.textContent = opt.label;
      btn.onclick = () => onSelect(opt);
      choicesEl.appendChild(btn);
    });
  },

  clearLogs() { document.getElementById('log-box').innerHTML = ''; },

  appendLog(msg, cls = '') {
    const box = document.getElementById('log-box');
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = msg;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  },

  renderStageActors() {
    const p = this.engine.player;
    const e = this.engine.enemy;

    const renderBadges = (ent) => ent.statuses.map(s => {
      const def = StatusDB[s.id];
      const cls = def.category === 'BUFF' ? 'buff' : def.category === 'DEBUFF' ? 'debuff' : 'context';
      const acc = s.accumulated ? `(누적:${s.accumulated})` : '';
      return `<span class="badge ${cls}">${def.name} ${s.stacks}${acc}</span>`;
    }).join('');

    document.getElementById('sprite-player').innerHTML = `[도트 슬롯]<br>${p.name}`;
    document.getElementById('info-player').innerHTML = `
      <div class="actor-name">${p.name}</div>
      <div class="stat-line">
        <span>❤️ HP: ${p.hp} / ${p.maxHp}</span>
        <span>🛡️ 방어도: ${p.armor}</span>
        <span>⚡ 활력: ${p.energy} / ${p.maxEnergy}</span>
        <span style="color:#9ece6a;">덱:${p.deck.length} | 묘지:${p.graveyard.length} | 피격:${p.runTrackers.hitTakenCount}</span>
      </div>
      <div class="badge-row">${renderBadges(p)}</div>
    `;

    // 적 동적 예고(Intent) 계산
    let intentHtml = '';
    if (e.enemyId && EnemyDB[e.enemyId] && e.hp > 0) {
      const act = EnemyDB[e.enemyId].getAction(this.engine.turn, this.engine, e, p);
      
      let intentText = act.intent;
      // 물리 공격을 하는 의도이고, 티어 보정치가 있다면 텍스트 뒤에 가산 표기
      if (e.tierDamageBonus > 0 && intentText.includes('물리')) {
        intentText += ` <span style="color:#f7768e;">(스케일링 +${e.tierDamageBonus})</span>`;
      }
      
      intentHtml = `<div class="intent-box">예고 [${act.name}]: ${intentText}</div>`;
    }

    document.getElementById('sprite-enemy').innerHTML = `[도트 슬롯]<br>${e.name}`;
    document.getElementById('info-enemy').innerHTML = e.maxHp > 0 ? `
      <div class="actor-name">${e.name}</div>
      ${intentHtml}
      <div class="stat-line">
        <span>❤️ HP: ${e.hp} / ${e.maxHp}</span>
        <span>🛡️ 방어도: ${e.armor}</span>
      </div>
      <div class="badge-row">${renderBadges(e)}</div>
    ` : `<div class="actor-name" style="color:#565f89;">대기 중</div>`;

    const handEl = document.getElementById('hand-cards');
    const canInteract = (this.mode === 'ROGUE_COMBAT' && !this.engine.combatEnded) || (this.mode === 'STORY' && StorySequencer.state === 'WAIT_CARD');
    handEl.innerHTML = p.hand.map((card, idx) => {
      const cost = this.engine.getEffectiveCost(p, card);
      const hits = this.engine.getEffectiveHits(p, card);
      const usable = canInteract && p.energy >= cost;
      return `
        <div class="card ${!usable ? 'disabled' : ''}" onclick="${usable ? `AppUI.engine.playCardFromHand(${idx})` : ''}">
          <div><span class="card-cost">${cost}</span><div class="card-title">[${card.id}] ${card.name}</div></div>
          <div class="card-meta">${card.type}${hits > 0 ? ` | 타수: ${hits}` : ''}${card.isTemporary ? ' | 임시' : ''}</div>
          <div class="card-desc">${card.desc}</div>
        </div>
      `;
    }).join('');
  }
};

AppUI.init();
</script>
</body>
</html>
